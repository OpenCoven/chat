name: ChatCompanion
options:
  bundleIdPrefix: ai.opencoven
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9LR8Z8UQ9X
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  ChatCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.chat.companion
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  ChatCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, TestSupport]
    dependencies:
      - target: ChatCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ChatCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, TestSupport]
    dependencies:
      - target: ChatCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
