name: Ubuntu archive connectivity diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Probe signed Ubuntu indexes without changing DNS or installing packages
        run: |
          set -u
          probe_dir=$(mktemp -d)
          for base in \
            https://archive.ubuntu.com/ubuntu \
            https://azure.archive.ubuntu.com/ubuntu \
            https://mirrors.edge.kernel.org/ubuntu \
            https://mirrors.kernel.org/ubuntu \
            https://mirror.math.princeton.edu/pub/ubuntu \
            https://ubuntu.osuosl.org/ubuntu; do
            for suite in jammy noble; do
              printf '\nPROBE %s %s\n' "$base" "$suite"
              if curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
                --connect-timeout 5 --max-time 12 --output "$probe_dir/InRelease" "$base/dists/$suite/InRelease" \
                && gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$probe_dir/InRelease"; then
                printf 'MIRROR_OK %s %s\n' "$base" "$suite"
              else
                printf 'MIRROR_UNAVAILABLE %s %s\n' "$base" "$suite"
              fi
            done
          done
