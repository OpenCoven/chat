name: Ubuntu dependency installation diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Verify signed indexes and install the required dependencies
        run: |
          set -euo pipefail
          # Use an independent Ubuntu mirror when Canonical's DNS is unavailable.
          # Keep Ubuntu's suites, components, signing keys and apt verification.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -E -i \
                -e 's#mirror[+]file:/etc/apt/apt-mirrors[.]txt#https://mirrors.edge.kernel.org/ubuntu#g' \
                -e 's#https?://(azure[.]archive|archive|security)[.]ubuntu[.]com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' "$sources"
            fi
          done
          . /etc/os-release
          for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-security"; do
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 --output "$RUNNER_TEMP/InRelease" \
              "https://mirrors.edge.kernel.org/ubuntu/dists/$suite/InRelease"
            gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$RUNNER_TEMP/InRelease"
          done
          sudo apt-get update
          dpkg --print-architecture
          dpkg-query -W build-essential libgtk-3-dev || true
          sudo apt-cache policy build-essential libgtk-3-dev xvfb python3-pyatspi
          sudo apt-cache dumpavail | awk '/^Package:/ {count++} END {print "AVAILABLE_PACKAGES", count}'
          sudo ls -la /var/lib/apt/lists
          sudo find /etc/apt/preferences.d -type f -exec cat {} \;
          if [ "$VERSION_ID" = 24.04 ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              xvfb openbox xdotool xclip at-spi2-core python3-pyatspi dbus-x11 \
              orca speech-dispatcher ibus ibus-gtk3 imagemagick sqlite3 libfuse2t64
            printf 'NATIVE_APT_INSTALL_OK Ubuntu %s\n' "$VERSION_ID"
          fi
          fuse=libfuse2
          if [ "$VERSION_ID" = 24.04 ]; then fuse=libfuse2t64; fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf "$fuse" file
          if [ "$VERSION_ID" = 24.04 ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              xvfb openbox xdotool xclip at-spi2-core python3-pyatspi dbus-x11 \
              orca speech-dispatcher ibus ibus-gtk3 imagemagick sqlite3
          fi
          printf 'APT_INSTALL_OK Ubuntu %s with Ubuntu signature verification enabled\n' "$VERSION_ID"
