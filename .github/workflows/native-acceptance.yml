# Drives the published OpenCoven Chat installers with native input -- real HID
# events on macOS, SendInput on Windows, XTEST on Linux -- and reads the window
# back through each platform's accessibility tree and screen reader (#504, #515).
# No WebDriver is attached and nothing runs in the page, so the bytes driven are
# exactly the ones published, checked against the release's SHA256SUMS first.
# Each lane is a fresh runner user, so the app starts with an empty profile.
# Results are native OS-level automation, never hand-run results.
#
# With `release` empty, each lane instead builds the dispatched commit on its
# runner, with the release workflow's toolchain and bundle command but no
# signing, and drives that build. Such a run is a candidate check before a tag:
# its results say "candidate ... not a published release" and never stand in
# for the published installers.
#
# `asking` chooses the asking-for-permission rows (#573). `as-built` follows the
# build's own switch (ASKING_ENABLED). `switched-on` builds a candidate with
# asking on, for that run only; run.mjs refuses it for a published release.
# `rows-on-as-built` drives the asking rows whatever the build says, to show them
# failing where asking is off.
name: Native acceptance

on:
  workflow_dispatch:
    inputs:
      release:
        description: Published tag whose installers to drive, for example v0.0.8. Leave empty to build this ref and drive it as a candidate.
        required: false
        default: ''
        type: string
      asking:
        description: 'Asking for permission (#573): as-built follows the build; switched-on builds this candidate with asking on, for this run only; rows-on-as-built drives the asking rows against the build as it is.'
        required: false
        default: as-built
        type: choice
        options:
          - as-built
          - switched-on
          - rows-on-as-built

permissions:
  contents: read

env:
  RELEASE: ${{ inputs.release }}
  NATIVE_ASKING: ${{ inputs.asking || 'as-built' }}

jobs:
  macos:
    name: macOS (${{ matrix.arch }} DMG)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: inputs.release == ''
        with:
          version: 10.34.0
          run_install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.release == ''
        with:
          toolchain: 1.95.0
      - name: Build this commit as a candidate (unsigned; not a release)
        if: inputs.release == ''
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          if [ "$NATIVE_ASKING" = switched-on ]; then node scripts/native-acceptance/switch-asking.mjs; fi
          corepack pnpm exec tauri build --bundles dmg
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          echo "CANDIDATE_INSTALLER=$PWD/$dmg" >> "$GITHUB_ENV"
      - name: Drive the DMG
        run: bash scripts/native-acceptance/lane-mac.sh "$RELEASE" "$RUNNER_TEMP/native" "${{ matrix.arch }}"
      - name: Results
        if: always()
        run: cat "$RUNNER_TEMP/native/environment.txt" "$RUNNER_TEMP/native/results.md" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/native

  windows:
    name: Windows (${{ matrix.installer }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        installer: [msi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: inputs.release == ''
        with:
          version: 10.34.0
          run_install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.release == ''
        with:
          toolchain: 1.95.0
      - name: Build this commit as a candidate (unsigned; not a release)
        if: inputs.release == ''
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          if [ "$NATIVE_ASKING" = switched-on ]; then node scripts/native-acceptance/switch-asking.mjs; fi
          corepack pnpm exec tauri build --bundles msi
          f="$(find src-tauri/target/release/bundle/msi -maxdepth 1 -name '*.msi' -print -quit)"
          echo "CANDIDATE_INSTALLER=$(cygpath -w "$PWD/$f")" >> "$GITHUB_ENV"
      - name: Drive the installer
        shell: powershell
        run: scripts/native-acceptance/lane-windows.ps1 -Release $env:RELEASE -Out "$env:RUNNER_TEMP\native" -Installer ${{ matrix.installer }}
      - name: Results
        if: always()
        shell: powershell
        run: Get-Content "$env:RUNNER_TEMP\native\environment.txt", "$env:RUNNER_TEMP\native\results.md" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-windows-${{ matrix.installer }}
          path: ${{ runner.temp }}/native

  linux:
    name: Linux (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [deb]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: inputs.release == ''
        with:
          version: 10.34.0
          run_install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.release == ''
        with:
          toolchain: 1.95.0
      - name: Use an independently hosted Ubuntu mirror
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Preserve the runner's source definitions and their authenticated index identity.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' https://mirrors.edge.kernel.org/ubuntu | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          else
            # Use an independent Ubuntu mirror when Canonical's DNS is unavailable.
            # Keep Ubuntu's suites, components, signing keys and apt verification.
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$sources" ]; then
                sudo sed -E -i \
                  -e 's#mirror[+]file:/etc/apt/apt-mirrors[.]txt#https://mirrors.edge.kernel.org/ubuntu#g' \
                  -e 's#https?://(azure[.]archive|archive|security)[.]ubuntu[.]com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' "$sources"
              fi
            done
          fi
      - name: Build this commit as a candidate (not a release)
        if: inputs.release == ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf file
          corepack pnpm install --frozen-lockfile
          if [ "$NATIVE_ASKING" = switched-on ]; then node scripts/native-acceptance/switch-asking.mjs; fi
          corepack pnpm exec tauri build --bundles ${{ matrix.kind }}
          f="$(find src-tauri/target/release/bundle/${{ matrix.kind }} -maxdepth 1 -name '*.${{ matrix.kind }}' -print -quit)"
          echo "CANDIDATE_INSTALLER=$PWD/$f" >> "$GITHUB_ENV"
      - name: Drive the package
        run: bash scripts/native-acceptance/lane-linux.sh "$RELEASE" "$RUNNER_TEMP/native" "${{ matrix.kind }}"
      - name: Results
        if: always()
        run: cat "$RUNNER_TEMP/native/environment.txt" "$RUNNER_TEMP/native/results.md" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-linux-${{ matrix.kind }}
          path: ${{ runner.temp }}/native
