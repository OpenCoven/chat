          EOF
          broker_root="/tmp/opencoven-unix-broker"
          (umask 077 && mkdir "$broker_root")
          cc -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra -Werror -O2 \
            scripts/unix-artifact-handoff.c \
            -o "$broker_root/unix-artifact-handoff"
          chmod 500 "$broker_root/unix-artifact-handoff"
      - name: Compute reviewed Unix tool path
        id: unix-tool-path
        if: matrix.platform != 'win32-x64'
        run: 'node --input-type=module --eval "import { appendFileSync } from ''node:fs''; import { resolveExecutableInvocation, resolveUnixToolPath } from ''./scripts/executable-resolution.mjs''; const toolPath = resolveUnixToolPath([''git'']); const nodeExecutable = resolveExecutableInvocation(''node'', process.env, process.platform, []).resolvedCommand; const pnpmExecutable = resolveExecutableInvocation(''pnpm'', process.env, process.platform, []).resolvedCommand; const rustupExecutable = resolveExecutableInvocation(''rustup'', process.env, process.platform, []).resolvedCommand; appendFileSync(process.env.GITHUB_OUTPUT, ''tool_path='' + toolPath + ''\nnode_executable='' + nodeExecutable + ''\npnpm_executable='' + pnpmExecutable + ''\nrustup_executable='' + rustupExecutable + ''\n'');"'
      - name: Run supervised Unix production and handoff
        if: matrix.platform != 'win32-x64'
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
        run: |
          set -euo pipefail
          mkdir -m 700 .artifacts
          if [[ "$(uname -s)" == Darwin ]]; then
            chmod -RN .artifacts
          fi
          broker_root="/tmp/opencoven-unix-broker"
          cleanup_broker_root() {
            rm -f -- "$broker_root/unix-artifact-handoff"
            rmdir "$broker_root" 2>/dev/null || true
          }
          trap cleanup_broker_root EXIT
          sudo --non-interactive scripts/unix-producer-supervisor.sh \
            --platform "${{ matrix.platform }}" \
            --source "$GITHUB_WORKSPACE" \
            --destination "$GITHUB_WORKSPACE/.artifacts/client-v1-conformance-${{ matrix.platform }}.json" \
            --temp-root "$broker_root" \
            --handoff-helper "/tmp/opencoven-unix-broker/unix-artifact-handoff" \
            --command scripts/unix-producer-command.sh \
            --node-executable "${{ steps['unix-tool-path'].outputs.node_executable }}" \
            --pnpm-executable "${{ steps['unix-tool-path'].outputs.pnpm_executable }}" \
            --rustup-executable "${{ steps['unix-tool-path'].outputs.rustup_executable }}" \
            --tool-path "${{ steps['unix-tool-path'].outputs.tool_path }}" \
            --validator-revision "$OPENCOVEN_VALIDATOR_REVISION"
      - name: Validate broker-owned Unix platform record
        if: matrix.platform != 'win32-x64'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval "
            import { lstatSync, readFileSync } from 'node:fs';
            import { scanPhase1ArtifactText } from './scripts/phase1-artifact-secret-scan.mjs';
            const sort = (value) =>
              Array.isArray(value)
                ? value.map(sort)
                : value !== null && typeof value === 'object'
                  ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sort(value[key])]))
                  : value;
            const path = process.argv[1];
            const expectedPlatform = process.argv[2];
            const stats = lstatSync(path);
            const text = readFileSync(path, 'utf8');
            const value = JSON.parse(text);
            if (
              !stats.isFile() ||
              stats.isSymbolicLink() ||
              stats.nlink !== 1 ||
              stats.uid !== process.getuid() ||
              (stats.mode & 0o777) !== 0o600 ||
              stats.size < 1 ||
              stats.size > 1048576 ||
              value === null ||
              Array.isArray(value) ||
              value.schemaVersion !== 2 ||
              value.platform !== expectedPlatform ||
              JSON.stringify(sort(value), null, 2) + '\n' !== text
            ) {
              throw new Error('Broker-owned platform record is not canonical');
            }
            scanPhase1ArtifactText(text);
          " ".artifacts/client-v1-conformance-${{ matrix.platform }}.json" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-v1-conformance-${{ matrix.platform }}
          path: .artifacts/client-v1-conformance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: true
  validate-conformance-artifacts:
    name: validate-conformance-artifacts
    if: github.ref == 'refs/heads/main'
    needs: platform-conformance
    runs-on: ubuntu-24.04
    environment: client-v1-conformance
    permissions:
      contents: read
    outputs:
      darwin_arm64_sha256: ${{ steps.validate.outputs.darwin_arm64_sha256 }}
      linux_x64_sha256: ${{ steps.validate.outputs.linux_x64_sha256 }}
      win32_x64_sha256: ${{ steps.validate.outputs.win32_x64_sha256 }}
    steps:
      - name: Require protected validator revision
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
        run: |
          set -euo pipefail
          if [[ ! "$OPENCOVEN_VALIDATOR_REVISION_INPUT" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$OPENCOVEN_VALIDATOR_REVISION_INPUT" != "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" ]]; then
            echo "Protected workflow revision does not match the environment validator revision." >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-darwin-arm64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-linux-x64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-win32-x64
          path: .artifacts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/sdk
          ref: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Validate exact SDK schema, parser, and scanner
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const validatorRoot = resolve('validator');
          const {
            parseFrozenConformanceLock,
            parsePlatformEvidence,
            scanConformanceEvidence,
            serializeCanonicalJson,
            validateFrozenConformanceBindings,
          } = await import(
            pathToFileURL(resolve(validatorRoot, 'scripts/conformance-contract.mjs')).href
          );
          const lock = parseFrozenConformanceLock(
            readFileSync(
              resolve(validatorRoot, 'conformance/client-v1-cross-repository-lock.json'),
              'utf8',
            ),
            'protected SDK conformance lock',
          );
          const { schema } = validateFrozenConformanceBindings(
            lock,
            readFileSync(
              resolve(
                validatorRoot,
                'conformance/client-v1-cross-repository-evidence.schema.json',
              ),
              'utf8',
            ),
            readFileSync(
              resolve(
                validatorRoot,
                'conformance/client-v1-cross-repository-assertions.json',
              ),
              'utf8',
            ),
          );
          const records = [
            [
              'darwin-arm64',
              'darwin_arm64_sha256',
              '.artifacts/client-v1-conformance-darwin-arm64.json',
            ],
            [
              'linux-x64',
              'linux_x64_sha256',
              '.artifacts/client-v1-conformance-linux-x64.json',
            ],
            [
              'win32-x64',
              'win32_x64_sha256',
              '.artifacts/client-v1-conformance-win32-x64.json',
            ],
          ];
          for (const [platform, output, recordPath] of records) {
            const path = resolve(recordPath);
            const stats = lstatSync(path);
            if (!stats.isFile() || stats.isSymbolicLink() || stats.size < 1 || stats.size > 1048576) {
              throw new Error(`${platform} uploaded artifact is not one bounded regular file`);
            }
            const bytes = readFileSync(path);
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            const record = parsePlatformEvidence(text, `${platform} uploaded artifact`, schema);
            scanConformanceEvidence(record);
            if (record.platform !== platform || serializeCanonicalJson(record) !== text) {
              throw new Error(`${platform} uploaded artifact is not exact canonical SDK evidence`);
            }
            const digest = createHash('sha256').update(bytes).digest('hex');
            appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${digest}\n`, 'utf8');
          }
          EOF
  attest-conformance-artifacts:
    name: attest-conformance-artifacts
    if: github.ref == 'refs/heads/main'
    needs: validate-conformance-artifacts
    runs-on: ubuntu-24.04
    environment: client-v1-conformance
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-darwin-arm64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-linux-x64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-win32-x64
          path: .artifacts
      - name: Compare freshly downloaded artifact digests
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          OPENCOVEN_DARWIN_ARM64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.darwin_arm64_sha256 }}
          OPENCOVEN_LINUX_X64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.linux_x64_sha256 }}
          OPENCOVEN_WIN32_X64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.win32_x64_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$OPENCOVEN_VALIDATOR_REVISION_INPUT" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$OPENCOVEN_VALIDATOR_REVISION_INPUT" != "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" ]]; then
            echo "Protected workflow revision does not match the environment validator revision." >&2
            exit 1
          fi
          record=".artifacts/client-v1-conformance-darwin-arm64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_DARWIN_ARM64_SHA256" ]]
          record=".artifacts/client-v1-conformance-linux-x64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_LINUX_X64_SHA256" ]]
          record=".artifacts/client-v1-conformance-win32-x64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_WIN32_X64_SHA256" ]]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-darwin-arm64.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-linux-x64.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-win32-x64.json
  aggregate-conformance:
    name: aggregate-conformance
    if: github.ref == 'refs/heads/main'
    needs: attest-conformance-artifacts
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Confirm protected evidence matrix
        run: echo "protected evidence matrix completed"
