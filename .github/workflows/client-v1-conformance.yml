          }
          Invoke-Checked `
            -FilePath $git `
            -ArgumentList @(
              '-C',
              $workspace,
              '-c',
              'credential.helper=',
              '-c',
              'core.hooksPath=NUL',
              '-c',
              'fetch.fsckObjects=true',
              '-c',
              'transfer.fsckObjects=true',
              '-c',
              'protocol.https.allow=always',
              'fetch',
              '--quiet',
              '--no-tags',
              '--depth=1',
              'origin',
              $phase1Lock.harness.revision
            ) `
            -Label 'Chat harness exact-SHA fetch'
          Invoke-Checked `
            -FilePath $git `
            -ArgumentList @(
              '-C',
              $workspace,
              'update-ref',
              'refs/opencoven/phase1-harness',
              $phase1Lock.harness.revision
            ) `
            -Label 'Chat harness authority ref'

          $counterpartsRoot = Join-Path $root 'counterparts'
          $sdkRoot = Join-Path $counterpartsRoot 'sdk'
          $sdkEvidenceRoot = Join-Path $counterpartsRoot 'sdk-evidence'
          $sdkValidatorRoot = Join-Path $counterpartsRoot 'sdk-validator'
          $caveRoot = Join-Path $counterpartsRoot 'coven-cave'
          $covenRoot = Join-Path $counterpartsRoot 'coven'
          Checkout-ExactRepository `
            -Repository $phase1Lock.sdk.repository `
            -Revision $phase1Lock.sdk.revision `
            -Destination $sdkRoot `
            -Label 'SDK candidate'
          Checkout-ExactRepository `
            -Repository $phase1Lock.evidence.repository `
            -Revision $phase1Lock.evidence.revision `
            -Destination $sdkEvidenceRoot `
            -Label 'SDK evidence authority'
          Checkout-ExactRepository `
            -Repository 'OpenCoven/sdk' `
            -Revision $env:OPENCOVEN_VALIDATOR_REVISION `
            -Destination $sdkValidatorRoot `
            -Label 'SDK validator'
          Checkout-ExactRepository `
            -Repository $phase1Lock.cave.repository `
            -Revision $phase1Lock.cave.revision `
            -Destination $caveRoot `
            -Label 'Cave authority' `
            -FetchHistory
          Checkout-ExactRepository `
            -Repository $phase1Lock.coven.repository `
            -Revision $phase1Lock.coven.revision `
            -Destination $covenRoot `
            -Label 'Coven authority'
          $env:OPENCOVEN_CHAT_ROOT = $workspace
          $env:OPENCOVEN_SDK_ROOT = $sdkRoot
          $env:OPENCOVEN_SDK_EVIDENCE_ROOT = $sdkEvidenceRoot
          $env:OPENCOVEN_SDK_VALIDATOR_ROOT = $sdkValidatorRoot
          $env:OPENCOVEN_CAVE_ROOT = $caveRoot
          $env:OPENCOVEN_COVEN_ROOT = $covenRoot

          if ((& $node --version).Trim() -ne 'v24.18.1') {
            throw 'Pinned Node version changed.'
          }
          Invoke-Checked `
            -FilePath $node `
            -ArgumentList @(
              $npmCli,
              'install',
              '--global',
              '--prefix',
              $pnpmRoot,
              '--ignore-scripts',
              '--no-audit',
              '--no-fund',
              '--cache',
              $npmCache,
              $pnpmArchive
            ) `
            -Label 'Pinned pnpm installation'
          $pnpmCli = Join-Path $pnpmRoot 'node_modules\pnpm\bin\pnpm.cjs'
          Assert-RegularFile -Path $pnpmCli -Label 'Pinned pnpm CLI entrypoint'
          if ((& $node $pnpmCli --version).Trim() -ne '10.34.0') {
            throw 'Pinned pnpm version changed.'
          }

          Push-Location $workspace
          try {
            Invoke-Checked `
              -FilePath $node `
              -ArgumentList @(
                $pnpmCli,
                'install',
                '--frozen-lockfile',
                '--ignore-scripts',
                "--config.store-dir=$($env:PNPM_STORE_DIR)"
              ) `
              -Label 'pnpm install --frozen-lockfile --ignore-scripts'

            if (
              (& $node --version).Trim() -ne 'v24.18.1' -or
              "pnpm@$((& $node $pnpmCli --version).Trim())" -ne 'pnpm@10.34.0' -or
              -not (& $rustc --version).StartsWith('rustc 1.95.0 ')
            ) {
              throw 'Frozen Windows toolchain does not match.'
            }
            $tauriVersion = (& $node $pnpmCli exec tauri --version).Trim()
            if ($tauriVersion -ne 'tauri-cli 2.11.4') {
              throw 'Frozen Tauri CLI version changed.'
            }

            $harnessPath = Join-Path $workspace 'scripts\phase1-conformance.mjs'
            $recordPath = $env:OPENCOVEN_WINDOWS_SOURCE_RECORD
            Invoke-Checked `
              -FilePath $node `
              -ArgumentList @(
                $harnessPath,
                '--validator-revision',
                $env:OPENCOVEN_VALIDATOR_REVISION,
                '--platform',
                'win32-x64',
                '--output',
                $recordPath
              ) `
              -Label 'Windows schema-v2 conformance production'

            Write-Host 'Validate canonical platform record'
            $canonicalValidation = @"
          import { lstatSync, readFileSync } from 'node:fs';
