                  {
                      internal bool Overflow;
                      internal string Text;
                  }

                  private sealed class DirectoryQuotaFailureState : IDisposable
                  {
                      private readonly object syncRoot = new object();
                      private readonly ManualResetEventSlim signal =
                          new ManualResetEventSlim(false);
                      private string quotaLabel;
                      private bool monitorError;

                      internal bool IsSet
                      {
                          get
                          {
                              return signal.IsSet;
                          }
                      }

                      internal string QuotaLabel
                      {
                          get
                          {
                              lock (syncRoot)
                              {
                                  return quotaLabel;
                              }
                          }
                      }

                      internal bool MonitorError
                      {
                          get
                          {
                              lock (syncRoot)
                              {
                                  return monitorError;
                              }
                          }
                      }

                      internal void RecordQuotaExceeded(string label)
                      {
                          lock (syncRoot)
                          {
                              if (!signal.IsSet)
                              {
                                  quotaLabel = label;
                                  signal.Set();
                              }
                          }
                      }

                      internal void RecordMonitorError()
                      {
                          lock (syncRoot)
                          {
                              if (!signal.IsSet)
                              {
                                  monitorError = true;
                                  signal.Set();
                              }
                          }
                      }

                      public void Dispose()
                      {
                          signal.Dispose();
                      }
                  }

                  private sealed class ScheduledTaskReference
                  {
                      internal string FolderPath;
                      internal string Name;
                      internal string Path;
                  }

                  private sealed class WindowsSealedArtifactSource : IDisposable
                  {
                      private IntPtr sourceHandle;
                      private List<IntPtr> parentHandles;

                      internal WindowsSealedArtifactSource(
                          IntPtr source,
                          List<IntPtr> parents,
                          BY_HANDLE_FILE_INFORMATION information,
                          FILE_ATTRIBUTE_TAG_INFO attributes,
                          int length,
                          string supervisorSid)
                      {
                          sourceHandle = source;
                          parentHandles = parents;
                          Information = information;
                          Attributes = attributes;
                          Length = length;
                          SupervisorSid = supervisorSid;
                      }

                      internal BY_HANDLE_FILE_INFORMATION Information;
                      internal FILE_ATTRIBUTE_TAG_INFO Attributes;
                      internal int Length;
                      internal string SupervisorSid;

                      internal IntPtr TakeSourceHandle()
                      {
                          IntPtr handle = sourceHandle;
                          sourceHandle = IntPtr.Zero;
                          if (handle == IntPtr.Zero)
                          {
                              throw new InvalidOperationException(
                                  "Sealed artifact source handle was already consumed.");
                          }
                          return handle;
                      }

                      public void Dispose()
                      {
                          CloseIfValid(sourceHandle);
                          sourceHandle = IntPtr.Zero;
                          if (parentHandles != null)
                          {
                              for (int index = parentHandles.Count - 1;
                                  index >= 0;
                                  index--)
                              {
                                  CloseIfValid(parentHandles[index]);
                              }
                              parentHandles = null;
                          }
                      }
                  }

