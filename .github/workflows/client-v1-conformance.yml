        run: 'node --input-type=module --eval "import { appendFileSync } from ''node:fs''; import { readPhase1ConformanceLock } from ''./scripts/phase1-conformance-lock.mjs''; const lock = readPhase1ConformanceLock(); for (const repository of [''sdk'', ''cave'', ''coven'']) { appendFileSync(process.env.GITHUB_OUTPUT, repository + ''_repository='' + lock[repository].repository + ''\n''); appendFileSync(process.env.GITHUB_OUTPUT, repository + ''_revision='' + lock[repository].revision + ''\n''); } appendFileSync(process.env.GITHUB_OUTPUT, ''evidence_repository='' + lock.evidence.repository + ''\n''); appendFileSync(process.env.GITHUB_OUTPUT, ''evidence_revision='' + lock.evidence.revision + ''\n'');"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
