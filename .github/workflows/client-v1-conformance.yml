              throw "Frozen harness module bytes do not match: $($modulePin[0])"
            }
          }
          Write-Host 'Frozen harness module graph verified.'

          $phase1Lock = Get-Content `
            -LiteralPath (Join-Path $workspace 'phase1-conformance.lock.json') `
            -Raw |
            ConvertFrom-Json
          if (
            $phase1Lock.version -ne 5 -or
            $phase1Lock.harness.repository -cne 'OpenCoven/chat' -or
            $phase1Lock.harness.revision -cnotmatch '^[0-9a-f]{40}$' -or
            $phase1Lock.sdk.repository -cne 'OpenCoven/sdk' -or
            $phase1Lock.sdk.revision -cnotmatch '^[0-9a-f]{40}$' -or
            $phase1Lock.evidence.repository -cne 'OpenCoven/sdk' -or
            $phase1Lock.evidence.revision -cnotmatch '^[0-9a-f]{40}$' -or
            $phase1Lock.cave.repository -cne 'OpenCoven/coven-cave' -or
            $phase1Lock.cave.revision -cnotmatch '^[0-9a-f]{40}$' -or
            $phase1Lock.coven.repository -cne 'OpenCoven/coven' -or
            $phase1Lock.coven.revision -cnotmatch '^[0-9a-f]{40}$'
