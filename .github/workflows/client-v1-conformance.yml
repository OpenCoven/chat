            $freshValidationStart.UseShellExecute = $false
            $freshValidationStart.CreateNoWindow = $true
            $freshValidationStart.RedirectStandardInput = $true
            $freshValidationStart.RedirectStandardOutput = $true
            $freshValidationStart.RedirectStandardError = $true
            $freshValidationStart.Environment.Clear()
            $freshValidationStart.Environment['SystemRoot'] = 'C:\Windows'
            $freshValidationStart.Environment['WINDIR'] = 'C:\Windows'
