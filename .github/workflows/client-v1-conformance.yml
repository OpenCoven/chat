name: client-v1 conformance
on:
  workflow_dispatch:
    inputs:
      validator_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-supervisor:
    name: build-windows-supervisor
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps['upload-supervisor'].outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Set up frozen Rust
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Build frozen Windows supervisor
        run: bash scripts/phase1-windows-supervisor-build.sh
      - id: upload-supervisor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-process-supervisor-win32-x64
          path: tools/phase1-process-supervisor/target/x86_64-pc-windows-gnu/release/phase1-process-supervisor.exe
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  platform-conformance:
    name: platform-conformance (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: windows-supervisor
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    environment: client-v1-conformance
    permissions:
      actions: read
      contents: read
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Bootstrap supervised Windows conformance
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          OPENCOVEN_CHAT_REPOSITORY: ${{ github.repository }}
          OPENCOVEN_CHAT_SHA: ${{ github.sha }}
          OPENCOVEN_WINDOWS_IMAGE_OS: 'win25-vs2026'
          OPENCOVEN_WINDOWS_IMAGE_VERSION: '20260824.214.3'
          OPENCOVEN_WINDOWS_BUILD: '26100.33296'
          OPENCOVEN_WINDOWS_KERNEL32_VERSION: '10.0.26100.33296'
          OPENCOVEN_WINDOWS_POWERSHELL_VERSION: '7.6.5'
          OPENCOVEN_WINDOWS_POWERSHELL_PATH: 'C:\Program Files\PowerShell\7\pwsh.exe'
          OPENCOVEN_WINDOWS_DOTNET_VERSION: '10.0.11'
          OPENCOVEN_WINDOWS_VS_VERSION: '18.9.12112.369'
          OPENCOVEN_WINDOWS_VS_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          OPENCOVEN_WINDOWS_MSVC_VERSION: '14.44.35207'
          OPENCOVEN_WINDOWS_MSVC_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207'
          OPENCOVEN_WINDOWS_CL_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe'
          OPENCOVEN_WINDOWS_LINK_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\link.exe'
          OPENCOVEN_WINDOWS_SDK_VERSION: '10.0.26100.0'
          OPENCOVEN_WINDOWS_RC_PATH: 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\rc.exe'
          OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID: ${{ needs['windows-supervisor'].outputs.artifact_id }}
          OPENCOVEN_WINDOWS_GITHUB_API_URL: ${{ github.api_url }}
          OPENCOVEN_WINDOWS_GITHUB_REPOSITORY: ${{ github.repository }}
          OPENCOVEN_WINDOWS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Require-LowercaseGitOid {
            param([AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Protected workflow revision must be an exact lowercase 40-hex commit.'
            }
            return $Value
          }

          function Assert-NoReparsePath {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            if (-not [IO.Path]::IsPathFullyQualified($Path)) {
              throw "$Label is not absolute."
            }
            $item = Get-Item -LiteralPath $Path -Force
            while ($null -ne $item) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "$Label contains a reparse component."
              }
              if ($item -is [IO.FileInfo]) {
                $item = $item.Directory
              } else {
                $item = $item.Parent
              }
            }
          }

          function Assert-MicrosoftSignature {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if (
              $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(?:^|, )CN=Microsoft '
            ) {
              throw "$Label does not have a valid Microsoft Authenticode signature."
            }
          }

          function Download-WindowsSupervisorArtifact {
            param(
              [Parameter(Mandatory)][string]$Destination,
              [Parameter(Mandatory)][string]$Token
            )
            if (
              $env:OPENCOVEN_WINDOWS_GITHUB_API_URL -cne 'https://api.github.com' -or
              $env:OPENCOVEN_WINDOWS_GITHUB_REPOSITORY -cne 'OpenCoven/chat' -or
              $env:OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              [String]::IsNullOrWhiteSpace($Token) -or
              $Token.Contains("`r") -or
              $Token.Contains("`n")
            ) {
              throw 'The frozen Windows supervisor artifact binding is invalid.'
            }
            $artifactUri = [uri](
              "$($env:OPENCOVEN_WINDOWS_GITHUB_API_URL)/repos/" +
              "$($env:OPENCOVEN_WINDOWS_GITHUB_REPOSITORY)/actions/artifacts/" +
              "$($env:OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID)/zip"
            )
            $handler = [Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseProxy = $false
            $client = [Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(30)
            try {
              $request = [Net.Http.HttpRequestMessage]::new(
                [Net.Http.HttpMethod]::Get,
                $artifactUri
              )
              $request.Headers.Authorization =
                [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $Token)
              $request.Headers.UserAgent.ParseAdd('OpenCoven-Chat-Conformance')
              $response = $client.Send(
                $request,
                [Net.Http.HttpCompletionOption]::ResponseHeadersRead
              )
              $request.Dispose()
              try {
                if ([int]$response.StatusCode -ne 302 -or $null -eq $response.Headers.Location) {
                  throw 'The frozen Windows supervisor artifact did not return one redirect.'
                }
                $downloadUri = $response.Headers.Location
              } finally {
                $response.Dispose()
              }
              if (
                -not $downloadUri.IsAbsoluteUri -or
                $downloadUri.Scheme -cne 'https' -or
                -not $downloadUri.Host.EndsWith(
                  '.blob.core.windows.net',
                  [StringComparison]::OrdinalIgnoreCase
                )
              ) {
                throw 'The frozen Windows supervisor artifact redirect left its host allowlist.'
              }
              $downloadRequest = [Net.Http.HttpRequestMessage]::new(
                [Net.Http.HttpMethod]::Get,
                $downloadUri
              )
              $downloadResponse = $client.Send(
                $downloadRequest,
                [Net.Http.HttpCompletionOption]::ResponseHeadersRead
              )
              $downloadRequest.Dispose()
              try {
                if (-not $downloadResponse.IsSuccessStatusCode) {
                  throw 'The frozen Windows supervisor artifact download failed.'
                }
                if (
                  $null -ne $downloadResponse.Content.Headers.ContentLength -and
                  $downloadResponse.Content.Headers.ContentLength -gt 1MB
                ) {
                  throw 'The frozen Windows supervisor artifact archive exceeded its limit.'
                }
                $archiveBytes = (
                  $downloadResponse.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                )
              } finally {
                $downloadResponse.Dispose()
              }
            } finally {
              $client.Dispose()
              $handler.Dispose()
            }
            if ($archiveBytes.Length -lt 1 -or $archiveBytes.Length -gt 1MB) {
              throw 'The frozen Windows supervisor artifact archive size is invalid.'
            }
            $archiveStream = [IO.MemoryStream]::new($archiveBytes, $false)
            $archive = [IO.Compression.ZipArchive]::new(
              $archiveStream,
              [IO.Compression.ZipArchiveMode]::Read,
              $false
            )
            try {
              if (
                $archive.Entries.Count -ne 1 -or
                $archive.Entries[0].FullName -cne 'phase1-process-supervisor.exe' -or
                $archive.Entries[0].Length -ne 333824
              ) {
                throw 'The frozen Windows supervisor artifact archive shape changed.'
              }
              $input = $archive.Entries[0].Open()
              $output = [IO.File]::Open(
                $Destination,
                [IO.FileMode]::CreateNew,
                [IO.FileAccess]::Write,
                [IO.FileShare]::None
              )
              try {
                $input.CopyTo($output)
                $output.Flush($true)
              } finally {
                $output.Dispose()
                $input.Dispose()
              }
            } finally {
              $archive.Dispose()
              $archiveStream.Dispose()
            }
            if (
              (Get-Item -LiteralPath $Destination).Length -ne 333824 -or
              (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                '372b3e8b5b860e0759da8fa10ddfb6ec338e26d83616254c816a456ae2e1b7c5'
            ) {
              throw 'The frozen Windows supervisor artifact bytes changed.'
            }
          }

          $windowsSupervisorToken = $env:OPENCOVEN_WINDOWS_GITHUB_TOKEN
          Remove-Item Env:OPENCOVEN_WINDOWS_GITHUB_TOKEN
          $validatorRevision = Require-LowercaseGitOid `
            -Value $env:OPENCOVEN_VALIDATOR_REVISION_INPUT
          $protectedValidatorRevision = Require-LowercaseGitOid `
            -Value $env:OPENCOVEN_PROTECTED_VALIDATOR_REVISION
          if ($validatorRevision -cne $protectedValidatorRevision) {
            throw 'Protected workflow revision does not match the environment validator revision.'
          }
          if (
            -not $IsWindows -or
            $env:RUNNER_OS -ne 'Windows' -or
            $env:ImageOS -ne $env:OPENCOVEN_WINDOWS_IMAGE_OS -or
            $env:ImageVersion -ne $env:OPENCOVEN_WINDOWS_IMAGE_VERSION
          ) {
            throw 'The win32-x64 lane requires the GitHub windows-2025 image.'
          }
          if (
            [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or
            [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64' -or
            $env:PROCESSOR_ARCHITECTURE -ne 'AMD64'
          ) {
            throw 'The protected Windows lane requires a native AMD64 process and kernel.'
          }
          if ([Environment]::OSVersion.Version.Build -ne 26100) {
            throw 'The protected Windows lane requires the Windows Server 2025 kernel family.'
          }
          $windowsVersion = Get-ItemProperty `
            -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          if (
            "$($windowsVersion.CurrentBuildNumber).$($windowsVersion.UBR)" -ne
              $env:OPENCOVEN_WINDOWS_BUILD -or
            $PSVersionTable.PSEdition -ne 'Core' -or
            $PSVersionTable.PSVersion.ToString() -ne
              $env:OPENCOVEN_WINDOWS_POWERSHELL_VERSION -or
            [Environment]::Version.ToString() -ne $env:OPENCOVEN_WINDOWS_DOTNET_VERSION
          ) {
            throw 'The protected Windows lane requires the exact reviewed OS/PowerShell/.NET image.'
          }

          $trustedPwsh = $env:OPENCOVEN_WINDOWS_POWERSHELL_PATH
          $trustedKernel32 = 'C:\Windows\System32\kernel32.dll'
          $trustedAdvapi32 = 'C:\Windows\System32\advapi32.dll'
          $trustedNetapi32 = 'C:\Windows\System32\netapi32.dll'
          $trustedUserenv = 'C:\Windows\System32\userenv.dll'
          $trustedComspec = 'C:\Windows\System32\cmd.exe'
          $runningPwsh = [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          if (
            -not [IO.File]::Exists($trustedPwsh) -or
            -not [IO.File]::Exists($trustedKernel32) -or
            -not [IO.File]::Exists($trustedAdvapi32) -or
            -not [IO.File]::Exists($trustedNetapi32) -or
            -not [IO.File]::Exists($trustedUserenv) -or
            -not [IO.File]::Exists($trustedComspec) -or
            -not [String]::Equals(
              [IO.Path]::GetFullPath($runningPwsh),
              $trustedPwsh,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw 'Trusted absolute PowerShell or system DLL paths are unavailable.'
          }
          Assert-NoReparsePath -Path $trustedPwsh -Label 'System PowerShell'
          Assert-NoReparsePath -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-NoReparsePath -Path $trustedAdvapi32 -Label 'System advapi32.dll'
          Assert-NoReparsePath -Path $trustedNetapi32 -Label 'System netapi32.dll'
          Assert-NoReparsePath -Path $trustedUserenv -Label 'System userenv.dll'
          Assert-NoReparsePath -Path $trustedComspec -Label 'System command processor'
          $kernelVersion = (
            [Diagnostics.FileVersionInfo]::GetVersionInfo($trustedKernel32).FileVersion -split ' '
          )[0]
          if (
            $kernelVersion -ne $env:OPENCOVEN_WINDOWS_KERNEL32_VERSION
          ) {
            throw 'The kernel32.dll facility is outside the exact reviewed Windows image.'
          }
          Assert-MicrosoftSignature -Path $trustedPwsh -Label 'System PowerShell'
          Assert-MicrosoftSignature -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-MicrosoftSignature -Path $trustedAdvapi32 -Label 'System advapi32.dll'
          Assert-MicrosoftSignature -Path $trustedNetapi32 -Label 'System netapi32.dll'
          Assert-MicrosoftSignature -Path $trustedUserenv -Label 'System userenv.dll'
          Assert-MicrosoftSignature -Path $trustedComspec -Label 'System command processor'

          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $artifactWorkspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          Assert-NoReparsePath -Path $runnerTemp -Label 'Runner temporary root'
          Assert-NoReparsePath -Path $artifactWorkspace -Label 'GitHub artifact workspace'
          if (
            (Get-ChildItem -LiteralPath $artifactWorkspace -Force | Measure-Object).Count -ne 0
          ) {
            throw 'The pre-checkout GitHub workspace is not empty.'
          }
          $visualStudioRoot = $env:OPENCOVEN_WINDOWS_VS_PATH
          $trustedVisualStudio = Join-Path $visualStudioRoot 'Common7\IDE\devenv.exe'
          if (
            -not [IO.Directory]::Exists($visualStudioRoot) -or
            -not [IO.File]::Exists($trustedVisualStudio)
          ) {
            throw 'The exact reviewed Visual Studio 2026 installation is unavailable.'
          }
          $visualStudioVersion = (
            [Diagnostics.FileVersionInfo]::GetVersionInfo($trustedVisualStudio).ProductVersion `
              -split ' '
          )[0]
          if ($visualStudioVersion -ne $env:OPENCOVEN_WINDOWS_VS_VERSION) {
            throw 'The reviewed Visual Studio 2026 version changed.'
          }
          Assert-NoReparsePath -Path $visualStudioRoot -Label 'Visual Studio 2026 installation'
          Assert-NoReparsePath -Path $trustedVisualStudio -Label 'Visual Studio 2026 executable'
          Assert-MicrosoftSignature -Path $trustedVisualStudio -Label 'Visual Studio 2026 executable'

          $msvcRoot = $env:OPENCOVEN_WINDOWS_MSVC_PATH
          $expectedMsvcRoot = Join-Path `
            $visualStudioRoot `
            "VC\Tools\MSVC\$($env:OPENCOVEN_WINDOWS_MSVC_VERSION)"
          if (
            -not [IO.Directory]::Exists($msvcRoot) -or
            -not [String]::Equals(
              [IO.Path]::GetFullPath($msvcRoot),
              [IO.Path]::GetFullPath($expectedMsvcRoot),
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw 'The exact reviewed Visual Studio 2026 MSVC facility is unavailable.'
          }
          $msvcBin = Join-Path $msvcRoot 'bin\Hostx64\x64'
          $msvcLib = Join-Path $msvcRoot 'lib\x64'
          $msvcInclude = Join-Path $msvcRoot 'include'
          $windowsSdkVersion = $env:OPENCOVEN_WINDOWS_SDK_VERSION
          $windowsSdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $windowsSdkBin = Join-Path $windowsSdkRoot "bin\$windowsSdkVersion\x64"
          $windowsSdkLibUm = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\um\x64"
          $windowsSdkLibUcrt = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\ucrt\x64"
          $windowsSdkIncludeRoot = Join-Path $windowsSdkRoot "Include\$windowsSdkVersion"
          if (
            (Join-Path $windowsSdkBin 'rc.exe') -ne $env:OPENCOVEN_WINDOWS_RC_PATH
          ) {
            throw 'The exact reviewed Windows SDK resource compiler path changed.'
          }
          foreach ($facility in @(
            $msvcBin,
            $msvcLib,
            $msvcInclude,
            $windowsSdkBin,
            $windowsSdkLibUm,
            $windowsSdkLibUcrt,
            $windowsSdkIncludeRoot
          )) {
            Assert-NoReparsePath -Path $facility -Label 'MSVC/Windows SDK facility'
          }
          if (
            (Join-Path $msvcBin 'cl.exe') -ne $env:OPENCOVEN_WINDOWS_CL_PATH -or
            (Join-Path $msvcBin 'link.exe') -ne $env:OPENCOVEN_WINDOWS_LINK_PATH
          ) {
            throw 'The exact reviewed MSVC compiler or linker path changed.'
          }
          $trustedBuildTools = @(
            $env:OPENCOVEN_WINDOWS_LINK_PATH,
            $env:OPENCOVEN_WINDOWS_CL_PATH,
            $env:OPENCOVEN_WINDOWS_RC_PATH
          )
          foreach ($tool in $trustedBuildTools) {
            if (-not [IO.File]::Exists($tool)) {
              throw 'A required trusted MSVC/Windows SDK executable is unavailable.'
            }
            Assert-NoReparsePath -Path $tool -Label 'MSVC/Windows SDK executable'
            Assert-MicrosoftSignature -Path $tool -Label 'MSVC/Windows SDK executable'
          }

          $jobSupervisorSource = @'
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.Globalization;
          using System.IO;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;
          using System.Security.Principal;
          using System.Text;
          using System.Text.Encodings.Web;
          using System.Text.Json;
          using System.Threading;
          using System.Threading.Tasks;
          using Microsoft.Win32;
          using Microsoft.Win32.SafeHandles;

          namespace OpenCoven
          {
              public sealed class WindowsPinnedDirectory : IDisposable
              {
                  private IntPtr handle;

                  internal WindowsPinnedDirectory(IntPtr value)
                  {
                      handle = value;
                  }

                  public void Dispose()
                  {
                      IntPtr value = handle;
                      handle = IntPtr.Zero;
                      if (value != IntPtr.Zero)
                      {
                          WindowsJobSupervisor.ReleasePinnedDirectory(value);
                      }
                      GC.SuppressFinalize(this);
                  }
              }

              public sealed class WindowsIsolatedUser : IDisposable
              {
                  private const uint NERR_SUCCESS = 0;
                  private const uint NERR_USER_NOT_FOUND = 2221;
                  private const uint NERR_USER_EXISTS = 2224;
                  private const uint ERROR_MEMBER_IN_ALIAS = 1378;
                  private const uint USER_PRIV_USER = 1;
                  private const uint UF_SCRIPT = 0x0001;
                  private const uint UF_ACCOUNTDISABLE = 0x0002;
                  private const uint UF_LOCKOUT = 0x0010;
                  private const uint UF_PASSWD_NOTREQD = 0x0020;
                  private const uint UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED = 0x0080;
                  private const uint UF_TEMP_DUPLICATE_ACCOUNT = 0x0100;
                  private const uint UF_NORMAL_ACCOUNT = 0x0200;
                  private const uint UF_INTERDOMAIN_TRUST_ACCOUNT = 0x0800;
                  private const uint UF_WORKSTATION_TRUST_ACCOUNT = 0x1000;
                  private const uint UF_SERVER_TRUST_ACCOUNT = 0x2000;
                  private const uint UF_DONT_EXPIRE_PASSWD = 0x10000;
                  private const uint UF_SMARTCARD_REQUIRED = 0x40000;
                  private const uint UF_TRUSTED_FOR_DELEGATION = 0x80000;
                  private const uint UF_USE_DES_KEY_ONLY = 0x200000;
                  private const uint UF_DONT_REQUIRE_PREAUTH = 0x400000;
                  private const uint UF_PASSWORD_EXPIRED = 0x800000;
                  private const uint UF_TRUSTED_TO_AUTHENTICATE_FOR_DELEGATION = 0x1000000;
                  private const uint AccountTypeMask =
                      UF_TEMP_DUPLICATE_ACCOUNT |
                      UF_NORMAL_ACCOUNT |
                      UF_INTERDOMAIN_TRUST_ACCOUNT |
                      UF_WORKSTATION_TRUST_ACCOUNT |
                      UF_SERVER_TRUST_ACCOUNT;
                  private const uint UnsafeAccountFlagMask =
                      UF_ACCOUNTDISABLE |
                      UF_LOCKOUT |
                      UF_PASSWD_NOTREQD |
                      UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED |
                      UF_SMARTCARD_REQUIRED |
                      UF_TRUSTED_FOR_DELEGATION |
                      UF_USE_DES_KEY_ONLY |
                      UF_DONT_REQUIRE_PREAUTH |
                      UF_PASSWORD_EXPIRED |
                      UF_TRUSTED_TO_AUTHENTICATE_FOR_DELEGATION;
                  private const int LOGON32_LOGON_INTERACTIVE = 2;
                  private const int LOGON32_PROVIDER_DEFAULT = 0;
                  private const int ERROR_INSUFFICIENT_BUFFER = 122;
                  private const uint MAX_PREFERRED_LENGTH = 0xffffffff;
                  private const uint LG_INCLUDE_INDIRECT = 0x0001;
                  private const int TokenPrivileges = 3;
                  private const int TokenElevationType = 18;
                  private const int TokenElevation = 20;
                  private const int TokenIntegrityLevel = 25;
                  private const uint TokenElevationTypeDefault = 1;
                  private const uint MediumIntegrityRid = 0x2000;
                  private const int MaximumAccountCreationAttempts = 8;

                  private string password;
                  private bool accountDisabled;
                  private Action quarantineIsolatedIdentity;
                  private Func<bool> isQuarantineComplete;
                  private bool disposed;

                  private WindowsIsolatedUser(
                      string userName,
                      string passwordValue,
                      string sid,
                      string rootPath,
                      string profilePath,
                      string tempPath,
                      string workspacePath,
                      string operatingSystemProfilePath,
                      string validationSummary)
                  {
                      UserName = userName;
                      password = passwordValue;
                      Sid = sid;
                      RootPath = rootPath;
                      ProfilePath = profilePath;
                      TempPath = tempPath;
                      WorkspacePath = workspacePath;
                      OperatingSystemProfilePath = operatingSystemProfilePath;
                      ValidationSummary = validationSummary;
                  }

                  public string UserName { get; private set; }
                  public string Sid { get; private set; }
                  public string RootPath { get; private set; }
                  public string ProfilePath { get; private set; }
                  public string TempPath { get; private set; }
                  public string WorkspacePath { get; private set; }
                  public string OperatingSystemProfilePath { get; private set; }
                  public string ValidationSummary { get; private set; }

                  internal string Password
                  {
                      get
                      {
                          ThrowIfDisposed();
                          RequireEnabledForLogon();
                          return password;
                      }
                  }

                  public bool IsDisabled
                  {
                      get
                      {
                          ThrowIfDisposed();
                          return accountDisabled;
                      }
                  }

                  public static WindowsIsolatedUser Create(string rootPath)
                  {
                      if (String.IsNullOrWhiteSpace(rootPath) || !Path.IsPathRooted(rootPath))
                      {
                          throw new ArgumentException(
                              "Isolated bootstrap root must be absolute.",
                              "rootPath");
                      }
                      string fullRoot = Path.GetFullPath(rootPath);
                      if (Directory.Exists(fullRoot) || File.Exists(fullRoot))
                      {
                          throw new IOException("Isolated bootstrap root already exists.");
                      }

                      string userName = null;
                      string passwordValue = null;
                      string sid = null;
                      bool accountCreated = false;
                      try
                      {
                          for (int attempt = 0; attempt < MaximumAccountCreationAttempts; attempt++)
                          {
                              userName = GenerateUserName();
                              passwordValue = GeneratePassword();
                              USER_INFO_1 information = new USER_INFO_1();
                              information.usri1_name = userName;
                              information.usri1_password = passwordValue;
                              information.usri1_priv = USER_PRIV_USER;
                              information.usri1_flags =
                                  UF_SCRIPT | UF_NORMAL_ACCOUNT | UF_DONT_EXPIRE_PASSWD;
                              uint parameterError;
                              uint status = NetUserAdd(
                                  null,
                                  1,
                                  ref information,
                                  out parameterError);
                              if (status == NERR_USER_EXISTS)
                              {
                                  continue;
                              }
                              if (status != NERR_SUCCESS)
                              {
                                  throw new Win32Exception(
                                      unchecked((int)status),
                                      "Ephemeral local user creation failed.");
                              }
                              accountCreated = true;
                              break;
                          }
                          if (!accountCreated)
                          {
                              throw new InvalidOperationException(
                                  "A unique ephemeral local user name could not be allocated.");
                          }
                          NormalizeNewStandardAccount(userName);

                          SecurityIdentifier accountSid = (SecurityIdentifier)new NTAccount(
                              Environment.MachineName,
                              userName).Translate(typeof(SecurityIdentifier));
                          sid = accountSid.Value;
                          EnsureUsersGroupMembership(userName);
                          string validationSummary =
                              ValidateStandardUser(userName, passwordValue, sid);

                          string profilePath = Path.Combine(fullRoot, "profile");
                          string tempPath = Path.Combine(fullRoot, "temp");
                          string workspacePath = Path.Combine(fullRoot, "workspace");
                          Directory.CreateDirectory(fullRoot);
                          Directory.CreateDirectory(profilePath);
                          Directory.CreateDirectory(Path.Combine(profilePath, @"AppData\Roaming"));
                          Directory.CreateDirectory(Path.Combine(profilePath, @"AppData\Local"));
                          Directory.CreateDirectory(tempPath);
                          Directory.CreateDirectory(workspacePath);

                          SecurityIdentifier supervisor =
                              WindowsIdentity.GetCurrent().User;
                          if (supervisor == null)
                          {
                              throw new InvalidOperationException(
                                  "Supervisor Windows user SID is unavailable.");
                          }
                          foreach (string directory in new string[]
                          {
                              fullRoot,
                              profilePath,
                              Path.Combine(profilePath, @"AppData\Roaming"),
                              Path.Combine(profilePath, @"AppData\Local"),
                              tempPath,
                              workspacePath,
                          })
                          {
                              WindowsJobSupervisor.SecureIsolatedDirectory(
                                  directory,
                                  sid,
                                  supervisor.Value);
                          }
                          WindowsJobSupervisor.ProtectCurrentProcess(
                              sid,
                              supervisor.Value);

                          return new WindowsIsolatedUser(
                              userName,
                              passwordValue,
                              sid,
                              fullRoot,
                              profilePath,
                              tempPath,
                              workspacePath,
                              Path.Combine(GetProfilesRoot(), userName),
                              validationSummary);
                      }
                      catch (Exception original)
                      {
                          List<Exception> cleanupFailures = new List<Exception>();
                          if (Directory.Exists(fullRoot))
                          {
                              try
                              {
                                  WindowsJobSupervisor.DeleteDirectoryTree(fullRoot);
                              }
                              catch (Exception error)
                              {
                                  cleanupFailures.Add(error);
                              }
                          }
                          if (accountCreated)
                          {
                              try
                              {
                                  uint status = NetUserDel(null, userName);
                                  if (status != NERR_SUCCESS &&
                                      status != NERR_USER_NOT_FOUND)
                                  {
                                      throw new Win32Exception(
                                          unchecked((int)status),
                                          "Ephemeral local user deletion failed.");
                                  }
                                  IntPtr information;
                                  status = NetUserGetInfo(
                                      null,
                                      userName,
                                      1,
                                      out information);
                                  if (information != IntPtr.Zero)
                                  {
                                      NetApiBufferFree(information);
                                  }
                                  if (status != NERR_USER_NOT_FOUND)
                                  {
                                      throw new InvalidOperationException(
                                          "Ephemeral local user survived cleanup.");
                                  }
                              }
                              catch (Exception error)
                              {
                                  cleanupFailures.Add(error);
                              }
                          }
                          if (cleanupFailures.Count != 0)
                          {
                              cleanupFailures.Insert(0, original);
                              throw new InvalidOperationException(
                                  "Ephemeral local user cleanup failed during creation.",
                                  new AggregateException(cleanupFailures.ToArray()));
                          }
                          throw;
                      }
                  }

                  internal void ThrowIfDisposed()
                  {
                      if (disposed)
                      {
                          throw new ObjectDisposedException("WindowsIsolatedUser");
                      }
                  }

                  internal void RequireEnabledForLogon()
                  {
                      if (accountDisabled || password == null)
                      {
                          throw new InvalidOperationException(
                              "Ephemeral Windows account is disabled for final artifact handoff.");
                      }
                  }

                  public void DisableAndVerify()
                  {
                      ThrowIfDisposed();
                      IntPtr information = IntPtr.Zero;
                      uint status = NetUserGetInfo(null, UserName, 1, out information);
                      if (status != NERR_SUCCESS || information == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user disablement preflight could not be queried.");
                      }

                      uint flags;
                      try
                      {
                          USER_INFO_1 current = (USER_INFO_1)Marshal.PtrToStructure(
                              information,
                              typeof(USER_INFO_1));
                          flags = current.usri1_flags | UF_ACCOUNTDISABLE;
                      }
                      finally
                      {
                          NetApiBufferFree(information);
                      }

                      USER_INFO_1008 update = new USER_INFO_1008();
                      update.usri1008_flags = flags;
                      uint parameterError;
                      status = NetUserSetInfo(
                          null,
                          UserName,
                          1008,
                          ref update,
                          out parameterError);
                      if (status != NERR_SUCCESS)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user could not be disabled.");
                      }

                      information = IntPtr.Zero;
                      status = NetUserGetInfo(null, UserName, 1, out information);
                      if (status != NERR_SUCCESS || information == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user disablement could not be verified.");
                      }
                      try
                      {
                          USER_INFO_1 verified = (USER_INFO_1)Marshal.PtrToStructure(
                              information,
                              typeof(USER_INFO_1));
                          if ((verified.usri1_flags & UF_ACCOUNTDISABLE) == 0 ||
                              (verified.usri1_flags & UF_NORMAL_ACCOUNT) == 0)
                          {
                              throw new InvalidOperationException(
                                  "Ephemeral local user disablement verification was ambiguous.");
                          }
                      }
                      finally
                      {
                          NetApiBufferFree(information);
                      }
                      accountDisabled = true;
                      password = null;
                  }

                  internal void RequireDisabledAndVerify()
                  {
                      ThrowIfDisposed();
                      if (!accountDisabled || password != null)
                      {
                          throw new InvalidOperationException(
                              "Ephemeral local user is not disabled for artifact handoff.");
                      }
                      IntPtr information = IntPtr.Zero;
                      uint status = NetUserGetInfo(null, UserName, 1, out information);
                      if (status != NERR_SUCCESS || information == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user disabled state could not be rechecked.");
                      }
                      try
                      {
                          USER_INFO_1 verified = (USER_INFO_1)Marshal.PtrToStructure(
                              information,
                              typeof(USER_INFO_1));
                          if ((verified.usri1_flags & UF_ACCOUNTDISABLE) == 0)
                          {
                              throw new InvalidOperationException(
                                  "Ephemeral local user was re-enabled before artifact handoff.");
                          }
                      }
                      finally
                      {
                          NetApiBufferFree(information);
                      }
                  }

                  internal void RegisterTerminalQuarantine(
                      Action quarantine,
                      Func<bool> completion)
                  {
                      ThrowIfDisposed();
                      if (quarantine == null)
                      {
                          throw new ArgumentNullException("quarantine");
                      }
                      if (completion == null)
                      {
                          throw new ArgumentNullException("completion");
                      }
                      if (quarantineIsolatedIdentity != null &&
                          (!Object.Equals(quarantineIsolatedIdentity, quarantine) ||
                              !Object.Equals(isQuarantineComplete, completion)))
                      {
                          throw new InvalidOperationException(
                              "The isolated Windows identity already has a terminal quarantine owner.");
                      }
                      quarantineIsolatedIdentity = quarantine;
                      isQuarantineComplete = completion;
                  }

                  private static string ValidateStandardUser(
                      string userName,
                      string passwordValue,
                      string expectedSid)
                  {
                      IntPtr information = IntPtr.Zero;
                      uint legacyPrivilege;
                      uint accountFlags;
                      uint status = NetUserGetInfo(null, userName, 1, out information);
                      if (status != NERR_SUCCESS || information == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user could not be queried.");
                      }

                      try
                      {
                          USER_INFO_1 value = (USER_INFO_1)Marshal.PtrToStructure(
                              information,
                              typeof(USER_INFO_1));
                          legacyPrivilege = value.usri1_priv;
                          accountFlags = value.usri1_flags;
                      }
                      finally
                      {
                          NetApiBufferFree(information);
                      }
                      string[] localGroupSids = ReadLocalGroupSids(userName);

                      IntPtr token;
                      if (!LogonUserW(
                              userName,
                              Environment.MachineName,
                              passwordValue,
                              LOGON32_LOGON_INTERACTIVE,
                              LOGON32_PROVIDER_DEFAULT,
                              out token))
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "Ephemeral standard-user logon validation failed.");
                      }
                      try
                      {
                          bool isAdministrator;
                          bool isElevated;
                          uint elevationType;
                          uint integrityRid;
                          string[] tokenPrivileges;
                          using (WindowsIdentity identity = new WindowsIdentity(token))
                          {
                              if (identity.User == null || identity.User.Value != expectedSid)
                              {
                                  throw new InvalidOperationException(
                                      "Ephemeral logon token SID changed.");
                              }
                          }
                          IntPtr administrators;
                          if (!ConvertStringSidToSidW(
                                  "S-1-5-32-544",
                                  out administrators))
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "Administrators SID conversion failed.");
                          }
                          try
                          {
                              IntPtr membershipToken;
                              if (!DuplicateToken(
                                      token,
                                      2,
                                      out membershipToken))
                              {
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "Ephemeral token membership handle could not be created.");
                              }
                              try
                              {
                                  if (!CheckTokenMembership(
                                          membershipToken,
                                          administrators,
                                          out isAdministrator))
                                  {
                                      throw new Win32Exception(
                                          Marshal.GetLastWin32Error(),
                                          "Ephemeral token group validation failed.");
                                  }
                                  if (isAdministrator)
                                  {
                                      throw new InvalidOperationException(
                                          "Restricted identity unexpectedly belongs to Administrators.");
                                  }
                              }
                              finally
                              {
                                  CloseHandle(membershipToken);
                              }
                          }
                          finally
                          {
                              LocalFree(administrators);
                          }
                          isElevated = ReadTokenElevation(token);
                          elevationType = ReadTokenElevationType(token);
                          integrityRid = ReadTokenIntegrityRid(token);
                          tokenPrivileges = ReadTokenPrivileges(token);
                          string summary = String.Format(
                              CultureInfo.InvariantCulture,
                              "legacyPriv={0};flags=0x{1:x8};groups={2};elevated={3};" +
                                  "elevationType={4};integrity=0x{5:x8};tokenPrivileges={6};" +
                                  "dangerousPrivileges=none",
                              legacyPrivilege,
                              accountFlags,
                              String.Join(",", localGroupSids),
                              isElevated ? "true" : "false",
                              elevationType,
                              integrityRid,
                              tokenPrivileges.Length == 0
                                  ? "none"
                                  : String.Join(",", tokenPrivileges));
                          try
                          {
                              ValidateStandardUserSnapshot(
                                  legacyPrivilege,
                                  accountFlags,
                                  localGroupSids,
                                  isAdministrator,
                                  isElevated,
                                  elevationType,
                                  integrityRid,
                                  tokenPrivileges);
                          }
                          catch (InvalidOperationException error)
                          {
                              throw new InvalidOperationException(
                                  error.Message + " " + summary,
                                  error);
                          }
                          return summary;
                      }
                      finally
                      {
                          CloseHandle(token);
                      }
                  }

                  private static void NormalizeNewStandardAccount(string userName)
                  {
                      IntPtr information = IntPtr.Zero;
                      uint status = NetUserGetInfo(null, userName, 1, out information);
                      if (status != NERR_SUCCESS || information == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "New ephemeral local user flags could not be queried.");
                      }
                      uint flags;
                      try
                      {
                          USER_INFO_1 value = (USER_INFO_1)Marshal.PtrToStructure(
                              information,
                              typeof(USER_INFO_1));
                          if ((value.usri1_flags & AccountTypeMask) != UF_NORMAL_ACCOUNT)
                          {
                              throw new InvalidOperationException(
                                  "New ephemeral account type was not a normal local account.");
                          }
                          flags =
                              (value.usri1_flags | UF_SCRIPT | UF_NORMAL_ACCOUNT | UF_DONT_EXPIRE_PASSWD) &
                              ~UnsafeAccountFlagMask;
                      }
                      finally
                      {
                          NetApiBufferFree(information);
                      }
                      USER_INFO_1008 update = new USER_INFO_1008();
                      update.usri1008_flags = flags;
                      uint parameterError;
                      status = NetUserSetInfo(
                          null,
                          userName,
                          1008,
                          ref update,
                          out parameterError);
                      if (status != NERR_SUCCESS)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "New ephemeral local user flags could not be normalized.");
                      }
                  }

                  private static void EnsureUsersGroupMembership(string userName)
                  {
                      NTAccount usersAccount = (NTAccount)new SecurityIdentifier(
                          "S-1-5-32-545").Translate(typeof(NTAccount));
                      string groupName = usersAccount.Value;
                      int separator = groupName.IndexOf('\\');
                      if (separator >= 0)
                      {
                          groupName = groupName.Substring(separator + 1);
                      }
                      if (String.IsNullOrWhiteSpace(groupName))
                      {
                          throw new InvalidOperationException(
                              "Built-in Users local group name was unavailable.");
                      }
                      LOCALGROUP_MEMBERS_INFO_3 member = new LOCALGROUP_MEMBERS_INFO_3();
                      member.lgrmi3_domainandname =
                          Environment.MachineName + "\\" + userName;
                      uint status = NetLocalGroupAddMembers(
                          null,
                          groupName,
                          3,
                          ref member,
                          1);
                      if (status != NERR_SUCCESS && status != ERROR_MEMBER_IN_ALIAS)
                      {
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user could not be added to built-in Users.");
                      }
                  }

                  private static void ValidateStandardUserSnapshot(
                      uint legacyPrivilege,
                      uint accountFlags,
                      string[] localGroupSids,
                      bool isAdministrator,
                      bool isElevated,
                      uint elevationType,
                      uint integrityRid,
                      string[] tokenPrivileges)
                  {
                      bool groupsValid =
                          localGroupSids != null &&
                          localGroupSids.Length == 1 &&
                          String.Equals(
                              localGroupSids[0],
                              "S-1-5-32-545",
                              StringComparison.Ordinal);
                      bool flagsValid =
                          (accountFlags & UF_SCRIPT) != 0 &&
                          (accountFlags & AccountTypeMask) == UF_NORMAL_ACCOUNT &&
                          (accountFlags & UnsafeAccountFlagMask) == 0;
                      bool privilegesValid = tokenPrivileges != null;
                      if (privilegesValid)
                      {
                          foreach (string privilege in tokenPrivileges)
                          {
                              if (IsDangerousPrivilege(privilege))
                              {
                                  privilegesValid = false;
                                  break;
                              }
                          }
                      }
                      if (
                          legacyPrivilege > 2 ||
                          !flagsValid ||
                          !groupsValid ||
                          isAdministrator ||
                          isElevated ||
                          elevationType != TokenElevationTypeDefault ||
                          integrityRid != MediumIntegrityRid ||
                          !privilegesValid)
                      {
                          throw new InvalidOperationException(
                              "Ephemeral account is not a restricted standard local user.");
                      }
                  }

                  private static bool IsDangerousPrivilege(string privilege)
                  {
                      switch (privilege)
                      {
                          case "SeAssignPrimaryTokenPrivilege":
                          case "SeAuditPrivilege":
                          case "SeBackupPrivilege":
                          case "SeCreatePermanentPrivilege":
                          case "SeCreateTokenPrivilege":
                          case "SeDebugPrivilege":
                          case "SeEnableDelegationPrivilege":
                          case "SeImpersonatePrivilege":
                          case "SeLoadDriverPrivilege":
                          case "SeManageVolumePrivilege":
                          case "SeRelabelPrivilege":
                          case "SeRestorePrivilege":
                          case "SeSecurityPrivilege":
                          case "SeSystemEnvironmentPrivilege":
                          case "SeTakeOwnershipPrivilege":
                          case "SeTcbPrivilege":
                          case "SeTrustedCredManAccessPrivilege":
                              return true;
                          default:
                              return false;
                      }
                  }

                  private static string[] ReadLocalGroupSids(string userName)
                  {
                      IntPtr buffer = IntPtr.Zero;
                      uint entriesRead;
                      uint totalEntries;
                      uint status = NetUserGetLocalGroups(
                          null,
                          userName,
                          0,
                          LG_INCLUDE_INDIRECT,
                          out buffer,
                          MAX_PREFERRED_LENGTH,
                          out entriesRead,
                          out totalEntries);
                      if (status != NERR_SUCCESS || entriesRead != totalEntries)
                      {
                          if (buffer != IntPtr.Zero)
                          {
                              NetApiBufferFree(buffer);
                          }
                          throw new Win32Exception(
                              unchecked((int)status),
                              "Ephemeral local user group membership could not be queried.");
                      }
                      try
                      {
                          HashSet<string> groups =
                              new HashSet<string>(StringComparer.Ordinal);
                          int size = Marshal.SizeOf(typeof(LOCALGROUP_USERS_INFO_0));
                          for (uint index = 0; index < entriesRead; index++)
                          {
                              IntPtr entry = new IntPtr(
                                  buffer.ToInt64() + checked((long)index * size));
                              LOCALGROUP_USERS_INFO_0 group =
                                  (LOCALGROUP_USERS_INFO_0)Marshal.PtrToStructure(
                                      entry,
                                      typeof(LOCALGROUP_USERS_INFO_0));
                              if (String.IsNullOrWhiteSpace(group.lgrui0_name))
                              {
                                  throw new InvalidOperationException(
                                      "Ephemeral local group membership was ambiguous.");
                              }
                              SecurityIdentifier sid = (SecurityIdentifier)new NTAccount(
                                  group.lgrui0_name).Translate(typeof(SecurityIdentifier));
                              groups.Add(sid.Value);
                          }
                          string[] result = new List<string>(groups).ToArray();
                          Array.Sort(result, StringComparer.Ordinal);
                          return result;
                      }
                      finally
                      {
                          if (buffer != IntPtr.Zero)
                          {
                              NetApiBufferFree(buffer);
                          }
                      }
                  }

                  private static IntPtr ReadTokenInformation(
                      IntPtr token,
                      int informationClass,
                      string label)
                  {
                      uint length = 0;
                      GetTokenInformation(
                          token,
                          informationClass,
                          IntPtr.Zero,
                          0,
                          out length);
                      if (length == 0 || Marshal.GetLastWin32Error() != ERROR_INSUFFICIENT_BUFFER)
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              label + " length could not be queried.");
                      }
                      IntPtr buffer = Marshal.AllocHGlobal(checked((int)length));
                      if (!GetTokenInformation(
                              token,
                              informationClass,
                              buffer,
                              length,
                              out length))
                      {
                          int error = Marshal.GetLastWin32Error();
                          Marshal.FreeHGlobal(buffer);
                          throw new Win32Exception(
                              error,
                              label + " could not be queried.");
                      }
                      return buffer;
                  }

                  private static bool ReadTokenElevation(IntPtr token)
                  {
                      uint size = checked((uint)Marshal.SizeOf(typeof(TOKEN_ELEVATION)));
                      IntPtr buffer = Marshal.AllocHGlobal(checked((int)size));
                      try
                      {
                          uint returned;
                          if (!GetTokenInformation(
                                  token,
                                  TokenElevation,
                                  buffer,
                                  size,
                                  out returned) ||
                              returned != size)
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "Ephemeral token elevation could not be queried.");
                          }
                          TOKEN_ELEVATION elevation =
                              (TOKEN_ELEVATION)Marshal.PtrToStructure(
                                  buffer,
                                  typeof(TOKEN_ELEVATION));
                          return elevation.TokenIsElevated != 0;
                      }
                      finally
                      {
                          Marshal.FreeHGlobal(buffer);
                      }
                  }

                  private static uint ReadTokenElevationType(IntPtr token)
                  {
                      uint size = sizeof(uint);
                      IntPtr buffer = Marshal.AllocHGlobal(checked((int)size));
                      try
                      {
                          uint returned;
                          if (!GetTokenInformation(
                                  token,
                                  TokenElevationType,
                                  buffer,
                                  size,
                                  out returned) ||
                              returned != size)
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "Ephemeral token elevation type could not be queried.");
                          }
                          return unchecked((uint)Marshal.ReadInt32(buffer));
                      }
                      finally
                      {
                          Marshal.FreeHGlobal(buffer);
                      }
                  }

                  private static uint ReadTokenIntegrityRid(IntPtr token)
                  {
                      IntPtr buffer = ReadTokenInformation(
                          token,
                          TokenIntegrityLevel,
                          "Ephemeral token integrity");
                      try
                      {
                          TOKEN_MANDATORY_LABEL label =
                              (TOKEN_MANDATORY_LABEL)Marshal.PtrToStructure(
                                  buffer,
                                  typeof(TOKEN_MANDATORY_LABEL));
                          if (label.Label.Sid == IntPtr.Zero)
                          {
                              throw new InvalidOperationException(
                                  "Ephemeral token integrity SID was unavailable.");
                          }
                          IntPtr countPointer =
                              GetSidSubAuthorityCount(label.Label.Sid);
                          if (countPointer == IntPtr.Zero)
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "Ephemeral token integrity SID count could not be queried.");
                          }
                          byte count = Marshal.ReadByte(countPointer);
                          if (count == 0)
                          {
                              throw new InvalidOperationException(
                                  "Ephemeral token integrity SID was malformed.");
                          }
                          IntPtr ridPointer =
                              GetSidSubAuthority(label.Label.Sid, checked((uint)(count - 1)));
                          if (ridPointer == IntPtr.Zero)
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "Ephemeral token integrity RID could not be queried.");
                          }
                          return unchecked((uint)Marshal.ReadInt32(ridPointer));
                      }
                      finally
                      {
                          Marshal.FreeHGlobal(buffer);
                      }
                  }

                  private static string[] ReadTokenPrivileges(IntPtr token)
                  {
                      IntPtr buffer = ReadTokenInformation(
                          token,
                          TokenPrivileges,
                          "Ephemeral token privileges");
                      try
                      {
                          uint count = unchecked((uint)Marshal.ReadInt32(buffer));
                          int entrySize = Marshal.SizeOf(typeof(LUID_AND_ATTRIBUTES));
                          List<string> privileges = new List<string>();
                          for (uint index = 0; index < count; index++)
                          {
                              IntPtr entry = new IntPtr(
                                  buffer.ToInt64() + sizeof(uint) + checked((long)index * entrySize));
                              LUID_AND_ATTRIBUTES privilege =
                                  (LUID_AND_ATTRIBUTES)Marshal.PtrToStructure(
                                      entry,
                                      typeof(LUID_AND_ATTRIBUTES));
                              uint length = 0;
                              LookupPrivilegeNameW(
                                  null,
                                  ref privilege.Luid,
                                  null,
                                  ref length);
                              if (length == 0 || Marshal.GetLastWin32Error() != ERROR_INSUFFICIENT_BUFFER)
                              {
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "Ephemeral token privilege name length could not be queried.");
                              }
                              StringBuilder name = new StringBuilder(checked((int)length + 1));
                              if (!LookupPrivilegeNameW(
                                      null,
                                      ref privilege.Luid,
                                      name,
                                      ref length))
                              {
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "Ephemeral token privilege name could not be queried.");
                              }
                              privileges.Add(name.ToString());
                          }
                          string[] result = privileges.ToArray();
                          Array.Sort(result, StringComparer.Ordinal);
                          return result;
                      }
                      finally
                      {
                          Marshal.FreeHGlobal(buffer);
                      }
                  }

                  private static string GenerateUserName()
                  {
                      byte[] bytes = new byte[8];
                      using (RandomNumberGenerator random = RandomNumberGenerator.Create())
                      {
                          random.GetBytes(bytes);
                      }
                      return "ocv" + BitConverter.ToString(bytes)
                          .Replace("-", String.Empty)
                          .ToLowerInvariant();
                  }

                  private static string GeneratePassword()
                  {
                      byte[] bytes = new byte[48];
                      using (RandomNumberGenerator random = RandomNumberGenerator.Create())
                      {
                          random.GetBytes(bytes);
                      }
                      return Convert.ToBase64String(bytes) + "aA1!";
                  }

                  private static string GetProfilesRoot()
                  {
                      uint length = 0;
                      GetProfilesDirectoryW(null, ref length);
                      if (length == 0 || Marshal.GetLastWin32Error() != ERROR_INSUFFICIENT_BUFFER)
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "Windows profile root length could not be queried.");
                      }
                      StringBuilder value = new StringBuilder(checked((int)length));
                      if (!GetProfilesDirectoryW(value, ref length))
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "Windows profile root could not be queried.");
                      }
                      return Path.GetFullPath(value.ToString());
                  }

                  public void Dispose()
                  {
                      if (disposed)
                      {
                          return;
                      }
                      List<Exception> cleanupFailures = new List<Exception>();
                      if (quarantineIsolatedIdentity != null)
                      {
                          bool quarantineComplete = false;
                          try
                          {
                              quarantineComplete = isQuarantineComplete();
                          }
                          catch (Exception error)
                          {
                              cleanupFailures.Add(error);
                          }
                          if (!quarantineComplete)
                          {
                              try
                              {
                                  quarantineIsolatedIdentity();
                              }
                              catch (Exception error)
                              {
                                  cleanupFailures.Add(error);
                              }
                          }
                      }
                      disposed = true;
                      try
                      {
                          WindowsJobSupervisor.DeleteOperatingSystemProfile(
                              Sid,
                              OperatingSystemProfilePath);
                      }
                      catch (Exception error)
                      {
                          cleanupFailures.Add(error);
                      }
                      try
                      {
                          WindowsJobSupervisor.DeleteDirectoryTree(RootPath);
                      }
                      catch (Exception error)
                      {
                          cleanupFailures.Add(error);
                      }
                      try
                      {
                          uint status = NetUserDel(null, UserName);
                          if (status != NERR_SUCCESS && status != NERR_USER_NOT_FOUND)
                          {
                              throw new Win32Exception(
                                  unchecked((int)status),
                                  "Ephemeral local user deletion failed.");
                          }
                          IntPtr information;
                          status = NetUserGetInfo(null, UserName, 1, out information);
                          if (information != IntPtr.Zero)
                          {
                              NetApiBufferFree(information);
                          }
                          if (status != NERR_USER_NOT_FOUND)
                          {
                              throw new InvalidOperationException(
                                  "Ephemeral local user survived cleanup.");
                          }
                      }
                      catch (Exception error)
                      {
                          cleanupFailures.Add(error);
                      }
                      password = null;
                      if (Directory.Exists(OperatingSystemProfilePath))
                      {
                          cleanupFailures.Add(new InvalidOperationException(
                              "Ephemeral Windows profile survived cleanup."));
                      }
                      if (Directory.Exists(RootPath))
                      {
                          cleanupFailures.Add(new InvalidOperationException(
                              "Ephemeral bootstrap root survived cleanup."));
                      }
                      GC.SuppressFinalize(this);
                      if (cleanupFailures.Count != 0)
                      {
                          throw new InvalidOperationException(
                              "Ephemeral Windows identity cleanup failed.",
                              new AggregateException(cleanupFailures.ToArray()));
                      }
                  }

