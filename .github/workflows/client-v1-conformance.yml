          $env:LIB = @(
            $env:OPENCOVEN_MSVC_LIB,
            $env:OPENCOVEN_WINDOWS_SDK_LIB_UM,
            $env:OPENCOVEN_WINDOWS_SDK_LIB_UCRT
          ) -join ';'
          $env:INCLUDE = @(
            $env:OPENCOVEN_MSVC_INCLUDE,
            (Join-Path $env:OPENCOVEN_WINDOWS_SDK_INCLUDE_ROOT 'ucrt'),
            (Join-Path $env:OPENCOVEN_WINDOWS_SDK_INCLUDE_ROOT 'shared'),
            (Join-Path $env:OPENCOVEN_WINDOWS_SDK_INCLUDE_ROOT 'um'),
            (Join-Path $env:OPENCOVEN_WINDOWS_SDK_INCLUDE_ROOT 'winrt'),
            (Join-Path $env:OPENCOVEN_WINDOWS_SDK_INCLUDE_ROOT 'cppwinrt')
          ) -join ';'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:GIT_NO_LAZY_FETCH = '1'
          $env:GIT_ALLOW_PROTOCOL = 'https'
          $env:GCM_INTERACTIVE = 'Never'
          $env:GIT_ASKPASS = ''
          $env:SSH_ASKPASS = ''
          $env:HTTP_PROXY = ''
          $env:HTTPS_PROXY = ''
          $env:ALL_PROXY = ''
          $env:http_proxy = ''
          $env:https_proxy = ''
          $env:all_proxy = ''
          $env:NPM_CONFIG_USERCONFIG = 'NUL'
          $env:NPM_CONFIG_PROXY = ''
          $env:NPM_CONFIG_HTTPS_PROXY = ''
          $env:NPM_CONFIG_REGISTRY = 'https://registry.npmjs.org/'
          $env:COREPACK_ENABLE_PROJECT_SPEC = '0'
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = 'true'
          $env:CARGO_TERM_COLOR = 'never'
          $env:CI = '1'
          $env:NO_COLOR = '1'

          if (
            $env:OPENCOVEN_CHAT_REPOSITORY -ne 'OpenCoven/chat' -or
            $env:OPENCOVEN_CHAT_SHA -notmatch '^[0-9a-f]{40}$' -or
            $env:OPENCOVEN_VALIDATOR_REVISION -notmatch '^[0-9a-f]{40}$'
          ) {
            throw 'Protected workflow revisions are malformed.'
          }
          Push-Location $workspace
          try {
            Write-Host 'git fetch exact protected Chat revision'
            Invoke-Checked `
              -FilePath $git `
              -ArgumentList @('init', '--initial-branch=detached-bootstrap') `
              -Label 'Chat repository initialization'
            Invoke-Checked `
              -FilePath $git `
              -ArgumentList @(
                '-c',
                'credential.helper=',
                '-c',
                'core.hooksPath=NUL',
                'remote',
                'add',
                'origin',
                'https://github.com/OpenCoven/chat.git'
              ) `
              -Label 'Chat origin configuration'
            Invoke-Checked `
              -FilePath $git `
              -ArgumentList @(
                '-c',
                'credential.helper=',
                '-c',
                'core.hooksPath=NUL',
                '-c',
                'fetch.fsckObjects=true',
                '-c',
                'transfer.fsckObjects=true',
                '-c',
                'protocol.https.allow=always',
                'fetch',
                '--quiet',
                '--no-tags',
                '--depth=1',
                'origin',
                $env:OPENCOVEN_CHAT_SHA
              ) `
              -Label 'Chat exact-SHA fetch'
            Invoke-Checked `
              -FilePath $git `
              -ArgumentList @(
                '-c',
                'core.hooksPath=NUL',
                'checkout',
                '--detach',
                '--force',
                'FETCH_HEAD'
              ) `
              -Label 'Chat detached checkout'
          } finally {
            Pop-Location
          }
          if ((& $git -C $workspace rev-parse HEAD).Trim() -ne $env:OPENCOVEN_CHAT_SHA) {
            throw 'Chat checkout HEAD changed.'
          }
          if (@(& $git -C $workspace status --porcelain=v2 --untracked-files=all).Count -ne 0) {
            throw 'Chat checkout is not clean.'
          }
          if (Test-Path -LiteralPath (Join-Path $workspace '.gitmodules')) {
            throw 'The protected Chat checkout may not contain submodules.'
          }

          $trustedHarnessModules = @(
            @('scripts\contract-canary.mjs', 39346, '63b2a95c8563143d0d748d36ef2bdbae656e7babdb23b986efca97bbbc9b8d83'),
            @('scripts\executable-resolution.mjs', 9154, '31e3c412ff8c835f14522f36a59e91f4a4ba82913210ae8e3b4455217503f430'),
            @('scripts\owned-temp-directory.mjs', 6965, 'a9c55c85cf2b7d70310d278bafd2c8e7695d66f4ae38b9c3f1f12fce0b442095'),
            @('scripts\phase1-artifact-secret-scan.mjs', 21183, 'be0ec302b9c4372f232d6bd1efcba873fd3380cc5de7f756cd0b9eeeec07222a'),
            @('scripts\phase1-conformance-lock.mjs', 48419, 'dc0efc1a8f7a5434451271ad2bdbd5ec2b2a7eeb77d3fcd27bf19752bf2b5ebd'),
            @('scripts\phase1-conformance.mjs', 191728, 'd0a852bfbcb87a666fc182b8c8465d306f89dd7e8ea0a32837475620017066fe'),
            @('scripts\phase1-evidence-contract.mjs', 15088, '24180ae03835fa6aac45559682adb3c1e626bab76466eddc55b9e2300f0a2b7f'),
            @('scripts\phase1-evidence-runtime.mjs', 6078, '3d227c354e6d908c5912d2b8244336e3b79c3bbd4dec79b0ad219ed65b8cb159'),
            @('scripts\phase1-linux-secret-service.mjs', 4270, 'ddf834c6f57853c5116b4b1f345952a218ff0687c5d741737c68e20bc2ecda92'),
            @('scripts\phase1-macos-keychain.mjs', 5091, 'ab0c2dd08cf606d9502f5da206175707d471d99f484e8c8c79b5b08a5772b9a4'),
            @('scripts\phase1-process-supervisor.mjs', 3820, '16b51fb1a33b4bfef98daca549aacf5dc2d2c098cfbd664753b69c940d1e6f6c'),
            @('scripts\phase1-schema-v2-evidence.mjs', 51642, 'a7cab994aa0ee97baceb4b2c475ec1ff253ae5681f39e2c3d15fb1035b2d2387'),
            @('scripts\phase1-schema-v2-producer.mjs', 159180, '24beea0ee496103c22ff77366ce69679e33a65fc51f1ff43eaa09e9d15191f6b'),
            @('scripts\process-owned-artifact-root.mjs', 11205, '9ee158453044cd57b91c77c50262092a91993c6b1533b6584c61e1cbadfd794a'),
            @('scripts\supervised-exec.mjs', 2875, 'a5edfd985b934d3b46247a0da3141682c411d30bb582edf87ae7b29791dad65b'),
            @('scripts\supervisor-status.mjs', 854, 'ac332ca7b6b040ecc846088bb3a6ad5e7112a0454eb3ea71d2a819d55e64254e')
          )
          foreach ($modulePin in $trustedHarnessModules) {
            $modulePath = Join-Path $workspace $modulePin[0]
            $moduleFile = Get-Item -LiteralPath $modulePath -Force
            Assert-NoReparsePath -Path $modulePath -Label 'Harness module'
            if (
              $moduleFile.PSIsContainer -or
              $moduleFile.Length -ne [int64]$modulePin[1] -or
              (Get-FileHash -LiteralPath $modulePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne
                $modulePin[2]
