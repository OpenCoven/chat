name: client-v1 conformance
on:
  workflow_dispatch:
    inputs:
      validator_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-supervisor:
    name: build-windows-supervisor
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps['upload-supervisor'].outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Set up frozen Rust
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Build frozen Windows supervisor
        run: bash scripts/phase1-windows-supervisor-build.sh
      - id: upload-supervisor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-process-supervisor-win32-x64
          path: tools/phase1-process-supervisor/target/x86_64-pc-windows-gnu/release/phase1-process-supervisor.exe
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  platform-conformance:
    name: platform-conformance (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: windows-supervisor
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    environment: client-v1-conformance
    permissions:
      actions: read
      contents: read
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Bootstrap supervised Windows conformance
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          OPENCOVEN_CHAT_REPOSITORY: ${{ github.repository }}
          OPENCOVEN_CHAT_SHA: ${{ github.sha }}
          OPENCOVEN_WINDOWS_IMAGE_OS: 'win25-vs2026'
          OPENCOVEN_WINDOWS_IMAGE_VERSION: '20260907.229.1'
          OPENCOVEN_WINDOWS_PREVIOUS_IMAGE_VERSION: '20260824.214.3'
          OPENCOVEN_WINDOWS_BUILD: '26100.33296'
          OPENCOVEN_WINDOWS_KERNEL32_VERSION: '10.0.26100.33296'
          OPENCOVEN_WINDOWS_POWERSHELL_VERSION: '7.6.5'
          OPENCOVEN_WINDOWS_POWERSHELL_PATH: 'C:\Program Files\PowerShell\7\pwsh.exe'
          OPENCOVEN_WINDOWS_DOTNET_VERSION: '10.0.11'
          OPENCOVEN_WINDOWS_VS_VERSION: '18.9.12120.119'
          OPENCOVEN_WINDOWS_PREVIOUS_VS_VERSION: '18.9.12112.369'
          OPENCOVEN_WINDOWS_VS_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          OPENCOVEN_WINDOWS_MSVC_VERSION: '14.44.35207'
          OPENCOVEN_WINDOWS_MSVC_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207'
          OPENCOVEN_WINDOWS_CL_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe'
          OPENCOVEN_WINDOWS_LINK_PATH: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\link.exe'
          OPENCOVEN_WINDOWS_SDK_VERSION: '10.0.26100.0'
          OPENCOVEN_WINDOWS_RC_PATH: 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\rc.exe'
          OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID: ${{ needs['windows-supervisor'].outputs.artifact_id }}
          OPENCOVEN_WINDOWS_GITHUB_API_URL: ${{ github.api_url }}
          OPENCOVEN_WINDOWS_GITHUB_REPOSITORY: ${{ github.repository }}
          OPENCOVEN_WINDOWS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Require-LowercaseGitOid {
            param([AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Protected workflow revision must be an exact lowercase 40-hex commit.'
            }
            return $Value
          }

          function Get-ReviewedWindowsVisualStudioVersion {
            if ($env:ImageVersion -ceq $env:OPENCOVEN_WINDOWS_IMAGE_VERSION) {
              return $env:OPENCOVEN_WINDOWS_VS_VERSION
            }
            if ($env:ImageVersion -ceq $env:OPENCOVEN_WINDOWS_PREVIOUS_IMAGE_VERSION) {
              return $env:OPENCOVEN_WINDOWS_PREVIOUS_VS_VERSION
            }
            throw 'The Windows runner image does not match a reviewed image profile.'
          }

          function Assert-NoReparsePath {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            if (-not [IO.Path]::IsPathFullyQualified($Path)) {
              throw "$Label is not absolute."
            }
            $item = Get-Item -LiteralPath $Path -Force
            while ($null -ne $item) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "$Label contains a reparse component."
              }
              if ($item -is [IO.FileInfo]) {
                $item = $item.Directory
              } else {
                $item = $item.Parent
              }
            }
          }

          function Assert-MicrosoftSignature {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if (
              $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(?:^|, )CN=Microsoft '
            ) {
              throw "$Label does not have a valid Microsoft Authenticode signature."
            }
          }

          function Download-WindowsSupervisorArtifact {
            param(
              [Parameter(Mandatory)][string]$Destination,
              [Parameter(Mandatory)][string]$Token
            )
            if (
              $env:OPENCOVEN_WINDOWS_GITHUB_API_URL -cne 'https://api.github.com' -or
              $env:OPENCOVEN_WINDOWS_GITHUB_REPOSITORY -cne 'OpenCoven/chat' -or
              $env:OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              [String]::IsNullOrWhiteSpace($Token) -or
              $Token.Contains("`r") -or
              $Token.Contains("`n")
            ) {
              throw 'The frozen Windows supervisor artifact binding is invalid.'
            }
            $artifactUri = [uri](
              "$($env:OPENCOVEN_WINDOWS_GITHUB_API_URL)/repos/" +
              "$($env:OPENCOVEN_WINDOWS_GITHUB_REPOSITORY)/actions/artifacts/" +
              "$($env:OPENCOVEN_WINDOWS_SUPERVISOR_ARTIFACT_ID)/zip"
            )
            $handler = [Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseProxy = $false
            $client = [Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(30)
            try {
              $request = [Net.Http.HttpRequestMessage]::new(
                [Net.Http.HttpMethod]::Get,
                $artifactUri
              )
              $request.Headers.Authorization =
                [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $Token)
              $request.Headers.UserAgent.ParseAdd('OpenCoven-Chat-Conformance')
              $response = $client.Send(
                $request,
                [Net.Http.HttpCompletionOption]::ResponseHeadersRead
              )
              $request.Dispose()
              try {
                if ([int]$response.StatusCode -ne 302 -or $null -eq $response.Headers.Location) {
                  throw 'The frozen Windows supervisor artifact did not return one redirect.'
                }
                $downloadUri = $response.Headers.Location
              } finally {
                $response.Dispose()
              }
              if (
                -not $downloadUri.IsAbsoluteUri -or
                $downloadUri.Scheme -cne 'https' -or
                -not $downloadUri.Host.EndsWith(
                  '.blob.core.windows.net',
                  [StringComparison]::OrdinalIgnoreCase
                )
              ) {
                throw 'The frozen Windows supervisor artifact redirect left its host allowlist.'
              }
              $downloadRequest = [Net.Http.HttpRequestMessage]::new(
                [Net.Http.HttpMethod]::Get,
                $downloadUri
              )
              $downloadResponse = $client.Send(
                $downloadRequest,
                [Net.Http.HttpCompletionOption]::ResponseHeadersRead
              )
              $downloadRequest.Dispose()
              try {
                if (-not $downloadResponse.IsSuccessStatusCode) {
                  throw 'The frozen Windows supervisor artifact download failed.'
                }
                if (
                  $null -ne $downloadResponse.Content.Headers.ContentLength -and
                  $downloadResponse.Content.Headers.ContentLength -gt 1MB
                ) {
                  throw 'The frozen Windows supervisor artifact archive exceeded its limit.'
                }
                $archiveBytes = (
                  $downloadResponse.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                )
              } finally {
                $downloadResponse.Dispose()
              }
            } finally {
              $client.Dispose()
              $handler.Dispose()
            }
            if ($archiveBytes.Length -lt 1 -or $archiveBytes.Length -gt 1MB) {
              throw 'The frozen Windows supervisor artifact archive size is invalid.'
            }
            $archiveStream = [IO.MemoryStream]::new($archiveBytes, $false)
            $archive = [IO.Compression.ZipArchive]::new(
              $archiveStream,
              [IO.Compression.ZipArchiveMode]::Read,
              $false
            )
            try {
              if (
                $archive.Entries.Count -ne 1 -or
                $archive.Entries[0].FullName -cne 'phase1-process-supervisor.exe' -or
                $archive.Entries[0].Length -ne 333824
              ) {
                throw 'The frozen Windows supervisor artifact archive shape changed.'
              }
              $input = $archive.Entries[0].Open()
              $output = [IO.File]::Open(
                $Destination,
                [IO.FileMode]::CreateNew,
                [IO.FileAccess]::Write,
                [IO.FileShare]::None
              )
              try {
                $input.CopyTo($output)
                $output.Flush($true)
              } finally {
                $output.Dispose()
                $input.Dispose()
              }
            } finally {
              $archive.Dispose()
              $archiveStream.Dispose()
            }
            if (
              (Get-Item -LiteralPath $Destination).Length -ne 333824 -or
              (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                '372b3e8b5b860e0759da8fa10ddfb6ec338e26d83616254c816a456ae2e1b7c5'
            ) {
              throw 'The frozen Windows supervisor artifact bytes changed.'
            }
          }

          $windowsSupervisorToken = $env:OPENCOVEN_WINDOWS_GITHUB_TOKEN
          Remove-Item Env:OPENCOVEN_WINDOWS_GITHUB_TOKEN
          $validatorRevision = Require-LowercaseGitOid `
            -Value $env:OPENCOVEN_VALIDATOR_REVISION_INPUT
          $protectedValidatorRevision = Require-LowercaseGitOid `
            -Value $env:OPENCOVEN_PROTECTED_VALIDATOR_REVISION
          if ($validatorRevision -cne $protectedValidatorRevision) {
            throw 'Protected workflow revision does not match the environment validator revision.'
          }
          if (
            -not $IsWindows -or
            $env:RUNNER_OS -ne 'Windows' -or
            $env:ImageOS -ne $env:OPENCOVEN_WINDOWS_IMAGE_OS
          ) {
            throw 'The win32-x64 lane requires the GitHub windows-2025 image.'
          }
          $reviewedVisualStudioVersion = Get-ReviewedWindowsVisualStudioVersion
          if (
            [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or
            [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64' -or
            $env:PROCESSOR_ARCHITECTURE -ne 'AMD64'
          ) {
            throw 'The protected Windows lane requires a native AMD64 process and kernel.'
          }
          if ([Environment]::OSVersion.Version.Build -ne 26100) {
            throw 'The protected Windows lane requires the Windows Server 2025 kernel family.'
          }
          $windowsVersion = Get-ItemProperty `
            -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          if (
            "$($windowsVersion.CurrentBuildNumber).$($windowsVersion.UBR)" -ne
              $env:OPENCOVEN_WINDOWS_BUILD -or
            $PSVersionTable.PSEdition -ne 'Core' -or
            $PSVersionTable.PSVersion.ToString() -ne
              $env:OPENCOVEN_WINDOWS_POWERSHELL_VERSION -or
            [Environment]::Version.ToString() -ne $env:OPENCOVEN_WINDOWS_DOTNET_VERSION
          ) {
            throw 'The protected Windows lane requires the exact reviewed OS/PowerShell/.NET image.'
          }

          $trustedPwsh = $env:OPENCOVEN_WINDOWS_POWERSHELL_PATH
          $trustedKernel32 = 'C:\Windows\System32\kernel32.dll'
          $trustedAdvapi32 = 'C:\Windows\System32\advapi32.dll'
          $trustedNetapi32 = 'C:\Windows\System32\netapi32.dll'
          $trustedUserenv = 'C:\Windows\System32\userenv.dll'
          $trustedComspec = 'C:\Windows\System32\cmd.exe'
          $runningPwsh = [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          if (
            -not [IO.File]::Exists($trustedPwsh) -or
            -not [IO.File]::Exists($trustedKernel32) -or
            -not [IO.File]::Exists($trustedAdvapi32) -or
            -not [IO.File]::Exists($trustedNetapi32) -or
            -not [IO.File]::Exists($trustedUserenv) -or
            -not [IO.File]::Exists($trustedComspec) -or
            -not [String]::Equals(
              [IO.Path]::GetFullPath($runningPwsh),
              $trustedPwsh,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw 'Trusted absolute PowerShell or system DLL paths are unavailable.'
          }
          Assert-NoReparsePath -Path $trustedPwsh -Label 'System PowerShell'
          Assert-NoReparsePath -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-NoReparsePath -Path $trustedAdvapi32 -Label 'System advapi32.dll'
          Assert-NoReparsePath -Path $trustedNetapi32 -Label 'System netapi32.dll'
          Assert-NoReparsePath -Path $trustedUserenv -Label 'System userenv.dll'
          Assert-NoReparsePath -Path $trustedComspec -Label 'System command processor'
          $kernelVersion = (
            [Diagnostics.FileVersionInfo]::GetVersionInfo($trustedKernel32).FileVersion -split ' '
          )[0]
          if (
            $kernelVersion -ne $env:OPENCOVEN_WINDOWS_KERNEL32_VERSION
          ) {
            throw 'The kernel32.dll facility is outside the exact reviewed Windows image.'
          }
          Assert-MicrosoftSignature -Path $trustedPwsh -Label 'System PowerShell'
          Assert-MicrosoftSignature -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-MicrosoftSignature -Path $trustedAdvapi32 -Label 'System advapi32.dll'
          Assert-MicrosoftSignature -Path $trustedNetapi32 -Label 'System netapi32.dll'
          Assert-MicrosoftSignature -Path $trustedUserenv -Label 'System userenv.dll'
          Assert-MicrosoftSignature -Path $trustedComspec -Label 'System command processor'

          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $artifactWorkspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          Assert-NoReparsePath -Path $runnerTemp -Label 'Runner temporary root'
          Assert-NoReparsePath -Path $artifactWorkspace -Label 'GitHub artifact workspace'
          if (
            (Get-ChildItem -LiteralPath $artifactWorkspace -Force | Measure-Object).Count -ne 0
          ) {
            throw 'The pre-checkout GitHub workspace is not empty.'
          }
          $visualStudioRoot = $env:OPENCOVEN_WINDOWS_VS_PATH
          $trustedVisualStudio = Join-Path $visualStudioRoot 'Common7\IDE\devenv.exe'
          if (
            -not [IO.Directory]::Exists($visualStudioRoot) -or
            -not [IO.File]::Exists($trustedVisualStudio)
          ) {
            throw 'The exact reviewed Visual Studio 2026 installation is unavailable.'
          }
          $visualStudioVersion = (
            [Diagnostics.FileVersionInfo]::GetVersionInfo($trustedVisualStudio).ProductVersion `
              -split ' '
          )[0]
          if ($visualStudioVersion -cne $reviewedVisualStudioVersion) {
            throw 'The reviewed Visual Studio 2026 version changed.'
          }
          Assert-NoReparsePath -Path $visualStudioRoot -Label 'Visual Studio 2026 installation'
          Assert-NoReparsePath -Path $trustedVisualStudio -Label 'Visual Studio 2026 executable'
          Assert-MicrosoftSignature -Path $trustedVisualStudio -Label 'Visual Studio 2026 executable'

          $msvcRoot = $env:OPENCOVEN_WINDOWS_MSVC_PATH
          $expectedMsvcRoot = Join-Path `
            $visualStudioRoot `
            "VC\Tools\MSVC\$($env:OPENCOVEN_WINDOWS_MSVC_VERSION)"
          if (
            -not [IO.Directory]::Exists($msvcRoot) -or
            -not [String]::Equals(
              [IO.Path]::GetFullPath($msvcRoot),
              [IO.Path]::GetFullPath($expectedMsvcRoot),
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw 'The exact reviewed Visual Studio 2026 MSVC facility is unavailable.'
          }
          $msvcBin = Join-Path $msvcRoot 'bin\Hostx64\x64'
          $msvcLib = Join-Path $msvcRoot 'lib\x64'
          $msvcInclude = Join-Path $msvcRoot 'include'
          $windowsSdkVersion = $env:OPENCOVEN_WINDOWS_SDK_VERSION
          $windowsSdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $windowsSdkBin = Join-Path $windowsSdkRoot "bin\$windowsSdkVersion\x64"
          $windowsSdkLibUm = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\um\x64"
          $windowsSdkLibUcrt = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\ucrt\x64"
          $windowsSdkIncludeRoot = Join-Path $windowsSdkRoot "Include\$windowsSdkVersion"
          if (
            (Join-Path $windowsSdkBin 'rc.exe') -ne $env:OPENCOVEN_WINDOWS_RC_PATH
          ) {
            throw 'The exact reviewed Windows SDK resource compiler path changed.'
          }
          foreach ($facility in @(
            $msvcBin,
            $msvcLib,
            $msvcInclude,
            $windowsSdkBin,
            $windowsSdkLibUm,
            $windowsSdkLibUcrt,
            $windowsSdkIncludeRoot
          )) {
            Assert-NoReparsePath -Path $facility -Label 'MSVC/Windows SDK facility'
          }
          if (
            (Join-Path $msvcBin 'cl.exe') -ne $env:OPENCOVEN_WINDOWS_CL_PATH -or
            (Join-Path $msvcBin 'link.exe') -ne $env:OPENCOVEN_WINDOWS_LINK_PATH
          ) {
            throw 'The exact reviewed MSVC compiler or linker path changed.'
          }
          $trustedBuildTools = @(
            $env:OPENCOVEN_WINDOWS_LINK_PATH,
            $env:OPENCOVEN_WINDOWS_CL_PATH,
            $env:OPENCOVEN_WINDOWS_RC_PATH
          )
          foreach ($tool in $trustedBuildTools) {
            if (-not [IO.File]::Exists($tool)) {
              throw 'A required trusted MSVC/Windows SDK executable is unavailable.'
            }
            Assert-NoReparsePath -Path $tool -Label 'MSVC/Windows SDK executable'
            Assert-MicrosoftSignature -Path $tool -Label 'MSVC/Windows SDK executable'
          }

          # BEGIN bounded Windows supervisor source v1
          $encodedSupervisor = @'
          
          '@
          if ($encodedSupervisor.Length -ne 59416) { throw 'Supervisor payload length mismatch.' }
          $compressedSupervisor = [Convert]::FromBase64String($encodedSupervisor)
          if ($compressedSupervisor.Length -ne 44560) { throw 'Supervisor compressed size mismatch.' }
          $compressedSupervisorDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressedSupervisor)).ToLowerInvariant()
          if ($compressedSupervisorDigest -cne '0d919fc9a270eac33da98cc6f557c1a1fc862c24ac1489e7f9fa38ced7728e35') { throw 'Supervisor compressed digest mismatch.' }
          $supervisorSourceSize = 329556
          $supervisorSourceBytes = [byte[]]::new($supervisorSourceSize)
          $supervisorInput = [IO.MemoryStream]::new($compressedSupervisor, $false)
          $supervisorGzip = $null
          try {
            $supervisorGzip = [IO.Compression.GZipStream]::new($supervisorInput, [IO.Compression.CompressionMode]::Decompress)
            $supervisorRead = 0
            while ($supervisorRead -lt $supervisorSourceSize) {
              $supervisorCount = $supervisorGzip.Read($supervisorSourceBytes, $supervisorRead, $supervisorSourceSize - $supervisorRead)
              if ($supervisorCount -eq 0) { throw 'Supervisor source is truncated.' }
              $supervisorRead += $supervisorCount
            }
            if ($supervisorGzip.ReadByte() -ne -1) { throw 'Supervisor source exceeds the reviewed size.' }
            $supervisorDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($supervisorSourceBytes)).ToLowerInvariant()
            if ($supervisorDigest -cne 'de2103afa3c475a9696d68cc3db3cdbfb022731cb35a5a49507148b540b7d0e0') { throw 'Supervisor source digest mismatch.' }
            $jobSupervisorSource = [Text.UTF8Encoding]::new($false, $true).GetString($supervisorSourceBytes)
          } finally {
            if ($null -ne $supervisorGzip) { $supervisorGzip.Dispose() }
            $supervisorInput.Dispose()
          }
          # END bounded Windows supervisor source v1
          Add-Type -TypeDefinition $jobSupervisorSource -Language CSharp
          [OpenCoven.WindowsJobSupervisor]::ProtectSupervisorDirectory(
            $artifactWorkspace
          )
          $artifactDirectory = Join-Path $artifactWorkspace '.artifacts'
          [IO.Directory]::CreateDirectory($artifactDirectory) | Out-Null
          [OpenCoven.WindowsJobSupervisor]::ProtectSupervisorDirectory(
            $artifactDirectory
          )
          $trustedValidatorSupervisorSource = Join-Path `
            $artifactWorkspace `
            'windows-job-supervisor.cs'
          [IO.File]::WriteAllText(
            $trustedValidatorSupervisorSource,
            $jobSupervisorSource,
            [Text.UTF8Encoding]::new($false)
          )
          $trustedFreshValidator = Join-Path `
            $artifactWorkspace `
            'validate-handle-captured-record.ps1'
          [IO.File]::WriteAllText(
            $trustedFreshValidator,
            @'
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Add-Type -TypeDefinition (
            [IO.File]::ReadAllText($env:OPENCOVEN_WINDOWS_JOB_SUPERVISOR_SOURCE)
          ) -Language CSharp
          $inputStream = [Console]::OpenStandardInput()
          $memory = [IO.MemoryStream]::new()
          try {
            $inputStream.CopyTo($memory)
            $bytes = $memory.ToArray()
          } finally {
            $memory.Dispose()
            $inputStream.Dispose()
          }
          [OpenCoven.WindowsJobSupervisor]::RequireCanonicalSchemaV2Artifact(
            $bytes,
            $env:OPENCOVEN_EXPECTED_RECORD_SHA256,
            'win32-x64'
          )
          '@,
            [Text.UTF8Encoding]::new($false)
          )

          $isolatedUser = $null
          $job = $null
          $bootstrapPin = $null
          $workspacePin = $null
          $artifactWorkspacePin = $null
          $artifactDirectoryPin = $null
          $bootstrapRoot = $null
          $fleetSupervisorParent = 'C:\OpenCoven'
          $fleetSupervisorRoot = Join-Path $fleetSupervisorParent 'conformance'
          $fleetSupervisorPath = Join-Path $fleetSupervisorRoot 'phase1-process-supervisor.exe'
          try {
            $nonce = [Convert]::ToHexString(
              [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
            ).ToLowerInvariant()
            $jobName = "Local\OpenCoven.Chat.Conformance.$nonce"
            $bootstrapRoot = Join-Path $runnerTemp "opencoven-win32-$nonce"
            $isolatedUser = [OpenCoven.WindowsIsolatedUser]::Create($bootstrapRoot)
            $workspace = $isolatedUser.WorkspacePath
            $caveConformanceTemp = Join-Path $bootstrapRoot 'cave-conformance-temp'
            [IO.Directory]::CreateDirectory($caveConformanceTemp) | Out-Null
            [OpenCoven.WindowsJobSupervisor]::SecureCaveConformanceTempDirectory(
              $caveConformanceTemp,
              $isolatedUser.Sid,
              [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            )
            $job = [OpenCoven.WindowsJobSupervisor]::Create($jobName, $isolatedUser)
            Assert-NoReparsePath -Path $bootstrapRoot -Label 'Bootstrap root'
            $bootstrapPin = [OpenCoven.WindowsJobSupervisor]::PinDirectory($bootstrapRoot)
            $workspacePin = [OpenCoven.WindowsJobSupervisor]::PinDirectory($workspace)
            $artifactWorkspacePin =
              [OpenCoven.WindowsJobSupervisor]::PinDirectory($artifactWorkspace)
            $artifactDirectoryPin =
              [OpenCoven.WindowsJobSupervisor]::PinDirectory($artifactDirectory)

            if (Test-Path -LiteralPath $fleetSupervisorParent) {
              throw 'The frozen Windows supervisor destination already exists.'
            }
            [IO.Directory]::CreateDirectory($fleetSupervisorRoot) | Out-Null
            Download-WindowsSupervisorArtifact `
              -Destination $fleetSupervisorPath `
              -Token $windowsSupervisorToken
            $windowsSupervisorToken = $null
            $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $isolatedSid = [Security.Principal.SecurityIdentifier]::new($isolatedUser.Sid)
