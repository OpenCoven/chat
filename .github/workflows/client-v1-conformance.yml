              'OPENCOVEN_WINDOWS_JOB_SUPERVISOR_SOURCE'
            ] = $trustedValidatorSupervisorSource
            $freshValidationStart.Environment[
              'OPENCOVEN_EXPECTED_RECORD_SHA256'
            ] = $validatedArtifact.Sha256
            $freshValidationProcess = [Diagnostics.Process]::Start(
              $freshValidationStart
            )
            try {
              $freshStdout = $freshValidationProcess.StandardOutput.ReadToEndAsync()
              $freshStderr = $freshValidationProcess.StandardError.ReadToEndAsync()
              $freshValidationProcess.StandardInput.BaseStream.Write(
                $validatedArtifact.Bytes,
                0,
                $validatedArtifact.Bytes.Length
              )
              $freshValidationProcess.StandardInput.Close()
              if (-not $freshValidationProcess.WaitForExit(30000)) {
                $freshValidationProcess.Kill($true)
                $freshValidationProcess.WaitForExit()
                throw 'Fresh trusted handle-captured record validation timed out.'
              }
              if (-not [Threading.Tasks.Task]::WaitAll(
                [Threading.Tasks.Task[]]@($freshStdout, $freshStderr),
                30000
              )) {
                throw 'Fresh trusted validator output could not be reaped.'
              }
              if (
                $freshValidationProcess.ExitCode -ne 0 -or
                $freshStdout.Result.Length -ne 0 -or
                $freshStderr.Result.Length -ne 0
