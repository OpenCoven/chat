name: client-v1 conformance
on:
  workflow_dispatch:
    inputs:
      validator_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  platform-conformance:
    name: platform-conformance (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    environment: client-v1-conformance
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Bootstrap supervised Windows conformance
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_WINDOWS_IMAGE_OS: 'win25'
          OPENCOVEN_WINDOWS_IMAGE_VERSION: '20260824.239.3'
          OPENCOVEN_WINDOWS_BUILD: '26100.33296'
          OPENCOVEN_WINDOWS_KERNEL32_VERSION: '10.0.26100.33296'
          OPENCOVEN_WINDOWS_POWERSHELL_VERSION: '7.6.5'
          OPENCOVEN_WINDOWS_POWERSHELL_PATH: 'C:\Program Files\PowerShell\7\pwsh.exe'
          OPENCOVEN_WINDOWS_DOTNET_VERSION: '10.0.11'
          OPENCOVEN_WINDOWS_MSVC_VERSION: '14.50.35717'
          OPENCOVEN_WINDOWS_MSVC_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.50.35717'
          OPENCOVEN_WINDOWS_SDK_VERSION: '10.0.26100.0'
          OPENCOVEN_WINDOWS_RC_PATH: 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\rc.exe'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Require-LowercaseGitOid {
            param([AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Protected workflow revision must be an exact lowercase 40-hex commit.'
            }
            return $Value
          }

          function Assert-NoReparsePath {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            if (-not [IO.Path]::IsPathFullyQualified($Path)) {
              throw "$Label is not absolute."
            }
            $item = Get-Item -LiteralPath $Path -Force
            while ($null -ne $item) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "$Label contains a reparse component."
              }
              $item = $item.Parent
            }
          }

          function Assert-MicrosoftSignature {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Label
            )
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if (
              $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(?:^|, )CN=Microsoft '
            ) {
              throw "$Label does not have a valid Microsoft Authenticode signature."
            }
          }

          $validatorRevision = Require-LowercaseGitOid `
            -Value $env:OPENCOVEN_VALIDATOR_REVISION_INPUT
          if (
            -not $IsWindows -or
            $env:RUNNER_OS -ne 'Windows' -or
            $env:ImageOS -ne $env:OPENCOVEN_WINDOWS_IMAGE_OS -or
            $env:ImageVersion -ne $env:OPENCOVEN_WINDOWS_IMAGE_VERSION
          ) {
            throw 'The win32-x64 lane requires the GitHub windows-2025 image.'
          }
          if (
            [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or
            [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64' -or
            $env:PROCESSOR_ARCHITECTURE -ne 'AMD64'
          ) {
            throw 'The protected Windows lane requires a native AMD64 process and kernel.'
          }
          if ([Environment]::OSVersion.Version.Build -ne 26100) {
            throw 'The protected Windows lane requires the Windows Server 2025 kernel family.'
          }
          $windowsVersion = Get-ItemProperty `
            -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          if (
            "$($windowsVersion.CurrentBuildNumber).$($windowsVersion.UBR)" -ne
              $env:OPENCOVEN_WINDOWS_BUILD -or
            $PSVersionTable.PSEdition -ne 'Core' -or
            $PSVersionTable.PSVersion.ToString() -ne
              $env:OPENCOVEN_WINDOWS_POWERSHELL_VERSION -or
            [Environment]::Version.ToString() -ne $env:OPENCOVEN_WINDOWS_DOTNET_VERSION
          ) {
            throw 'The protected Windows lane requires the exact reviewed OS/PowerShell/.NET image.'
          }

          $trustedPwsh = $env:OPENCOVEN_WINDOWS_POWERSHELL_PATH
          $trustedKernel32 = 'C:\Windows\System32\kernel32.dll'
          $trustedComspec = 'C:\Windows\System32\cmd.exe'
          $runningPwsh = [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          if (
            -not [IO.File]::Exists($trustedPwsh) -or
            -not [IO.File]::Exists($trustedKernel32) -or
            -not [IO.File]::Exists($trustedComspec) -or
            -not [String]::Equals(
              [IO.Path]::GetFullPath($runningPwsh),
              $trustedPwsh,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw 'Trusted absolute PowerShell or system DLL paths are unavailable.'
          }
          Assert-NoReparsePath -Path $trustedPwsh -Label 'System PowerShell'
          Assert-NoReparsePath -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-NoReparsePath -Path $trustedComspec -Label 'System command processor'
          $kernelVersion = (
            [Diagnostics.FileVersionInfo]::GetVersionInfo($trustedKernel32).FileVersion -split ' '
          )[0]
          if (
            $kernelVersion -ne $env:OPENCOVEN_WINDOWS_KERNEL32_VERSION
          ) {
            throw 'The kernel32.dll facility is outside the exact reviewed Windows image.'
          }
          Assert-MicrosoftSignature -Path $trustedPwsh -Label 'System PowerShell'
          Assert-MicrosoftSignature -Path $trustedKernel32 -Label 'System kernel32.dll'
          Assert-MicrosoftSignature -Path $trustedComspec -Label 'System command processor'

          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          Assert-NoReparsePath -Path $runnerTemp -Label 'Runner temporary root'
          Assert-NoReparsePath -Path $workspace -Label 'GitHub workspace'
          if ((Get-ChildItem -LiteralPath $workspace -Force | Measure-Object).Count -ne 0) {
            throw 'The pre-checkout GitHub workspace is not empty.'
          }
          $msvcRoot = $env:OPENCOVEN_WINDOWS_MSVC_PATH
          if (
            -not [IO.Directory]::Exists($msvcRoot) -or
            [IO.Path]::GetFileName($msvcRoot) -ne $env:OPENCOVEN_WINDOWS_MSVC_VERSION
          ) {
            throw 'The exact reviewed Visual Studio 2022 MSVC facility is unavailable.'
          }
          $msvcBin = Join-Path $msvcRoot 'bin\Hostx64\x64'
          $msvcLib = Join-Path $msvcRoot 'lib\x64'
          $msvcInclude = Join-Path $msvcRoot 'include'
          $windowsSdkVersion = $env:OPENCOVEN_WINDOWS_SDK_VERSION
          $windowsSdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $windowsSdkBin = Join-Path $windowsSdkRoot "bin\$windowsSdkVersion\x64"
          $windowsSdkLibUm = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\um\x64"
          $windowsSdkLibUcrt = Join-Path $windowsSdkRoot "Lib\$windowsSdkVersion\ucrt\x64"
          $windowsSdkIncludeRoot = Join-Path $windowsSdkRoot "Include\$windowsSdkVersion"
          if (
            (Join-Path $windowsSdkBin 'rc.exe') -ne $env:OPENCOVEN_WINDOWS_RC_PATH
          ) {
            throw 'The exact reviewed Windows SDK resource compiler path changed.'
          }
          foreach ($facility in @(
            $msvcBin,
            $msvcLib,
            $msvcInclude,
            $windowsSdkBin,
            $windowsSdkLibUm,
            $windowsSdkLibUcrt,
            $windowsSdkIncludeRoot
          )) {
            Assert-NoReparsePath -Path $facility -Label 'MSVC/Windows SDK facility'
          }
          $trustedBuildTools = @(
            (Join-Path $msvcBin 'link.exe'),
            (Join-Path $msvcBin 'cl.exe'),
            $env:OPENCOVEN_WINDOWS_RC_PATH
          )
          foreach ($tool in $trustedBuildTools) {
            if (-not [IO.File]::Exists($tool)) {
              throw 'A required trusted MSVC/Windows SDK executable is unavailable.'
            }
            Assert-NoReparsePath -Path $tool -Label 'MSVC/Windows SDK executable'
            Assert-MicrosoftSignature -Path $tool -Label 'MSVC/Windows SDK executable'
          }

          $jobSupervisorSource = @'
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;
          using Microsoft.Win32.SafeHandles;

          namespace OpenCoven
          {
              public sealed class WindowsPinnedDirectory : IDisposable
              {
                  private IntPtr handle;

                  internal WindowsPinnedDirectory(IntPtr value)
                  {
                      handle = value;
                  }

                  public void Dispose()
                  {
                      IntPtr value = handle;
                      handle = IntPtr.Zero;
                      if (value != IntPtr.Zero)
                      {
                          WindowsJobSupervisor.ReleasePinnedDirectory(value);
                      }
                      GC.SuppressFinalize(this);
                  }
              }

              public sealed class WindowsJobRunResult
              {
                  public int ExitCode { get; internal set; }
                  public bool TimedOut { get; internal set; }
                  public bool StdoutOverflow { get; internal set; }
                  public bool StderrOverflow { get; internal set; }
                  public bool ResourceQuotaExceeded { get; internal set; }
                  public string Stdout { get; internal set; }
                  public string Stderr { get; internal set; }
              }

              public sealed class WindowsDirectoryQuota
              {
                  public string Label { get; private set; }
                  public string PathPattern { get; private set; }
                  public long MaxBytes { get; private set; }

                  public WindowsDirectoryQuota(string label, string pathPattern, long maxBytes)
                  {
                      if (String.IsNullOrWhiteSpace(label) || label.Length > 120)
                      {
                          throw new ArgumentException("Quota label is invalid.", "label");
                      }
                      if (String.IsNullOrWhiteSpace(pathPattern) || !Path.IsPathRooted(pathPattern))
                      {
                          throw new ArgumentException("Quota path pattern must be absolute.", "pathPattern");
                      }
                      string[] segments = pathPattern
                          .Substring(Path.GetPathRoot(pathPattern).Length)
                          .Split(new char[] { '\\', '/' }, StringSplitOptions.RemoveEmptyEntries);
                      foreach (string segment in segments)
                      {
                          if (segment == "." ||
                              segment == ".." ||
                              segment.IndexOf('?') >= 0 ||
                              (segment.IndexOf('*') >= 0 &&
                                  segment != "*" &&
                                  (!segment.EndsWith("*", StringComparison.Ordinal) ||
                                      segment.IndexOf('*') != segment.Length - 1)))
                          {
                              throw new ArgumentException(
                                  "Quota path pattern is outside the reviewed grammar.",
                                  "pathPattern");
                          }
                      }
                      if (maxBytes < 1)
                      {
                          throw new ArgumentOutOfRangeException("maxBytes");
                      }
                      Label = label;
                      PathPattern = pathPattern;
                      MaxBytes = maxBytes;
                  }
              }

              public sealed class WindowsJobSupervisor : IDisposable
              {
                  private const uint CREATE_SUSPENDED = 0x00000004;
                  private const uint CREATE_UNICODE_ENVIRONMENT = 0x00000400;
                  private const uint CREATE_NO_WINDOW = 0x08000000;
                  private const uint STARTF_USESTDHANDLES = 0x00000100;
                  private const uint HANDLE_FLAG_INHERIT = 0x00000001;
                  private const uint JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE = 0x00002000;
                  private const uint JOB_OBJECT_QUERY = 0x0004;
                  private const uint FILE_ATTRIBUTE_DIRECTORY = 0x00000010;
                  private const uint FILE_ATTRIBUTE_REPARSE_POINT = 0x00000400;
                  private const uint FILE_FLAG_BACKUP_SEMANTICS = 0x02000000;
                  private const uint FILE_FLAG_OPEN_REPARSE_POINT = 0x00200000;
                  private const uint WAIT_OBJECT_0 = 0x00000000;
                  private const uint WAIT_TIMEOUT = 0x00000102;
                  private const uint INFINITE = 0xffffffff;
                  private const int JobObjectExtendedLimitInformation = 9;
                  private const int SupervisorFailureExitCode = unchecked((int)0xe0434f4d);
                  private const int MaximumQuotaEntries = 500000;

                  private IntPtr jobHandle;
                  private bool disposed;

                  private WindowsJobSupervisor(IntPtr handle)
                  {
                      jobHandle = handle;
                  }

                  public static WindowsJobSupervisor Create(string name)
                  {
                      if (String.IsNullOrWhiteSpace(name) ||
                          !name.StartsWith(@"Local\OpenCoven.Chat.", StringComparison.Ordinal) ||
                          name.Length > 240)
                      {
                          throw new ArgumentException("Job Object name is outside the reviewed namespace.", "name");
                      }

                      IntPtr handle = CreateJobObjectW(IntPtr.Zero, name);
                      if (handle == IntPtr.Zero)
                      {
                          throw new Win32Exception(Marshal.GetLastWin32Error(), "CreateJobObjectW failed.");
                      }

                      try
                      {
                          JOBOBJECT_EXTENDED_LIMIT_INFORMATION limits =
                              new JOBOBJECT_EXTENDED_LIMIT_INFORMATION();
                          limits.BasicLimitInformation.LimitFlags = JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE;
                          int length = Marshal.SizeOf(typeof(JOBOBJECT_EXTENDED_LIMIT_INFORMATION));
                          IntPtr buffer = Marshal.AllocHGlobal(length);
                          try
                          {
                              Marshal.StructureToPtr(limits, buffer, false);
                              if (!SetInformationJobObject(
                                      handle,
                                      JobObjectExtendedLimitInformation,
                                      buffer,
                                      (uint)length))
                              {
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "SetInformationJobObject failed.");
                              }
                          }
                          finally
                          {
                              Marshal.FreeHGlobal(buffer);
                          }
                          return new WindowsJobSupervisor(handle);
                      }
                      catch
                      {
                          CloseHandle(handle);
                          throw;
                      }
                  }

                  public static void RequireCurrentProcessInJob(string name)
                  {
                      IntPtr expectedJob = OpenJobObjectW(JOB_OBJECT_QUERY, false, name);
                      if (expectedJob == IntPtr.Zero)
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "The expected Job Object could not be opened.");
                      }

                      try
                      {
                          bool membership;
                          if (!IsProcessInJob(GetCurrentProcess(), expectedJob, out membership))
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "IsProcessInJob failed.");
                          }
                          if (!membership)
                          {
                              throw new InvalidOperationException(
                                  "The process is not a member of the expected Job Object.");
                          }
                      }
                      finally
                      {
                          CloseHandle(expectedJob);
                      }
                  }

                  public static WindowsPinnedDirectory PinDirectory(string path)
                  {
                      if (String.IsNullOrWhiteSpace(path) || !Path.IsPathRooted(path))
                      {
                          throw new ArgumentException("Pinned directory path must be absolute.", "path");
                      }
                      SECURITY_ATTRIBUTES attributes = new SECURITY_ATTRIBUTES();
                      attributes.nLength = Marshal.SizeOf(typeof(SECURITY_ATTRIBUTES));
                      IntPtr handle = CreateFileW(
                          path,
                          0x00000080,
                          0x00000001 | 0x00000002,
                          ref attributes,
                          3,
                          FILE_FLAG_BACKUP_SEMANTICS | FILE_FLAG_OPEN_REPARSE_POINT,
                          IntPtr.Zero);
                      if (handle == new IntPtr(-1))
                      {
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "Bootstrap directory could not be pinned.");
                      }
                      FILE_ATTRIBUTE_TAG_INFO information;
                      if (!GetFileInformationByHandleEx(
                              handle,
                              9,
                              out information,
                              (uint)Marshal.SizeOf(typeof(FILE_ATTRIBUTE_TAG_INFO))) ||
                          (information.FileAttributes & FILE_ATTRIBUTE_DIRECTORY) == 0 ||
                          (information.FileAttributes & FILE_ATTRIBUTE_REPARSE_POINT) != 0)
                      {
                          CloseHandle(handle);
                          throw new InvalidOperationException(
                              "Bootstrap directory is not a stable non-reparse directory.");
                      }
                      return new WindowsPinnedDirectory(handle);
                  }

                  public WindowsJobRunResult Run(
                      string applicationName,
                      string arguments,
                      string workingDirectory,
                      IDictionary environment,
                      TimeSpan TotalTimeout,
                      int MaxStdoutBytes,
                      int MaxStderrBytes)
                  {
                      return Run(
                          applicationName,
                          arguments,
                          workingDirectory,
                          environment,
                          TotalTimeout,
                          MaxStdoutBytes,
                          MaxStderrBytes,
                          new WindowsDirectoryQuota[0]);
                  }

                  public WindowsJobRunResult Run(
                      string applicationName,
                      string arguments,
                      string workingDirectory,
                      IDictionary environment,
                      TimeSpan TotalTimeout,
                      int MaxStdoutBytes,
                      int MaxStderrBytes,
                      WindowsDirectoryQuota[] DirectoryQuotas)
                  {
                      ThrowIfDisposed();
                      if (String.IsNullOrWhiteSpace(applicationName) || !Path.IsPathRooted(applicationName))
                      {
                          throw new ArgumentException("Application path must be absolute.", "applicationName");
                      }
                      if (applicationName.IndexOf('"') >= 0)
                      {
                          throw new ArgumentException("Application path contains a quote.", "applicationName");
                      }
                      if (String.IsNullOrWhiteSpace(workingDirectory) || !Path.IsPathRooted(workingDirectory))
                      {
                          throw new ArgumentException("Working directory must be absolute.", "workingDirectory");
                      }
                      if (TotalTimeout <= TimeSpan.Zero || TotalTimeout > TimeSpan.FromHours(1))
                      {
                          throw new ArgumentOutOfRangeException("TotalTimeout");
                      }
                      if (MaxStdoutBytes < 1 || MaxStderrBytes < 1)
                      {
                          throw new ArgumentOutOfRangeException("Output bounds must be positive.");
                      }
                      if (DirectoryQuotas == null)
                      {
                          throw new ArgumentNullException("DirectoryQuotas");
                      }
                      foreach (WindowsDirectoryQuota quota in DirectoryQuotas)
                      {
                          if (quota == null)
                          {
                              throw new ArgumentException(
                                  "Directory quotas may not contain null entries.",
                                  "DirectoryQuotas");
                          }
                      }

                      SECURITY_ATTRIBUTES inheritable = new SECURITY_ATTRIBUTES();
                      inheritable.nLength = Marshal.SizeOf(typeof(SECURITY_ATTRIBUTES));
                      inheritable.bInheritHandle = true;
                      IntPtr stdoutRead = IntPtr.Zero;
                      IntPtr stdoutWrite = IntPtr.Zero;
                      IntPtr stderrRead = IntPtr.Zero;
                      IntPtr stderrWrite = IntPtr.Zero;
                      IntPtr stdinHandle = IntPtr.Zero;
                      PROCESS_INFORMATION process = new PROCESS_INFORMATION();
                      IntPtr environmentBlock = IntPtr.Zero;
                      Task<PipeCapture> stdoutTask = null;
                      Task<PipeCapture> stderrTask = null;
                      Task quotaTask = null;
                      CancellationTokenSource quotaCancellation = new CancellationTokenSource();
                      ManualResetEventSlim overflow = new ManualResetEventSlim(false);
                      ManualResetEventSlim resourceQuotaExceeded = new ManualResetEventSlim(false);

                      try
                      {
                          CreateBoundedPipe(inheritable, out stdoutRead, out stdoutWrite);
                          CreateBoundedPipe(inheritable, out stderrRead, out stderrWrite);
                          stdinHandle = CreateFileW(
                              "NUL",
                              0x80000000,
                              0x00000001 | 0x00000002,
                              ref inheritable,
                              3,
                              0x00000080,
                              IntPtr.Zero);
                          if (stdinHandle == new IntPtr(-1))
                          {
                              stdinHandle = IntPtr.Zero;
                              throw new Win32Exception(Marshal.GetLastWin32Error(), "Opening NUL failed.");
                          }

                          STARTUPINFO startup = new STARTUPINFO();
                          startup.cb = Marshal.SizeOf(typeof(STARTUPINFO));
                          startup.dwFlags = STARTF_USESTDHANDLES;
                          startup.hStdInput = stdinHandle;
                          startup.hStdOutput = stdoutWrite;
                          startup.hStdError = stderrWrite;
                          environmentBlock = BuildEnvironmentBlock(environment);
                          StringBuilder commandLine = new StringBuilder();
                          commandLine.Append(QuoteArgument(applicationName));
                          if (!String.IsNullOrWhiteSpace(arguments))
                          {
                              commandLine.Append(' ');
                              commandLine.Append(arguments);
                          }

                          bool created = CreateProcessW(
                              applicationName,
                              commandLine,
                              IntPtr.Zero,
                              IntPtr.Zero,
                              true,
                              CREATE_SUSPENDED | CREATE_UNICODE_ENVIRONMENT | CREATE_NO_WINDOW,
                              environmentBlock,
                              workingDirectory,
                              ref startup,
                              out process);
                          if (!created)
                          {
                              throw new Win32Exception(Marshal.GetLastWin32Error(), "CreateProcessW failed.");
                          }

                          CloseHandle(stdoutWrite);
                          stdoutWrite = IntPtr.Zero;
                          CloseHandle(stderrWrite);
                          stderrWrite = IntPtr.Zero;
                          CloseHandle(stdinHandle);
                          stdinHandle = IntPtr.Zero;

                          if (!AssignProcessToJobObject(jobHandle, process.hProcess))
                          {
                              TerminateProcess(process.hProcess, 1);
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "AssignProcessToJobObject failed.");
                          }
                          bool assigned;
                          if (!IsProcessInJob(process.hProcess, jobHandle, out assigned) || !assigned)
                          {
                              TerminateJobObject(jobHandle, 1);
                              throw new InvalidOperationException(
                                  "Suspended child did not enter the expected Job Object.");
                          }

                          stdoutTask = ReadPipeAsync(stdoutRead, MaxStdoutBytes, overflow);
                          stdoutRead = IntPtr.Zero;
                          stderrTask = ReadPipeAsync(stderrRead, MaxStderrBytes, overflow);
                          stderrRead = IntPtr.Zero;
                          if (DirectoryQuotas.Length > 0)
                          {
                              quotaTask = MonitorDirectoryQuotasAsync(
                                  DirectoryQuotas,
                                  resourceQuotaExceeded,
                                  quotaCancellation.Token);
                          }

                          uint resumeResult = ResumeThread(process.hThread);
                          if (resumeResult == UInt32.MaxValue)
                          {
                              TerminateJobObject(jobHandle, 1);
                              throw new Win32Exception(Marshal.GetLastWin32Error(), "ResumeThread failed.");
                          }

                          Stopwatch timer = Stopwatch.StartNew();
                          bool timedOut = false;
                          bool terminated = false;
                          bool quotaExceeded = false;
                          while (true)
                          {
                              uint wait = WaitForSingleObject(process.hProcess, 50);
                              if (wait == WAIT_OBJECT_0)
                              {
                                  break;
                              }
                              if (wait != WAIT_TIMEOUT)
                              {
                                  TerminateJobObject(jobHandle, 1);
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "WaitForSingleObject failed.");
                              }
                              if (
                                  overflow.IsSet ||
                                  resourceQuotaExceeded.IsSet ||
                                  timer.Elapsed >= TotalTimeout)
                              {
                                  timedOut = timer.Elapsed >= TotalTimeout;
                                  quotaExceeded = resourceQuotaExceeded.IsSet;
                                  if (!TerminateJobObject(jobHandle, 1))
                                  {
                                      throw new Win32Exception(
                                          Marshal.GetLastWin32Error(),
                                          "TerminateJobObject failed.");
                                  }
                                  terminated = true;
                                  if (WaitForSingleObject(process.hProcess, 30000) != WAIT_OBJECT_0)
                                  {
                                      throw new TimeoutException(
                                          "Terminated supervised root could not be reaped.");
                                  }
                                  break;
                              }
                          }
                          if (!quotaExceeded && DirectoryQuotas.Length > 0)
                          {
                              quotaExceeded = DirectoryQuotasExceeded(DirectoryQuotas);
                              if (quotaExceeded && !terminated)
                              {
                                  if (!TerminateJobObject(jobHandle, 1))
                                  {
                                      throw new Win32Exception(
                                          Marshal.GetLastWin32Error(),
                                          "TerminateJobObject failed after resource quota excess.");
                                  }
                                  terminated = true;
                              }
                          }
                          quotaCancellation.Cancel();
                          if (quotaTask != null && !quotaTask.Wait(30000))
                          {
                              TerminateJobObject(jobHandle, 1);
                              throw new TimeoutException("Directory quota monitor could not be reaped.");
                          }

                          uint nativeExitCode;
                          if (!GetExitCodeProcess(process.hProcess, out nativeExitCode))
                          {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "GetExitCodeProcess failed.");
                          }
                          int exitCode = unchecked((int)nativeExitCode);
                          if (!terminated && exitCode != 0)
                          {
                              if (!TerminateJobObject(jobHandle, nativeExitCode))
                              {
                                  throw new Win32Exception(
                                      Marshal.GetLastWin32Error(),
                                      "TerminateJobObject failed after child failure.");
                              }
                          }

                          if (!Task.WaitAll(new Task[] { stdoutTask, stderrTask }, 30000))
                          {
                              TerminateJobObject(jobHandle, 1);
                              throw new TimeoutException("Supervised output readers could not be reaped.");
                          }
                          PipeCapture stdout = stdoutTask.Result;
                          PipeCapture stderr = stderrTask.Result;
                          bool outputOverflow = stdout.Overflow || stderr.Overflow;
                          return new WindowsJobRunResult
                          {
                              ExitCode = timedOut || outputOverflow || quotaExceeded
                                  ? SupervisorFailureExitCode
                                  : exitCode,
                              TimedOut = timedOut,
                              StdoutOverflow = stdout.Overflow,
                              StderrOverflow = stderr.Overflow,
                              ResourceQuotaExceeded = quotaExceeded,
                              Stdout = stdout.Text,
                              Stderr = stderr.Text,
                          };
                      }
                      catch
                      {
                          if (process.hProcess != IntPtr.Zero)
                          {
                              TerminateJobObject(jobHandle, 1);
                              WaitForSingleObject(process.hProcess, 30000);
                          }
                          throw;
                      }
                      finally
                      {
                          quotaCancellation.Cancel();
                          if (quotaTask != null)
                          {
                              try
                              {
                                  quotaTask.Wait(30000);
                              }
                              catch (AggregateException)
                              {
                              }
                          }
                          quotaCancellation.Dispose();
                          resourceQuotaExceeded.Dispose();
                          overflow.Dispose();
                          if (environmentBlock != IntPtr.Zero)
                          {
                              Marshal.FreeHGlobal(environmentBlock);
                          }
                          CloseIfValid(process.hThread);
                          CloseIfValid(process.hProcess);
                          CloseIfValid(stdoutRead);
                          CloseIfValid(stdoutWrite);
                          CloseIfValid(stderrRead);
                          CloseIfValid(stderrWrite);
                          CloseIfValid(stdinHandle);
                      }
                  }

                  private static Task MonitorDirectoryQuotasAsync(
                      WindowsDirectoryQuota[] quotas,
                      ManualResetEventSlim exceeded,
                      CancellationToken cancellationToken)
                  {
                      return Task.Run(delegate
                      {
                          while (!cancellationToken.IsCancellationRequested)
                          {
                              try
                              {
                                  if (DirectoryQuotasExceeded(quotas))
                                  {
                                      exceeded.Set();
                                      return;
                                  }
                              }
                              catch
                              {
                                  exceeded.Set();
                                  return;
                              }
                              if (cancellationToken.WaitHandle.WaitOne(1000))
                              {
                                  return;
                              }
                          }
                      });
                  }

                  private static bool DirectoryQuotasExceeded(WindowsDirectoryQuota[] quotas)
                  {
                      foreach (WindowsDirectoryQuota quota in quotas)
                      {
                          long total = 0;
                          foreach (string path in ExpandQuotaPattern(quota.PathPattern))
                          {
                              total = checked(
                                  total + MeasureDirectoryBytes(
                                      path,
                                      quota.MaxBytes - Math.Min(total, quota.MaxBytes)));
                              if (total > quota.MaxBytes)
                              {
                                  return true;
                              }
                          }
                      }
                      return false;
                  }

                  private static IEnumerable<string> ExpandQuotaPattern(string pattern)
                  {
                      string root = Path.GetPathRoot(pattern);
                      string relative = pattern.Substring(root.Length);
                      string[] segments = relative.Split(
                          new char[] { '\\', '/' },
                          StringSplitOptions.RemoveEmptyEntries);
                      List<string> candidates = new List<string>();
                      candidates.Add(root);
                      foreach (string segment in segments)
                      {
                          List<string> next = new List<string>();
                          foreach (string candidate in candidates)
                          {
                              if (!Directory.Exists(candidate))
                              {
                                  continue;
                              }
                              if (segment.IndexOf('*') >= 0)
                              {
                                  foreach (string matched in Directory.GetDirectories(
                                      candidate,
                                      segment,
                                      SearchOption.TopDirectoryOnly))
                                  {
                                      next.Add(matched);
                                  }
                              }
                              else
                              {
                                  string child = Path.Combine(candidate, segment);
                                  if (Directory.Exists(child))
                                  {
                                      next.Add(child);
                                  }
                              }
                          }
                          candidates = next;
                          if (candidates.Count == 0)
                          {
                              break;
                          }
                      }
                      return candidates;
                  }

                  private static long MeasureDirectoryBytes(string root, long remaining)
                  {
                      long total = 0;
                      int entries = 0;
                      Stack<string> directories = new Stack<string>();
                      directories.Push(root);
                      while (directories.Count > 0)
                      {
                          string directory = directories.Pop();
                          FileAttributes directoryAttributes = File.GetAttributes(directory);
                          if ((directoryAttributes & FileAttributes.ReparsePoint) != 0)
                          {
                              continue;
                          }
                          foreach (string entry in Directory.EnumerateFileSystemEntries(directory))
                          {
                              entries++;
                              if (entries > MaximumQuotaEntries)
                              {
                                  throw new IOException("Directory quota entry bound exceeded.");
                              }
                              FileAttributes attributes = File.GetAttributes(entry);
                              if ((attributes & FileAttributes.ReparsePoint) != 0)
                              {
                                  continue;
                              }
                              if ((attributes & FileAttributes.Directory) != 0)
                              {
                                  directories.Push(entry);
                              }
                              else
                              {
                                  total = checked(total + new FileInfo(entry).Length);
                                  if (total > remaining)
                                  {
                                      return total;
                                  }
                              }
                          }
                      }
                      return total;
                  }

                  public void Dispose()
                  {
                      if (!disposed)
                      {
                          disposed = true;
                          IntPtr handle = jobHandle;
                          jobHandle = IntPtr.Zero;
                          if (handle != IntPtr.Zero)
                          {
                              CloseHandle(handle);
                          }
                      }
                      GC.SuppressFinalize(this);
                  }

                  private void ThrowIfDisposed()
                  {
                      if (disposed || jobHandle == IntPtr.Zero)
                      {
                          throw new ObjectDisposedException("WindowsJobSupervisor");
                      }
                  }

                  private static void CreateBoundedPipe(
                      SECURITY_ATTRIBUTES attributes,
                      out IntPtr read,
                      out IntPtr write)
                  {
                      if (!CreatePipe(out read, out write, ref attributes, 0))
                      {
                          throw new Win32Exception(Marshal.GetLastWin32Error(), "CreatePipe failed.");
                      }
                      if (!SetHandleInformation(read, HANDLE_FLAG_INHERIT, 0))
                      {
                          CloseHandle(read);
                          CloseHandle(write);
                          read = IntPtr.Zero;
                          write = IntPtr.Zero;
                          throw new Win32Exception(
                              Marshal.GetLastWin32Error(),
                              "SetHandleInformation failed.");
                      }
                  }

                  private static Task<PipeCapture> ReadPipeAsync(
                      IntPtr handle,
                      int maximumBytes,
                      ManualResetEventSlim overflow)
                  {
                      SafeFileHandle safeHandle = new SafeFileHandle(handle, true);
                      return Task.Run(delegate
                      {
                          using (safeHandle)
                          using (FileStream stream = new FileStream(safeHandle, FileAccess.Read, 4096, false))
                          using (MemoryStream captured = new MemoryStream())
                          {
                              byte[] buffer = new byte[8192];
                              bool exceeded = false;
                              while (true)
                              {
                                  int count = stream.Read(buffer, 0, buffer.Length);
                                  if (count == 0)
                                  {
                                      break;
                                  }
                                  int remaining = maximumBytes - checked((int)captured.Length);
                                  if (remaining > 0)
                                  {
                                      captured.Write(buffer, 0, Math.Min(remaining, count));
                                  }
                                  if (count > remaining)
                                  {
                                      exceeded = true;
                                      overflow.Set();
                                  }
                              }
                              return new PipeCapture
                              {
                                  Overflow = exceeded,
                                  Text = new UTF8Encoding(false, true).GetString(captured.ToArray()),
                              };
                          }
                      });
                  }

                  private static IntPtr BuildEnvironmentBlock(IDictionary environment)
                  {
                      SortedDictionary<string, string> values =
                          new SortedDictionary<string, string>(StringComparer.OrdinalIgnoreCase);
                      if (environment != null)
                      {
                          foreach (DictionaryEntry entry in environment)
                          {
                              string key = Convert.ToString(entry.Key);
                              string value = Convert.ToString(entry.Value);
                              if (String.IsNullOrEmpty(key) || key.IndexOf('=') >= 0 ||
                                  key.IndexOf('\0') >= 0 || value.IndexOf('\0') >= 0)
                              {
                                  throw new ArgumentException("Child environment is malformed.");
                              }
                              values.Add(key, value);
                          }
                      }

                      StringBuilder block = new StringBuilder();
                      foreach (KeyValuePair<string, string> entry in values)
                      {
                          block.Append(entry.Key);
                          block.Append('=');
                          block.Append(entry.Value);
                          block.Append('\0');
                      }
                      if (values.Count == 0)
                      {
                          block.Append('\0');
                      }
                      block.Append('\0');
                      byte[] bytes = Encoding.Unicode.GetBytes(block.ToString());
                      IntPtr pointer = Marshal.AllocHGlobal(bytes.Length);
                      Marshal.Copy(bytes, 0, pointer, bytes.Length);
                      return pointer;
                  }

                  private static string QuoteArgument(string value)
                  {
                      return "\"" + value + "\"";
                  }

                  private static void CloseIfValid(IntPtr handle)
                  {
                      if (handle != IntPtr.Zero && handle != new IntPtr(-1))
                      {
                          CloseHandle(handle);
                      }
                  }

                  internal static void ReleasePinnedDirectory(IntPtr handle)
                  {
                      CloseHandle(handle);
                  }

