      - name: Install Linux native dependencies
        if: matrix.platform != 'win32-x64' && matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          for package in \
            dbus-daemon=1.14.10-4ubuntu4.1 \
            gnome-keyring=46.1-2ubuntu0.2 \
            libsecret-tools=0.21.4-1build3; do
            name="${package%%=*}"
            version="${package#*=}"
            [[ "$(apt-cache policy "$name" | awk '/Candidate:/ { print $2 }')" == "$version" ]]
          done
          sudo apt-get install --yes --no-install-recommends \
            dbus-daemon=1.14.10-4ubuntu4.1 \
            gnome-keyring=46.1-2ubuntu0.2 \
            libsecret-tools=0.21.4-1build3 \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            file
          [[ "$(dpkg-query -W -f='${Version}' dbus-daemon)" == "1.14.10-4ubuntu4.1" ]]
          [[ "$(dpkg-query -W -f='${Version}' gnome-keyring)" == "46.1-2ubuntu0.2" ]]
          [[ "$(dpkg-query -W -f='${Version}' libsecret-tools)" == "0.21.4-1build3" ]]
          pkg-config --exists webkit2gtk-4.1 gtk+-3.0 ayatana-appindicator3-0.1
      - name: Install frozen Unix Rust
        if: matrix.platform != 'win32-x64'
        run: 'node --input-type=module --eval "import { execFileSync } from ''node:child_process''; import { resolveExecutableInvocation } from ''./scripts/executable-resolution.mjs''; const command = ''rustup''; const invocation = resolveExecutableInvocation(command, process.env, process.platform, [''toolchain'', ''install'', ''1.95.0'', ''--profile'', ''minimal'']); execFileSync(invocation.executable, invocation.args, { argv0: command, stdio: ''inherit'' });"'
      - name: Require frozen toolchain
        if: matrix.platform != 'win32-x64'
        run: 'node --input-type=module --eval "import { execFileSync } from ''node:child_process''; import { resolveExecutableInvocation } from ''./scripts/executable-resolution.mjs''; const run = (command, args) => { const invocation = resolveExecutableInvocation(command, process.env, process.platform, args); return execFileSync(invocation.executable, invocation.args, { encoding: ''utf8'' }).trim(); }; if (process.version !== ''v24.18.1'' || ''pnpm@'' + run(''pnpm'', [''--version'']) !== ''pnpm@10.34.0'' || !run(''rustc'', [''--version'']).startsWith(''rustc 1.95.0 '')) throw new Error(''Frozen toolchain does not match'');"'
      - name: Prepare trusted Unix supervisor
        if: matrix.platform != 'win32-x64'
        shell: bash
        run: "set -euo pipefail\nnode --input-type=module <<'EOF'\nimport { createHash } from 'node:crypto';\nimport { lstatSync, readFileSync } from 'node:fs';\nconst expected = new Map([\n  ['scripts/contract-canary.mjs', [40116, '1683e2484a228b89ee241b9b434f277895bb6113fa1c2f7051267563b2582380']],\n  ['scripts/executable-resolution.mjs', [9154, '31e3c412ff8c835f14522f36a59e91f4a4ba82913210ae8e3b4455217503f430']],\n  ['scripts/owned-temp-directory.mjs', [6965, 'a9c55c85cf2b7d70310d278bafd2c8e7695d66f4ae38b9c3f1f12fce0b442095']],\n  ['scripts/phase1-artifact-secret-scan.mjs', [21183, 'be0ec302b9c4372f232d6bd1efcba873fd3380cc5de7f756cd0b9eeeec07222a']],\n          ['scripts/phase1-conformance-lock.mjs', [48960, '8cfcd89aca252a9c4c6f23932012e8b443341030963dae2d2a5a57650492b3b6']],\n  ['scripts/phase1-conformance.mjs', [212618, '7a770074a35745627599a28e1752684661eb1403e2b3024db429e4c4700ebc67']],\n  ['scripts/phase1-evidence-contract.mjs', [15088, '24180ae03835fa6aac45559682adb3c1e626bab76466eddc55b9e2300f0a2b7f']],\n  ['scripts/phase1-evidence-runtime.mjs', [6078, '3d227c354e6d908c5912d2b8244336e3b79c3bbd4dec79b0ad219ed65b8cb159']],\n  ['scripts/phase1-linux-secret-service.mjs', [4270, 'ddf834c6f57853c5116b4b1f345952a218ff0687c5d741737c68e20bc2ecda92']],\n  ['scripts/phase1-macos-keychain.mjs', [5091, 'ab0c2dd08cf606d9502f5da206175707d471d99f484e8c8c79b5b08a5772b9a4']],\n  ['scripts/phase1-process-supervisor.mjs', [3820, '16b51fb1a33b4bfef98daca549aacf5dc2d2c098cfbd664753b69c940d1e6f6c']],\n  ['scripts/phase1-schema-v2-evidence.mjs', [52505, '0aede2ab3abd76fabf5ac61d64d2dbaaffa497c8647b82236403de16a47751c8']],\n          ['scripts/phase1-schema-v2-producer.mjs', [208728, '4c06ea93f3c6ff71cfdd338348660bfd35d92a136bafdce159b0cb1e4d31fc2b']],\n  ['scripts/process-owned-artifact-root.mjs', [11788, '426c2c8e36dc3bffddb35a565c07a60998b010660f6248ebc4264d9c4b502624']],\n  ['scripts/supervised-exec.mjs', [2875, 'a5edfd985b934d3b46247a0da3141682c411d30bb582edf87ae7b29791dad65b']],\n  ['scripts/supervisor-status.mjs', [854, 'ac332ca7b6b040ecc846088bb3a6ad5e7112a0454eb3ea71d2a819d55e64254e']],\n  ['scripts/phase1-linux-secret-service.sh', [5650, '83ce19c0dd6da5002f6853fa37addb4fc2d39f3d17beee1b1c39e1fce232b476']],\n  ['scripts/unix-artifact-handoff.c', [18704, '2a003f9aa1d1886b9a593371a73cb65fe3a4a8b703f1c59fec8a27694367b7fc']],\n  ['scripts/unix-producer-command.sh', [3223, 'ce9ec2ff00947f3ec0db53f144c99d34bc27de6085062d00dccff7c934c2e3c8']],\n  ['scripts/unix-producer-supervisor.sh', [29424, 'b73036415744c80ed27d5667f255ceea149096ca517b47c93a154299802206ff']],\n]);\nfor (const [path, [size, digest]] of expected) {\n  const stats = lstatSync(path);\n  const bytes = readFileSync(path);\n  if (\n    !stats.isFile() ||\n    stats.isSymbolicLink() ||\n    stats.nlink !== 1 ||\n    bytes.byteLength !== size ||\n    createHash('sha256').update(bytes).digest('hex') !== digest\n  ) {\n    throw new Error('Trusted Unix supervisor source bytes do not match');\n  }\n}\nconsole.log('Frozen harness module graph verified.');\nEOF\nbroker_root=\"/tmp/opencoven-unix-broker\"\n(umask 077 && mkdir \"$broker_root\")\ncc -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra -Werror -O2 \\\n  scripts/unix-artifact-handoff.c \\\n  -o \"$broker_root/unix-artifact-handoff\"\nchmod 500 \"$broker_root/unix-artifact-handoff\"\n"
      - name: Compute reviewed Unix tool path
        id: unix-tool-path
        if: matrix.platform != 'win32-x64'
        run: 'node --input-type=module --eval "import { appendFileSync } from ''node:fs''; import { resolveExecutableInvocation, resolveUnixToolPath } from ''./scripts/executable-resolution.mjs''; const toolPath = resolveUnixToolPath([''git'']); const nodeExecutable = resolveExecutableInvocation(''node'', process.env, process.platform, []).resolvedCommand; const pnpmExecutable = resolveExecutableInvocation(''pnpm'', process.env, process.platform, []).resolvedCommand; const rustupExecutable = resolveExecutableInvocation(''rustup'', process.env, process.platform, []).resolvedCommand; appendFileSync(process.env.GITHUB_OUTPUT, ''tool_path='' + toolPath + ''\nnode_executable='' + nodeExecutable + ''\npnpm_executable='' + pnpmExecutable + ''\nrustup_executable='' + rustupExecutable + ''\n'');"'
      - name: Run supervised Unix production and handoff
        if: matrix.platform != 'win32-x64'
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
        run: |
          set -euo pipefail
          mkdir -m 700 .artifacts
          if [[ "$(uname -s)" == Darwin ]]; then
            chmod -RN .artifacts
          fi
          broker_root="/tmp/opencoven-unix-broker"
          cleanup_broker_root() {
            rm -f -- "$broker_root/unix-artifact-handoff"
            rmdir "$broker_root" 2>/dev/null || true
          }
          trap cleanup_broker_root EXIT
          sudo --non-interactive scripts/unix-producer-supervisor.sh \
            --platform "${{ matrix.platform }}" \
            --source "$GITHUB_WORKSPACE" \
            --destination "$GITHUB_WORKSPACE/.artifacts/client-v1-conformance-${{ matrix.platform }}.json" \
            --temp-root "$broker_root" \
            --handoff-helper "/tmp/opencoven-unix-broker/unix-artifact-handoff" \
            --command scripts/unix-producer-command.sh \
            --node-executable "${{ steps['unix-tool-path'].outputs.node_executable }}" \
            --pnpm-executable "${{ steps['unix-tool-path'].outputs.pnpm_executable }}" \
            --rustup-executable "${{ steps['unix-tool-path'].outputs.rustup_executable }}" \
            --tool-path "${{ steps['unix-tool-path'].outputs.tool_path }}" \
            --validator-revision "$OPENCOVEN_VALIDATOR_REVISION"
      - name: Validate broker-owned Unix platform record
        if: matrix.platform != 'win32-x64'
        shell: bash
        run: "set -euo pipefail\nnode --input-type=module --eval \"\n  import { lstatSync, readFileSync } from 'node:fs';\n  import { parsePlatformEvidence } from './.phase1-counterparts/sdk-validator/scripts/conformance-contract.mjs';\n  import { scanPhase1ArtifactText } from './scripts/phase1-artifact-secret-scan.mjs';\n  const sort = (value) =>\n    Array.isArray(value)\n      ? value.map(sort)\n      : value !== null && typeof value === 'object'\n        ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sort(value[key])]))\n        : value;\n  const path = process.argv[1];\n  const expectedPlatform = process.argv[2];\n  const stats = lstatSync(path);\n  const text = readFileSync(path, 'utf8');\n  const value = JSON.parse(text);\n  if (\n    !stats.isFile() ||\n    stats.isSymbolicLink() ||\n    stats.nlink !== 1 ||\n    stats.uid !== process.getuid() ||\n    (stats.mode & 0o777) !== 0o600 ||\n    stats.size < 1 ||\n    stats.size > 1048576 ||\n    value === null ||\n    Array.isArray(value) ||\n    value.schemaVersion !== 2 ||\n    value.platform !== expectedPlatform ||\n    JSON.stringify(sort(value), null, 2) + '\\n' !== text\n  ) {\n    throw new Error('Broker-owned platform record is not canonical');\n  }\n  scanPhase1ArtifactText(text, {\n    validateReport(_value, contents) {\n      parsePlatformEvidence(contents, 'Broker-owned platform record');\n    },\n  });\n\" \".artifacts/client-v1-conformance-${{ matrix.platform }}.json\" \"${{ matrix.platform }}\"\n"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-v1-conformance-${{ matrix.platform }}
          path: .artifacts/client-v1-conformance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: true
  validate-conformance-artifacts:
    name: validate-conformance-artifacts
    if: github.ref == 'refs/heads/main'
    needs: platform-conformance
    runs-on: ubuntu-24.04
    environment: client-v1-conformance
    permissions:
      contents: read
    outputs:
      darwin_arm64_sha256: ${{ steps.validate.outputs.darwin_arm64_sha256 }}
      linux_x64_sha256: ${{ steps.validate.outputs.linux_x64_sha256 }}
      win32_x64_sha256: ${{ steps.validate.outputs.win32_x64_sha256 }}
    steps:
      - name: Require protected validator revision
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
        run: |
          set -euo pipefail
          if [[ ! "$OPENCOVEN_VALIDATOR_REVISION_INPUT" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$OPENCOVEN_VALIDATOR_REVISION_INPUT" != "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" ]]; then
            echo "Protected workflow revision does not match the environment validator revision." >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-darwin-arm64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-linux-x64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-win32-x64
          path: .artifacts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/sdk
          ref: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Validate exact SDK schema, parser, and scanner
        id: validate
        shell: bash
        run: "set -euo pipefail\nnode --input-type=module <<'EOF'\nimport { createHash } from 'node:crypto';\nimport { appendFileSync, lstatSync, readFileSync } from 'node:fs';\nimport { resolve } from 'node:path';\nimport { pathToFileURL } from 'node:url';\n\nconst validatorRoot = resolve('validator');\nconst {\n  parseFrozenConformanceLock,\n  parsePlatformEvidence,\n  scanConformanceEvidence,\n  serializeCanonicalJson,\n  validateFrozenConformanceBindings,\n} = await import(\n  pathToFileURL(resolve(validatorRoot, 'scripts/conformance-contract.mjs')).href\n);\nconst lock = parseFrozenConformanceLock(\n  readFileSync(\n    resolve(validatorRoot, 'conformance/client-v1-cross-repository-lock.json'),\n    'utf8',\n  ),\n  'protected SDK conformance lock',\n);\nconst { schema } = validateFrozenConformanceBindings(\n  lock,\n  readFileSync(\n    resolve(\n      validatorRoot,\n      'conformance/client-v1-cross-repository-evidence.schema.json',\n    ),\n    'utf8',\n  ),\n  readFileSync(\n    resolve(\n      validatorRoot,\n      'conformance/client-v1-cross-repository-assertions.json',\n    ),\n    'utf8',\n  ),\n);\nconst records = [\n  [\n    'darwin-arm64',\n    'darwin_arm64_sha256',\n    '.artifacts/client-v1-conformance-darwin-arm64.json',\n  ],\n  [\n    'linux-x64',\n    'linux_x64_sha256',\n    '.artifacts/client-v1-conformance-linux-x64.json',\n  ],\n  [\n    'win32-x64',\n    'win32_x64_sha256',\n    '.artifacts/client-v1-conformance-win32-x64.json',\n  ],\n];\nfor (const [platform, output, recordPath] of records) {\n  const path = resolve(recordPath);\n  const stats = lstatSync(path);\n  if (!stats.isFile() || stats.isSymbolicLink() || stats.size < 1 || stats.size > 1048576) {\n    throw new Error(`${platform} uploaded artifact is not one bounded regular file`);\n  }\n  const bytes = readFileSync(path);\n  const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);\n  const record = parsePlatformEvidence(text, `${platform} uploaded artifact`, schema);\n  scanConformanceEvidence(record);\n  if (record.platform !== platform || serializeCanonicalJson(record) !== text) {\n    throw new Error(`${platform} uploaded artifact is not exact canonical SDK evidence`);\n  }\n  const digest = createHash('sha256').update(bytes).digest('hex');\n  appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${digest}\\n`, 'utf8');\n}\nEOF\n"
  attest-conformance-artifacts:
    name: attest-conformance-artifacts
    if: github.ref == 'refs/heads/main'
    needs: validate-conformance-artifacts
    runs-on: ubuntu-24.04
    environment: client-v1-conformance
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-darwin-arm64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-linux-x64
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-v1-conformance-win32-x64
          path: .artifacts
      - name: Compare freshly downloaded artifact digests
        shell: bash
        env:
          OPENCOVEN_VALIDATOR_REVISION_INPUT: ${{ inputs.validator_revision }}
          OPENCOVEN_PROTECTED_VALIDATOR_REVISION: ${{ vars.CLIENT_V1_CONFORMANCE_VALIDATOR_REVISION }}
          OPENCOVEN_DARWIN_ARM64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.darwin_arm64_sha256 }}
          OPENCOVEN_LINUX_X64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.linux_x64_sha256 }}
          OPENCOVEN_WIN32_X64_SHA256: ${{ needs['validate-conformance-artifacts'].outputs.win32_x64_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$OPENCOVEN_VALIDATOR_REVISION_INPUT" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$OPENCOVEN_VALIDATOR_REVISION_INPUT" != "$OPENCOVEN_PROTECTED_VALIDATOR_REVISION" ]]; then
            echo "Protected workflow revision does not match the environment validator revision." >&2
            exit 1
          fi
          record=".artifacts/client-v1-conformance-darwin-arm64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_DARWIN_ARM64_SHA256" ]]
          record=".artifacts/client-v1-conformance-linux-x64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_LINUX_X64_SHA256" ]]
          record=".artifacts/client-v1-conformance-win32-x64.json"
          [[ -f "$record" && ! -L "$record" ]]
          actual="$(sha256sum "$record")"
          actual="${actual%% *}"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$OPENCOVEN_WIN32_X64_SHA256" ]]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-darwin-arm64.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-linux-x64.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/client-v1-conformance-win32-x64.json
  aggregate-conformance:
    name: aggregate-conformance
    if: github.ref == 'refs/heads/main'
    needs: attest-conformance-artifacts
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Confirm protected evidence matrix
        run: echo "protected evidence matrix completed"
