name: CodeQL

# Advanced setup, so the scan can read .github/codeql/codeql-config.yml.
# Default setup takes no configuration file. GitHub refuses an advanced
# analysis while default setup is on, so default setup must be turned off
# before this workflow is merged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  # Keyed by PR number or full ref, so a fork branch named main can't
  # cancel a scan of main.
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The languages default setup scanned, each without a build, as
        # default setup did.
        language: [actions, c-cpp, csharp, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          dependency-caching: true
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          # The same category default setup used, so its open alerts carry
          # over and those under an ignored path close as fixed.
          category: /language:${{ matrix.language }}
