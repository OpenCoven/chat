name: Windows project metadata

on:
  pull_request:
    paths:
      - 'src-tauri/src/familiar_projects*.rs'
      - '.github/workflows/windows-project-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Windows metadata security regressions
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Test the actual Windows metadata reader
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib familiar_projects -- --test-threads=1 2>&1 | Tee-Object -FilePath windows-metadata-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-project-metadata-${{ github.sha }}
          path: windows-metadata-tests.log
          if-no-files-found: error
