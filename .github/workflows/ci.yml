name: CI

on:
  pull_request:
  push:

# Both triggers fire for a branch with an open pull request, so every commit
# started two full runs of this workflow: the same suites executed twice, for
# the same commit, at double the cost. One run per branch is enough.
#
# This does not explain the runs that hung and held a runner until GitHub's
# six-hour limit. That was first attributed to the two runs racing for the
# preview server's fixed port, and the attribution was wrong: with concurrency
# in place and only one run, the job still stalled. The cause was apt-get, in
# two different jobs that had nothing in common except calling it, and it is
# addressed by the prebuilt image rather than here.
#
# The group name has to match across both events, which `github.ref` does not:
# a push gives `refs/heads/name` and a pull_request gives `refs/pull/N/merge`.
# `head_ref` is the source branch on a pull_request and empty on a push, so
# falling back to `ref_name` yields the same bare branch name for both.
#
# main is exempt from cancellation. Cancelling there would abandon the
# verification of a merge that has already landed, which is the one place the
# result still matters after the fact.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Every job below sets timeout-minutes. GitHub's default is six hours, which is
# not a timeout so much as an upper bound on the damage: a job that stops
# making progress holds a runner for the rest of the working day and reports
# nothing until it does. The numbers are set above the slowest successful run
# observed for each job, not tuned to it -- they exist to catch a hang, not to
# police a slow day.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The comparison needs both endpoints in history, and a shallow clone
          # has neither for anything but the newest commit.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify the diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Every unknown answers "code". A new branch has no `before`, a force
          # push has one that no longer exists, and a wrong guess in this
          # direction costs a few minutes of CI, while a wrong guess in the
          # other direction merges untested code.
          if [ -z "${BASE}" ] \
            || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating this as a code change."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "${BASE}" "${HEAD}")

          if [ -z "${files}" ]; then
            echo "No files changed; treating this as a code change."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "${files}" | sed 's/^/  /'

          docs_only=true
          while IFS= read -r file; do
            case "${file}" in
              # Prose, and nothing else. Note what is absent: a change under
              # .github is code by this rule, so editing CI cannot be the thing
              # that decides CI does not need to run.
              docs/*|*.md) ;;
              *) docs_only=false ;;
            esac
          done <<EOF
          ${files}
          EOF

          echo "docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [web, changes]
    # A documentation change cannot fail a browser test. This job took twenty
    # minutes to time out on a two-commit docs branch, twice, which is the
    # entire argument for the condition.
    if: needs.changes.outputs.docs_only != 'true'
    # The image carries Chromium and its system libraries already, so this job
    # no longer downloads a browser or calls apt. That removed the step that
    # hung five times. See .github/ci-image/Dockerfile.
    container:
      image: ghcr.io/opencoven/chat-ci@sha256:da7790204dc362185b6fcc74356255c97f03436afd876c3e2921714e3586f7ca
      # A package published by a workflow starts out private regardless of the
      # repository's visibility, so the pull is authenticated rather than
      # relying on it being public.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A no-op while the image's Playwright version matches the one in
      # package.json, which is the point of pinning the same version in both.
      # If someone bumps @playwright/test without rebuilding the image, this
      # downloads the new browser and the suite still runs -- slower, but not
      # broken, and never touching apt.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  contract-canary:
    name: Contract canary
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: reviewed-revisions
        name: Read reviewed counterpart lock
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { readContractCanaryLock } from './scripts/contract-canary.mjs';

          const lock = readContractCanaryLock();
          const outputPath = process.env.GITHUB_OUTPUT;

          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT must be set.');
          }

          appendFileSync(outputPath, `sdk_repository=${lock.sdk.repository}\n`);
          appendFileSync(outputPath, `sdk_revision=${lock.sdk.revision}\n`);
          appendFileSync(outputPath, `cave_repository=${lock.cave.repository}\n`);
          appendFileSync(outputPath, `cave_revision=${lock.cave.revision}\n`);
          EOF
      # CANARY_TOKEN, when set, is a fine-grained token with read access to the
      # counterpart repositories. The fallback to github.token is what makes
      # this safe to land before the secret exists: without it the job behaves
      # exactly as it does today.
      #
      # The default token is scoped to this repository alone, so it can only
      # read a counterpart that is public. That coupling has taken this job
      # down repeatedly whenever a sibling was switched to private, for reasons
      # having nothing to do with this repository's code. The token removes the
      # dependency on someone else's visibility setting.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.reviewed-revisions.outputs.sdk_repository }}
          ref: ${{ steps.reviewed-revisions.outputs.sdk_revision }}
          path: .cross-repo/sdk
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.reviewed-revisions.outputs.cave_repository }}
          ref: ${{ steps.reviewed-revisions.outputs.cave_revision }}
          path: .cross-repo/coven-cave
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assert checked-out reviewed revisions
        run: |
          node --input-type=module <<'EOF'
          import {
            assertCleanContractCanaryCheckouts,
            assertContractCanaryCheckoutHeads,
            readContractCanaryLock,
          } from './scripts/contract-canary.mjs';

          const lock = readContractCanaryLock();

          assertCleanContractCanaryCheckouts({
            sdkRoot: '.cross-repo/sdk',
            caveRoot: '.cross-repo/coven-cave',
          });

          assertContractCanaryCheckoutHeads(lock, {
            sdkRoot: '.cross-repo/sdk',
            caveRoot: '.cross-repo/coven-cave',
          });
          EOF
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install SDK dependencies
        working-directory: .cross-repo/sdk
        run: pnpm install --frozen-lockfile
      - name: Run contract canary
        run: pnpm test:contract-canary -- --sdk-root .cross-repo/sdk --cave-root .cross-repo/coven-cave

  phase1-conformance:
    name: Phase 1 real-authority conformance
    runs-on: macos-15
    needs: [web, changes]
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: phase1-revisions
        name: Read Phase 1 reviewed revisions
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { readPhase1ConformanceLock } from './scripts/phase1-conformance-lock.mjs';

          const lock = readPhase1ConformanceLock();
          const outputPath = process.env.GITHUB_OUTPUT;

          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT must be set.');
          }

          for (const repository of ['sdk', 'cave', 'coven']) {
            appendFileSync(outputPath, `${repository}_repository=${lock[repository].repository}\n`);
            appendFileSync(outputPath, `${repository}_revision=${lock[repository].revision}\n`);
          }
          appendFileSync(outputPath, `evidence_repository=${lock.evidence.repository}\n`);
          appendFileSync(outputPath, `evidence_revision=${lock.evidence.revision}\n`);
          EOF
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.phase1-revisions.outputs.sdk_repository }}
          ref: ${{ steps.phase1-revisions.outputs.sdk_revision }}
          path: .phase1-counterparts/sdk
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.phase1-revisions.outputs.evidence_repository }}
          ref: ${{ steps.phase1-revisions.outputs.evidence_revision }}
          path: .phase1-counterparts/sdk-evidence
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.phase1-revisions.outputs.cave_repository }}
          ref: ${{ steps.phase1-revisions.outputs.cave_revision }}
          path: .phase1-counterparts/coven-cave
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.phase1-revisions.outputs.coven_repository }}
          ref: ${{ steps.phase1-revisions.outputs.coven_revision }}
          path: .phase1-counterparts/coven
          token: ${{ secrets.CANARY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - id: phase1-keychain
        name: Configure isolated Phase 1 keychain
        shell: bash
        run: |
          set -euo pipefail

          security default-keychain -d user | sed 's/^[[:space:]]*"//; s/"$//' > "$RUNNER_TEMP/phase1-original-default-keychain"
          security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//' > "$RUNNER_TEMP/phase1-original-keychains"

          keychain="$RUNNER_TEMP/phase1-conformance.keychain-db"
          password="$(uuidgen)"
          echo "::add-mask::${password}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 2700 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security default-keychain -d user -s "${keychain}"
          security list-keychains -d user -s "${keychain}"
          echo "PHASE1_TEST_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
      - id: phase1-run
        name: Run packaged Phase 1 conformance
        shell: bash
        env:
          OPENCOVEN_CHAT_ROOT: ${{ github.workspace }}
          OPENCOVEN_SDK_ROOT: ${{ github.workspace }}/.phase1-counterparts/sdk
          OPENCOVEN_SDK_EVIDENCE_ROOT: ${{ github.workspace }}/.phase1-counterparts/sdk-evidence
          OPENCOVEN_CAVE_ROOT: ${{ github.workspace }}/.phase1-counterparts/coven-cave
          OPENCOVEN_COVEN_ROOT: ${{ github.workspace }}/.phase1-counterparts/coven
          OPENCOVEN_PHASE1_TEST_KEYCHAIN_ISOLATED: "1"
        run: |
          set +e
          launcher_digest="$(/usr/bin/shasum -a 256 scripts/phase1-conformance-launcher.sh | /usr/bin/awk '{print $1}')"
          if [[ "${launcher_digest}" != "88e184d465eaf7bd6ce828dcc81ecadb11b6222f01576c56090060085820e7b2" ]]; then
            status=1
          else
            node_path="$(command -v node)"
            /bin/sh scripts/phase1-conformance-launcher.sh "${node_path}"
            status=$?
          fi
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - id: secret-scan
        name: Re-scan retained Phase 1 report
        if: always() && hashFiles('test-results/phase1-conformance/report.json') != ''
        run: node ./scripts/phase1-artifact-secret-scan.mjs --artifact-root ./test-results/phase1-conformance
      - id: phase1-keychain-cleanup
        name: Remove isolated Phase 1 keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$RUNNER_TEMP/phase1-original-default-keychain" ]]; then
            original_default="$(cat "$RUNNER_TEMP/phase1-original-default-keychain")"
            if [[ -n "${original_default}" ]]; then
              security default-keychain -d user -s "${original_default}"
            fi
          fi

          if [[ -f "$RUNNER_TEMP/phase1-original-keychains" ]]; then
            keychains=()
            while IFS= read -r keychain; do
              if [[ -n "${keychain}" ]]; then
                keychains+=("${keychain}")
              fi
            done < "$RUNNER_TEMP/phase1-original-keychains"
            if [[ "${#keychains[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${keychains[@]}"
            fi
          fi

          if [[ -n "${PHASE1_TEST_KEYCHAIN:-}" ]]; then
            security delete-keychain "${PHASE1_TEST_KEYCHAIN}"
          fi
      - name: Upload sanitized Phase 1 report
        if: always() && steps.secret-scan.outcome == 'success' && steps.phase1-keychain-cleanup.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-conformance-report
          path: test-results/phase1-conformance/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Phase 1 conformance result
        if: always()
        shell: bash
        run: |
          test "${{ steps.phase1-run.outputs.exit_code }}" = "0"
          test "${{ steps.secret-scan.outcome }}" = "success"
          test "${{ steps.phase1-keychain-cleanup.outcome }}" = "success"

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    needs: [web, changes]
    if: needs.changes.outputs.docs_only != 'true'
    # The apt-get that used to open this job is now baked into the image. It
    # hung for forty-seven minutes on 19 August with no timeout to stop it,
    # which is how the cause was finally identified: a second job, sharing no
    # code with the first, stuck on the same kind of step.
    container:
      image: ghcr.io/opencoven/chat-ci@sha256:da7790204dc362185b6fcc74356255c97f03436afd876c3e2921714e3586f7ca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm app:build

  rust:
    name: Rust
    runs-on: macos-latest
    needs: changes
    # macOS runners bill at ten times the Linux rate. Spending that on a branch
    # that changed only prose is the least defensible minute in this file.
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: rustup target add x86_64-pc-windows-gnu
      - name: Install pinned Windows GNU toolchain
        env:
          HOMEBREW_BOTTLE_DOMAIN: https://ghcr.io/v2/homebrew/core
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          core_revision="cd168d1fdc26f12e4ad64f358ff2dbec61ab7a57"
          formula="${RUNNER_TEMP}/mingw-w64.rb"
          bottle="${RUNNER_TEMP}/mingw-w64--14.0.0_3.arm64_tahoe.bottle.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/Homebrew/homebrew-core/${core_revision}/Formula/m/mingw-w64.rb" \
            -o "${formula}"
          test "$(shasum -a 256 "${formula}" | awk '{print $1}')" = "798631311a841e0639469f3f95a5287c8747f7a354e79a47ac39d6bf20eefe34"
          grep -F 'revision 3' "${formula}"
          grep -F 'sha256 arm64_tahoe:   "c4f826c665c0fb37a3dedc80affa6203a0d64891b788c8f7ab65b46862fd490c"' "${formula}"

          brew uninstall --force mingw-w64 >/dev/null 2>&1 || true
          if brew list --versions mingw-w64 | grep -q .; then
            echo "existing mingw-w64 installation was not removed" >&2
            exit 1
          fi

          token="$(curl -fsSL 'https://ghcr.io/token?scope=repository:homebrew/core/mingw-w64:pull' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            'https://ghcr.io/v2/homebrew/core/mingw-w64/manifests/14.0.0_3' |
            python3 -c 'import json,sys; d=json.load(sys.stdin); matches=[m for m in d["manifests"] if m.get("annotations",{}).get("org.opencontainers.image.ref.name")=="14.0.0_3.arm64_tahoe"]; assert len(matches)==1; assert matches[0]["annotations"]["sh.brew.bottle.digest"]=="0d68ab737a8bbc8c63ac6ac7acc0695e2887c1169df9a4423f1180090079b1d5"'

          curl --proto '=https' --tlsv1.2 -fsSL \
            -H "Authorization: Bearer ${token}" \
            'https://ghcr.io/v2/homebrew/core/mingw-w64/blobs/sha256:0d68ab737a8bbc8c63ac6ac7acc0695e2887c1169df9a4423f1180090079b1d5' \
            -o "${bottle}"
          test "$(shasum -a 256 "${bottle}" | awk '{print $1}')" = "0d68ab737a8bbc8c63ac6ac7acc0695e2887c1169df9a4423f1180090079b1d5"
          test "$(wc -c < "${bottle}" | tr -d ' ')" = "356178908"
          HOMEBREW_DEVELOPER=1 brew install --force-bottle "${bottle}"
          test "$(brew list --versions mingw-w64)" = "mingw-w64 14.0.0_3"
          x86_64-w64-mingw32-ld --version | head -n 1 | grep -F '2.47.20260726'
      - name: Verify Windows GNU resource compiler
        run: command -v x86_64-w64-mingw32-windres
      - name: Verify standalone supervisor crate graph
        working-directory: tools/phase1-process-supervisor
        run: |
          cargo metadata \
            --locked \
            --no-deps \
            --format-version 1 |
          python -c 'import json,sys; d=json.load(sys.stdin); assert [p["name"] for p in d["packages"]]==["phase1-process-supervisor"]; assert d["workspace_root"].endswith("tools/phase1-process-supervisor")'
      - name: Check standalone supervisor crate
        working-directory: tools/phase1-process-supervisor
        run: |
          cargo fmt --all --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked -- -D warnings
      - name: Build and verify frozen Windows supervisor
        working-directory: tools/phase1-process-supervisor
        run: |
          SOURCE_DATE_EPOCH=0 cargo build \
            --target x86_64-pc-windows-gnu \
            --release \
            --locked
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, statSync } from 'node:fs';
          import { readPhase1ConformanceLock } from '../../scripts/phase1-conformance-lock.mjs';

          const supervisor = readPhase1ConformanceLock('../../phase1-conformance.lock.json').tools.windowsSupervisor;
          const artifact = supervisor.artifact;
          const source = supervisor.source;
          const blob = execFileSync('git', ['-C', '../..', 'rev-parse', `${source.revision}:${source.path}`], {
            encoding: 'utf8',
          }).trim();
          const sourceBytes = execFileSync('git', ['-C', '../..', 'show', `${source.revision}:${source.path}`]);
          if (
            blob !== source.blob ||
            createHash('sha256').update(sourceBytes).digest('hex') !== source.sha256
          ) {
            throw new Error('Windows supervisor source does not match the immutable lock.');
          }
          const path = `target/x86_64-pc-windows-gnu/release/${artifact.fileName}`;
          const bytes = readFileSync(path);
          const actualSize = statSync(path).size;
          const actualSha256 = createHash('sha256').update(bytes).digest('hex');
          console.log(`Windows supervisor artifact: sha256=${actualSha256} size=${actualSize}`);
          if (
            actualSize !== artifact.size ||
            actualSha256 !== artifact.sha256
          ) {
            throw new Error('Windows supervisor artifact does not match the immutable lock.');
          }
          EOF
      - name: Upload frozen Windows supervisor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-process-supervisor-win32-x64
          path: tools/phase1-process-supervisor/target/x86_64-pc-windows-gnu/release/phase1-process-supervisor.exe
          if-no-files-found: error
          retention-days: 1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: corepack pnpm cargo:check:windows-gnu
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features phase1-conformance --lib
      - run: corepack pnpm test:native-e2e

  windows-supervisor-behavior:
    name: Windows supervisor behavior
    runs-on: windows-latest
    needs: [changes, rust]
    if: always() && needs.rust.result == 'success' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase1-process-supervisor-win32-x64
          path: windows-supervisor-artifact
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Install and verify frozen supervisor
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'windows-supervisor-artifact\phase1-process-supervisor.exe'
          $destination = 'C:\OpenCoven\conformance\phase1-process-supervisor.exe'
          if ((Get-Item $source).Length -ne 333824) { throw 'unexpected supervisor size' }
          if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne '372b3e8b5b860e0759da8fa10ddfb6ec338e26d83616254c816a456ae2e1b7c5') {
            throw 'unexpected supervisor digest'
          }
          New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          if ((Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne '372b3e8b5b860e0759da8fa10ddfb6ec338e26d83616254c816a456ae2e1b7c5') {
            throw 'installed supervisor digest mismatch'
          }
          if ((Get-FileHash 'scripts/phase1-conformance-launcher.ps1' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '99eea6108e59db9a0ac12368787fb6e6456e6af4f8cce09ee96ce117ca3f475e') {
            throw 'Windows launcher digest mismatch'
          }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run real Windows supervisor behavior
        shell: pwsh
        env:
          OPENCOVEN_PHASE1_WINDOWS_SUPERVISOR_PATH: C:\OpenCoven\conformance\phase1-process-supervisor.exe
        run: corepack pnpm@10.34.0 --ignore-workspace exec vitest run --config vitest.heavy.config.ts src/phase1-windows-supervisor.test.ts
