name: CI

on:
  pull_request:
  push:

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  contract-canary:
    name: Contract canary
    runs-on: ubuntu-latest
    needs: web
    env:
      OPENCOVEN_SDK_REVIEWED_REVISION: ${{ vars.OPENCOVEN_SDK_REVIEWED_REVISION }}
      OPENCOVEN_CAVE_REVIEWED_REVISION: ${{ vars.OPENCOVEN_CAVE_REVIEWED_REVISION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate reviewed counterpart revisions
        run: |
          node --input-type=module <<'EOF'
          const revisions = [
            ['OPENCOVEN_SDK_REVIEWED_REVISION', process.env.OPENCOVEN_SDK_REVIEWED_REVISION],
            ['OPENCOVEN_CAVE_REVIEWED_REVISION', process.env.OPENCOVEN_CAVE_REVIEWED_REVISION],
          ];

          for (const [name, value] of revisions) {
            if (!/^[0-9a-f]{40}$/i.test(value ?? '')) {
              throw new Error(`${name} must be set to a reviewed immutable 40-character commit SHA.`);
            }
          }
          EOF
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: OpenCoven/sdk
          ref: ${{ env.OPENCOVEN_SDK_REVIEWED_REVISION }}
          path: .cross-repo/sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: OpenCoven/coven-cave
          ref: ${{ env.OPENCOVEN_CAVE_REVIEWED_REVISION }}
          path: .cross-repo/coven-cave
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install SDK dependencies
        working-directory: .cross-repo/sdk
        run: pnpm install --frozen-lockfile
      - name: Run contract canary
        run: pnpm test:contract-canary -- --sdk-root .cross-repo/sdk --cave-root .cross-repo/coven-cave

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm app:build

  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
