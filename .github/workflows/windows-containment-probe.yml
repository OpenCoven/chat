# Temporary: runs the Windows-only containment test on a Windows runner for
# the feat/windows-process-tree-containment branch. Removed before merge.
name: Windows containment probe
on:
  push:
    branches: [feat/windows-process-tree-containment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Windows cancel ends the whole process tree
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib windows_cancel_ends_the_whole_process_tree -- --nocapture
      - name: Full lib suite on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
