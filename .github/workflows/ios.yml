name: iPhone companion
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'src-tauri/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'src-tauri/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Native unit tests, pinned HTTPS UI flow and Release device build
        env:
          CHAT_IOS_DERIVED_DATA: ${{ runner.temp }}/chat-ios-derived
        run: apps/ios/ChatCompanion/Scripts/test-e2e.sh
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-test-results
          path: ${{ runner.temp }}/chat-ios-derived/Logs/Test/*.xcresult
