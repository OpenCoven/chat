name: Release

# Tag-triggered release pipeline with a manual dry-run path for existing tags.
# Pushing an annotated, signed `v*` tag is the production path; workflow_dispatch
# rehearses one with dry_run defaulting to true. Everything downstream refuses
# to run until the tag is proven signed and consistent with its committed tree.
#
# Third-party actions are pinned to a full commit SHA with a version comment,
# matching the convention in .github/workflows/ci.yml. The toolchain versions
# (Node 24.18.1 via .node-version, pnpm 10.34.0, Rust 1.95.0) are the same ones
# ci.yml pins, so a release builds with the toolchain that was tested.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing signed tag to build (for example v0.0.2)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify without creating a GitHub Release'
        required: false
        default: true
        type: boolean
      # The only way to get an unsigned build. Deliberately dispatch-only: the
      # `inputs` context is empty on a tag push, so the production path cannot
      # reach this switch no matter what anyone types.
      allow_unsigned:
        description: 'Continue when platform signing secrets are missing (produces UNSIGNED artifacts)'
        required: false
        default: false
        type: boolean

# Nothing here needs write access by default. The single job that publishes the
# release asks for `contents: write` explicitly; every other job is read-only.
permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate. The release does not build until the tag is proven to be an annotated,
  # signed tag whose version matches every manifest in the tree.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - id: resolve
        name: Resolve and verify the remote tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! printf '%s' "${tag}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag '${tag}' is not a v<major>.<minor>.<patch>[-prerelease] tag."
            exit 1
          fi

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          object_type="$(jq -r '.object.type' <<<"${ref_json}")"
          object_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          if [ "${object_type}" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag (${object_type}); a release requires an annotated, signed tag (git tag -s)."
            exit 1
          fi

          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
          if [ "$(jq -r '.verification.signature // empty' <<<"${tag_json}")" = "" ]; then
            echo "::error::${tag} is annotated but carries no GPG/SSH signature. Create it with 'git tag -s'."
            exit 1
          fi

          verified="$(jq -r '.verification.verified' <<<"${tag_json}")"
          reason="$(jq -r '.verification.reason' <<<"${tag_json}")"
          if [ "${verified}" != "true" ]; then
            echo "::error::GitHub could not verify the signature on ${tag} (reason: ${reason})."
            exit 1
          fi

          target_type="$(jq -r '.object.type' <<<"${tag_json}")"
          target_sha="$(jq -r '.object.sha' <<<"${tag_json}")"
          if [ "${target_type}" != "commit" ]; then
            echo "::error::${tag} points to ${target_type}, not directly to a commit."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${target_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${tag} moved after the workflow event; expected ${GITHUB_SHA}, found ${target_sha}."
            exit 1
          fi

          ancestry_status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${target_sha}...main" \
            --jq '.status')"
          case "${ancestry_status}" in
            ahead|identical) ;;
            *)
              echo "::error::${tag} points at ${target_sha}, which is not reachable from origin/main."
              exit 1
              ;;
          esac

          version="${tag#v}"
          case "${version}" in
            0.*|*-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          dry_run=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN}" = "true" ]; then
            dry_run=true
          fi
          # allow_unsigned exists to rehearse the pipeline before the
          # certificates do, and its artifacts must never reach users. Only
          # dry_run kept them from being published, so a dispatch with
          # allow_unsigned=true and dry_run=false would have published unsigned
          # installers. Refuse that pairing before anything is built.
          if [ "${INPUT_ALLOW_UNSIGNED:-}" = "true" ] && [ "${dry_run}" = "false" ]; then
            echo "::error::allow_unsigned=true is for rehearsals only: dispatch it with dry_run=true. An allow_unsigned run never publishes a release."
            exit 1
          fi
          if [ "${dry_run}" = "false" ] &&
             gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for ${tag}; refuse to replace published assets."
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "sha=${target_sha}"
            echo "prerelease=${prerelease}"
            echo "dry_run=${dry_run}"
          } >> "$GITHUB_OUTPUT"

          echo "Verified remote tag ${tag} at ${target_sha} (prerelease=${prerelease}, dry_run=${dry_run})."

      # An unsigned release is not a release. macOS refuses to open an unsigned,
      # un-notarized .app without a Gatekeeper override, and Windows SmartScreen
      # flags the installer. Neither is a thing to find out after the tag is
      # pushed: `verify-tag` refuses to replace an existing Release, so the
      # version is spent and the fix is a new one.
      #
      # This used to be a `::warning::` inside the build job, which meant the
      # default outcome of a missing secret was a published, unsigned release
      # and a yellow annotation nobody reads. Absence is now refused here --
      # before the tag is checked out and long before four platform builds start
      # -- so the cost of a missing secret is seconds, not ninety minutes a
      # runner and a burnt version number.
      #
      # TAURI_SIGNING_PRIVATE_KEY is not in this list because it is required
      # only for a tree that configures the updater, which this step cannot
      # see yet: the tag is not checked out. `Require updater signing` below
      # reads the verified commit's config and refuses there instead.
      #
      # WINDOWS_CERTIFICATE and its password are absent too, by decision rather
      # than omission: Windows ships unsigned (decided 2026-10-14; #411 tracks
      # a signing route, since certificate authorities no longer issue the
      # exportable .pfx this path expects). The build job signs the Windows
      # installers whenever both secrets are present and says plainly when
      # they are not. The eSigner route was chosen on 2026-10-18; add its four
      # ES_* secrets to this list once the account exists, so a missing one
      # refuses the release instead of shipping unsigned.
      - name: Require signing material
        shell: bash
        env:
          # Empty on a tag push: the `inputs` context does not exist for that
          # event, so this cannot be set from the production path.
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          # Names only. The values are masked, and a missing secret is
          # identified perfectly well by what it is called.
          missing=()
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          # Notarization takes either an App Store Connect API key (preferred)
          # or an Apple ID with an app-specific password. One complete set is
          # enough; a half-set of either counts as missing.
          if ! { [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_BASE64:-}" ]; } &&
             ! { [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ]; }; then
            missing+=("notarization credentials (APPLE_API_ISSUER+APPLE_API_KEY+APPLE_API_KEY_BASE64, or APPLE_ID+APPLE_PASSWORD)")
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All platform signing secrets are present; this release will be signed and notarized."
            exit 0
          fi

          if [ "${ALLOW_UNSIGNED:-}" = "true" ]; then
            echo "::warning::allow_unsigned was requested. Missing: ${missing[*]}. Every artifact from this run is UNSIGNED and must not be handed to users."
            exit 0
          fi

          echo "::error::Missing signing secrets in the release-signing environment: ${missing[*]}"
          echo "Configure them under Settings -> Environments -> release-signing (docs/releasing.md § 3)."
          echo "To build deliberately unsigned artifacts, dispatch this workflow with allow_unsigned=true."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          # The tag object and its signature are needed, not just the commit it
          # points at, so the full history and all tags are fetched.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The package's declared contract (names, window bounds, strict CSP,
      # installer targets and icons, the capability allowlist, no shell or
      # filesystem plugins) and the first release's decisions on issue #356 (no
      # updater, no deep-link protocol) are enforced before any build.
      - name: Verify the package contract
        run: node scripts/verify-package.mjs

      - id: check
        name: Verify tag is annotated, signed, and version-consistent
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          # Optional allowed-signers file (SSH tag signing) supplied as a
          # secret. GitHub's API verification above is authoritative; when this
          # is present, git independently verifies an SSH signature too.
          TAG_ALLOWED_SIGNERS: ${{ secrets.TAG_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail

          echo "Tag under release: ${TAG}"

          # Re-check the fetched object rather than trusting only the API result.
          object_type=$(git cat-file -t "${TAG}")
          if [ "${object_type}" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag (${object_type}); a release requires an annotated, signed tag (git tag -s)."
            exit 1
          fi

          raw=$(git cat-file tag "${TAG}")
          if ! printf '%s\n' "${raw}" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "::error::${TAG} is annotated but carries no GPG/SSH signature. Create it with 'git tag -s'."
            exit 1
          fi

          checked_sha="$(git rev-parse "${TAG}^{commit}")"
          if [ "${checked_sha}" != "${EXPECTED_SHA}" ] || [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
            echo "::error::The checked-out tag does not resolve to the API-verified commit ${EXPECTED_SHA}."
            exit 1
          fi

          if printf '%s\n' "${raw}" | grep -q 'BEGIN SSH SIGNATURE'; then
            if [ -n "${TAG_ALLOWED_SIGNERS:-}" ]; then
              printf '%s\n' "${TAG_ALLOWED_SIGNERS}" > "${RUNNER_TEMP}/allowed_signers"
              git config gpg.ssh.allowedSignersFile "${RUNNER_TEMP}/allowed_signers"
              if ! git verify-tag --verbose "${TAG}"; then
                echo "::error::Local SSH verification disagrees with GitHub for ${TAG}; the release is blocked."
                exit 1
              fi
              echo "Local SSH verification agrees with GitHub."
            else
              echo "::notice::TAG_ALLOWED_SIGNERS is not configured; relying on GitHub's successful SSH tag verification."
            fi
          else
            echo "::notice::GitHub verified the GPG tag signature; no trusted GPG keyring is configured for an independent local check."
          fi

          tag_version="${TAG#v}"
          echo "Tag version: ${tag_version}"

          pkg_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(awk '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"/, "")
              gsub(/".*$/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)

          echo "package.json:        ${pkg_version}"
          echo "tauri.conf.json:     ${conf_version}"
          echo "src-tauri/Cargo.toml: ${cargo_version}"

          fail=0
          for pair in "package.json:${pkg_version}" "tauri.conf.json:${conf_version}" "Cargo.toml:${cargo_version}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "${value}" != "${tag_version}" ]; then
              echo "::error::${name} version ${value} does not match tag version ${tag_version}."
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "All manifest versions match the tag."

          bundle_active=$(node -p "String(require('./src-tauri/tauri.conf.json').bundle?.active === true)")
          if [ "${bundle_active}" != "true" ]; then
            echo "::error::src-tauri/tauri.conf.json has bundle.active != true; a release build would produce no installers."
            exit 1
          fi
          echo "Bundling is enabled."

          {
            echo "version=${tag_version}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # A tree that configures the updater (`plugins.updater`, decided on #356
      # on 2026-10-18) publishes signed updater artifacts and moves the
      # auto-update feed, so its release needs the updater signing key and its
      # password: a release without them would strand every installed copy on
      # the old version. The config is read from the verified commit, so a
      # dispatch from main against an older tag (v0.0.5 and before, which have
      # no updater) behaves exactly as it always did.
      - name: Require updater signing when the tree configures the updater
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=$(git show "${EXPECTED_SHA}:src-tauri/tauri.conf.json" | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk));
            process.stdin.on("end", () => {
              process.stdout.write(JSON.parse(text).plugins?.updater ? "true" : "false");
            });')
          if [ "${configured}" != "true" ]; then
            echo "This tree configures no updater (no plugins.updater); the release carries no updater artifacts."
            exit 0
          fi
          missing=()
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "The tree configures the updater and its signing key is present."
            exit 0
          fi
          if [ "${ALLOW_UNSIGNED:-}" = "true" ]; then
            echo "::warning::allow_unsigned was requested. Missing: ${missing[*]}. This rehearsal builds no updater artifacts."
            exit 0
          fi
          echo "::error::This tree configures the updater, but release-signing is missing ${missing[*]}. Add them (docs/releasing.md § 4), or dispatch a rehearsal with allow_unsigned=true and dry_run=true."
          exit 1

      # The pull-request run tested a temporary merge commit. Re-run the
      # release-relevant checks against the exact, API-verified tagged tree.
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:unit:normal
      - run: corepack pnpm build

  # ---------------------------------------------------------------------------
  # Build real installers on each platform, sign them when the signing secrets
  # are present, and smoke-test every artifact on the native OS before it is
  # allowed to leave the job.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # The signing secrets live in a protected deployment environment. Consuming
    # them here (Apple, Windows, and Tauri updater signing) ties every signed
    # build to that environment's protection rules.
    environment: release-signing
    permissions:
      contents: read
    outputs:
      # The same two secrets are read on every runner, so every matrix job
      # writes the same value here. The publish job reads it to describe the
      # Windows installers' signing state in the smoke report and the notes.
      windows_signed: ${{ steps.signing.outputs.windows_signed }}
      # `on` when the tagged tree configures the updater and its signing key
      # is present, so this run's installers carry updater signatures; the
      # publish job writes latest.json and moves the feed only then.
      updater: ${{ steps.signing.outputs.updater }}
    env:
      # Installers are staged here, NOT in `dist/`. `dist/` is Vite's build
      # output (tauri.conf.json: beforeBuildCommand `pnpm build`, frontendDist
      # `../dist`), so by the time bundling finishes it already holds
      # index.html and assets/. Staging on top of that made the artifact
      # validation below reject the frontend's 399-byte index.html against the
      # 1 MiB floor, and would have uploaded the web assets as release assets.
      STAGE_DIR: release-staging
    strategy:
      # One platform failing should not cancel the others; a partial matrix is
      # still useful diagnostic output, and the publish job depends on all of
      # them succeeding anyway.
      fail-fast: false
      matrix:
        include:
          # `bundles` lists installer targets only. Tauri v2 has no `updater`
          # bundle target. With createUpdaterArtifacts turned on by the
          # release-only overlay (`Configure updater artifacts`), Tauri signs
          # the .msi, -setup.exe, .AppImage and .deb themselves and archives
          # only the macOS app (.app.tar.gz), each with a .sig beside it.
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          # Windows ships UNSIGNED, by decision (2026-10-14): certificate
          # authorities no longer issue the exportable .pfx that the signing
          # steps below expect, and a signing route is still being chosen on
          # #411. SmartScreen warns on first launch, and the release notes say
          # so. The signing steps stay in place and run as soon as both
          # WINDOWS_* secrets exist. windows-2025 is pinned by name, like
          # ubuntu-22.04, so a runner-image rollover cannot change what a tag
          # builds with.
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      # Tauri's Linux build needs the GTK and WebKit development headers. This
      # list is transcribed from .github/ci-image/Dockerfile (which bakes the
      # same packages into the CI image) so a release links against the same
      # libraries CI tested. libfuse2 is added on top because AppImage bundling
      # needs FUSE at build time, which the CI image did not exercise.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - run: corepack pnpm install --frozen-lockfile

      # Whether this build will be signed is decided entirely by which secrets
      # are present. The result is surfaced so the artifacts and the job log say
      # plainly when a build is unsigned.
      #
      # `verify-tag` refuses a production run with a signing secret missing,
      # but that gate runs once per workflow run. Re-running failed jobs skips
      # it and re-reads the secrets here, so a secret emptied between the gate
      # and the build reaches this step unchecked. On 2026-10-07 an empty
      # APPLE_ID did exactly that on a re-run of v0.0.2: this step warned,
      # built unsigned, and the release published (#356). The unsigned branch
      # is therefore a refusal here too, unless the run was dispatched with
      # allow_unsigned, which is empty on a tag push.
      - id: signing
        name: Determine signing availability
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          macos_signed=false
          windows_signed=false
          windows_route=none
          updater=off
          # "Signed" must mean every credential the signing path consumes, not
          # just the certificate. The verify-tag gate demands all eight on the
          # production path, but allow_unsigned bypasses that gate -- and a
          # partial set there used to report signed=true, skip the unsets in
          # `Build installers`, and fail the bundle with the very error the
          # unsigned rehearsal exists to avoid.
          notary=none
          if [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            notary=api-key
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ]; then
            notary=apple-id
          fi
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] &&
             [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] &&
             [ "${notary}" != "none" ]; then
            macos_signed=true
          fi
          echo "notary=${notary}" >> "$GITHUB_OUTPUT"
          echo "macOS notarization credentials: ${notary}"
          # Windows signs one of two ways (#411). Val chose SSL.com eSigner on
          # 2026-10-18: the certificate's key stays in SSL.com's cloud HSM, and
          # Tauri runs a CodeSignTool wrapper on every file it signs (see
          # `Install SSL.com CodeSignTool`). The four ES_* secrets choose it.
          # A .pfx in WINDOWS_CERTIFICATE with its password, imported into the
          # runner's store, stays for a certificate that can be exported.
          # Either way `Verify Windows installer metadata and signatures`
          # requires a valid signature from WINDOWS_PUBLISHER.
          es_set=0
          for name in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            if [ -n "${!name:-}" ]; then es_set=$((es_set + 1)); fi
          done
          if [ -n "${WINDOWS_CERTIFICATE:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            windows_route=pfx
          fi
          if [ "${es_set}" -eq 4 ]; then
            if [ "${windows_route}" = "pfx" ] && [ "${{ runner.os }}" = "Windows" ]; then
              echo "::error::Both a .pfx (WINDOWS_CERTIFICATE) and the eSigner secrets (ES_*) are configured. Keep the ones for the signing route in use and remove the others."
              exit 1
            fi
            windows_route=esigner
          fi
          [ "${windows_route}" != "none" ] && windows_signed=true
          # The updater is on when the tagged tree configures it
          # (plugins.updater) and both updater secrets are present. A tree that
          # configures it without them is refused on the production path, as
          # verify-tag does, because re-runs skip that gate.
          updater_configured=$(node -p "Boolean(require('./src-tauri/tauri.conf.json').plugins?.updater)")
          if [ "${updater_configured}" = "true" ]; then
            if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
              updater=on
            elif [ "${ALLOW_UNSIGNED:-false}" != "true" ]; then
              echo "::error::This tree configures the updater, but TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty in release-signing; refusing to build a release that cannot update anyone."
              exit 1
            else
              echo "::warning::The updater signing key is absent; this allow_unsigned rehearsal builds no updater artifacts."
            fi
          fi
          echo "macos_signed=${macos_signed}"     >> "$GITHUB_OUTPUT"
          echo "windows_signed=${windows_signed}" >> "$GITHUB_OUTPUT"
          echo "windows_route=${windows_route}"   >> "$GITHUB_OUTPUT"
          echo "updater=${updater}"               >> "$GITHUB_OUTPUT"
          if [ "${{ runner.os }}" = "macOS" ] && [ "${macos_signed}" = "false" ]; then
            if [ "${ALLOW_UNSIGNED:-false}" != "true" ]; then
              echo "::error::Apple signing material is absent or incomplete on the production path; refusing to build unsigned. Check every APPLE_* secret in release-signing for an empty value, then re-run."
              exit 1
            fi
            echo "::warning::Apple signing material is absent or incomplete; producing an UNSIGNED, un-notarized macOS build. This is only reachable via allow_unsigned; do not publish these artifacts."
          fi
          # Windows is the one platform that may build unsigned on the
          # production path (decided 2026-10-14; see the matrix comment and
          # #411). A half-set of either route's secrets is still refused there:
          # that is not a decision, it is a typo.
          if [ "${{ runner.os }}" = "Windows" ] && [ "${es_set}" -gt 0 ] && [ "${es_set}" -lt 4 ] &&
             [ "${ALLOW_UNSIGNED:-false}" != "true" ]; then
            echo "::error::Only ${es_set} of the four eSigner secrets (ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET) are set. Set all four to sign through eSigner, or none to build unsigned."
            exit 1
          fi
          if [ "${{ runner.os }}" = "Windows" ] && [ "${windows_signed}" = "false" ]; then
            if { [ -n "${WINDOWS_CERTIFICATE:-}" ] || [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; } &&
               [ "${ALLOW_UNSIGNED:-false}" != "true" ]; then
              echo "::error::Only one of WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD is set. Set both to sign the Windows installers, or neither to build them unsigned."
              exit 1
            fi
            echo "::warning::Neither the eSigner secrets nor WINDOWS_CERTIFICATE are configured; the Windows installers in this release are UNSIGNED and Windows SmartScreen will warn before they run. #411 tracks a signing route."
          fi
          if [ "${updater_configured}" != "true" ]; then
            echo "::notice::This tree configures no updater (no plugins.updater); no updater artifacts or latest.json are produced. See docs/releasing.md § 4."
          fi

      # Import Windows signing material before bundling so Tauri signs the
      # installers that are placed inside any future updater archive.
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.windows_route == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $securePass `
              -Exportable:$false
          )
          Remove-Item $pfxPath -Force

          $cert = $imported | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $cert) {
            throw 'The configured Windows certificate did not contain an importable private key.'
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # eSigner (#411): CodeSignTool is SSL.com's signing client. Its generic
      # build is pinned by version and SHA-256 and runs on the runner's Java
      # 21; SSL.com's Windows build only adds a bundled JDK. The wrapper Tauri
      # calls is written here, not kept in the repository, so a dispatch
      # against an older tag signs the same way.
      - name: Install SSL.com CodeSignTool
        if: runner.os == 'Windows' && steps.signing.outputs.windows_route == 'esigner'
        shell: pwsh
        env:
          CODESIGNTOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip
          CODESIGNTOOL_SHA256: f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not $env:JAVA_HOME_21_X64) {
            throw 'This runner image has no Java 21 (JAVA_HOME_21_X64), which CodeSignTool needs.'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool.zip'
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CODESIGNTOOL_SHA256) {
            throw "The CodeSignTool download has SHA-256 $hash, expected $env:CODESIGNTOOL_SHA256."
          }
          $tool = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          Expand-Archive -Path $zip -DestinationPath $tool -Force
          Remove-Item $zip -Force
          if (-not (Test-Path (Join-Path $tool 'jar\code_sign_tool-1.3.2.jar'))) {
            throw 'The CodeSignTool archive has no jar\code_sign_tool-1.3.2.jar.'
          }
          $wrapper = Join-Path $env:RUNNER_TEMP 'esigner-sign.ps1'
          @'
          param([Parameter(Mandatory = $true)][string] $File)
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:JAVA_HOME_21_X64 'bin\java.exe'
          $jar = Join-Path $env:CODE_SIGN_TOOL_PATH 'jar\code_sign_tool-1.3.2.jar'
          # CodeSignTool reads conf\code_sign_tool.properties from its own folder.
          Push-Location $env:CODE_SIGN_TOOL_PATH
          try {
            $output = & $java -jar $jar sign "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" `
              "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" `
              "-input_file_path=$File" '-override=true' 2>&1 | Out-String
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Write-Host $output
          # CodeSignTool can exit 0 after a failure, so its output is checked
          # too, the way SSL.com's own esigner-codesign action does.
          if ($code -ne 0 -or $output -match 'Error|Exception|Missing required option|Unmatched argument') {
            throw "CodeSignTool could not sign $File."
          }
          '@ | Set-Content -Path $wrapper -Encoding utf8
          "CODE_SIGN_TOOL_PATH=$tool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ESIGNER_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Tauri Windows signing
        if: runner.os == 'Windows' && steps.signing.outputs.windows_signed == 'true'
        shell: bash
        env:
          WINDOWS_ROUTE: ${{ steps.signing.outputs.windows_route }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          // eSigner signs, digests and timestamps through the wrapper; the
          // object form keeps a path with spaces in one argument. The .pfx
          // path tells signtool which certificate in the store to use.
          const windows =
            process.env.WINDOWS_ROUTE === 'esigner'
              ? {
                  signCommand: {
                    cmd: 'pwsh',
                    args: ['-NoProfile', '-NonInteractive', '-File', process.env.ESIGNER_WRAPPER, '%1'],
                  },
                }
              : {
                  certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
                  digestAlgorithm: 'sha256',
                  timestampUrl: 'https://timestamp.digicert.com',
                };
          const overlay = { bundle: { windows } };
          fs.writeFileSync(
            'src-tauri/release-signing.conf.json',
            `${JSON.stringify(overlay, null, 2)}\n`,
          );
          EOF
          echo "TAURI_CONFIG_OVERLAY=src-tauri/release-signing.conf.json" >> "$GITHUB_ENV"

      # The base config keeps createUpdaterArtifacts false, because Tauri then
      # requires TAURI_SIGNING_PRIVATE_KEY for every build (CI's desktop build
      # and local `app:build` have none). A release with the updater on turns
      # it on here, in an overlay merged after the base and any signing
      # overlay (tauri-cli merges repeated --config values in order).
      - name: Configure updater artifacts
        if: steps.signing.outputs.updater == 'on'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{ "bundle": { "createUpdaterArtifacts": true } }' > src-tauri/release-updater.conf.json
          echo "TAURI_UPDATER_OVERLAY=src-tauri/release-updater.conf.json" >> "$GITHUB_ENV"

      # Apple signing variables are consumed directly by Tauri, and so are the
      # updater signing key and password: with the updater overlay applied,
      # Tauri signs each updater artifact as it bundles.
      - name: Build installers
        shell: bash
        env:
          MACOS_SIGNED: ${{ steps.signing.outputs.macos_signed }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          NOTARY: ${{ steps.signing.outputs.notary }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri runs the eSigner wrapper inside `tauri build`, so its
          # credentials are passed here (#411). They are empty, and unused, on
          # the .pfx route and on unsigned builds.
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail

          # Tauri picks the Apple ID whenever APPLE_ID, APPLE_PASSWORD and
          # APPLE_TEAM_ID are all set, so with an API key the Apple ID pair is
          # unset here and the key is written to the runner for this build
          # only; a later step removes it.
          if [ "${RUNNER_OS}" = "macOS" ] && [ "${NOTARY}" = "api-key" ]; then
            umask 077
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${key_path}"
            export APPLE_API_KEY_PATH="${key_path}"
            unset APPLE_ID APPLE_PASSWORD
            echo "Notarizing with App Store Connect API key ${APPLE_API_KEY}."
          else
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64
          fi

          # A missing secret arrives as the empty string, not as an unset
          # variable, and Tauri reads a *defined* APPLE_CERTIFICATE as "sign
          # this". It then runs `security import` with an empty -P password and
          # dies with SecKeychainItemImport. Unset them so an allow_unsigned
          # run produces the unsigned macOS build it advertises instead of
          # failing the bundle outright.
          if [ "${RUNNER_OS}" = "macOS" ] && [ "${MACOS_SIGNED}" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi

          args=(
            --target "${{ matrix.target }}"
            --bundles "${{ matrix.bundles }}"
            --verbose
          )
          for overlay in "${TAURI_CONFIG_OVERLAY:-}" "${TAURI_UPDATER_OVERLAY:-}"; do
            if [ -n "${overlay}" ]; then
              args+=(--config "${overlay}")
            fi
          done
          corepack pnpm exec tauri build "${args[@]}"

      # Tauri notarizes and staples the .app, then builds the .dmg around it
      # and stops, so the image itself shipped un-notarized through v0.0.3
      # (#407). Gatekeeper still accepts the app inside, but Apple's guidance is
      # to notarize the outermost container, and a stapled image validates
      # offline. Submit each image with the credentials the build used, staple
      # the ticket, and check it before anything is staged.
      - name: Notarize and staple the disk images
        if: runner.os == 'macOS' && steps.signing.outputs.macos_signed == 'true'
        shell: bash
        env:
          NOTARY: ${{ steps.signing.outputs.notary }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # Apple's ticket service (api.apple-cloudkit.com) dropped the
          # connection mid-request three times on macos-15-intel on 2026-10-14
          # (#461): once here, twice in the smoke test, each after the ticket
          # had been issued and the image stapled. stapler exits 68 for that
          # as well as for a missing ticket, so each call gets a few attempts
          # with a pause between. A real rejection fails all of them.
          stapler_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler "$@"; then return 0; fi
              echo "stapler $1 failed (attempt ${attempt} of 5); retrying in 20s..."
              sleep 20
            done
            echo "::error::stapler $* failed on every attempt."
            return 1
          }
          # Same key file `Build installers` wrote; the next step removes it.
          case "${NOTARY}" in
            api-key)
              credentials=(--key "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
                           --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}") ;;
            apple-id)
              credentials=(--apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}"
                           --team-id "${APPLE_TEAM_ID}") ;;
            *)
              echo "::error::A signed macOS build has no notarization credentials (notary=${NOTARY})."
              exit 1 ;;
          esac
          shopt -s nullglob
          found=0
          for dmg in "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"/*.dmg; do
            found=1
            echo "Notarizing ${dmg}..."
            result="${RUNNER_TEMP}/notary-result.json"
            # The verdict is read from the result, not inferred from the exit
            # status, and a rejection prints Apple's log before failing.
            submitted=0
            xcrun notarytool submit "${dmg}" "${credentials[@]}" \
              --wait --timeout 30m --output-format json > "${result}" || submitted=$?
            status=$(plutil -extract status raw -o - "${result}" 2>/dev/null || echo unknown)
            if [ "${status}" != "Accepted" ]; then
              echo "::error::Notarization of ${dmg} ended with status ${status} (notarytool exit ${submitted})."
              cat "${result}" || true
              id=$(plutil -extract id raw -o - "${result}" 2>/dev/null || true)
              if [ -n "${id}" ]; then xcrun notarytool log "${id}" "${credentials[@]}" || true; fi
              exit 1
            fi
            stapler_retry staple "${dmg}"
            stapler_retry validate "${dmg}"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
          done
          [ "${found}" -eq 1 ] || { echo "::error::No .dmg was produced to notarize."; exit 1; }

      - name: Remove the notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "${RUNNER_TEMP}"/AuthKey_*.p8

      - name: Remove Windows signing overlay
        if: always() && runner.os == 'Windows'
        shell: bash
        run: rm -rf src-tauri/release-signing.conf.json "${RUNNER_TEMP}/CodeSignTool" "${RUNNER_TEMP}/esigner-sign.ps1"

      - name: Remove updater overlay
        if: always()
        shell: bash
        run: rm -f src-tauri/release-updater.conf.json

      # Collect the produced installers into a flat, predictably named staging
      # directory and fail loudly if a platform produced nothing.
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p "${STAGE_DIR}"
          # macOS runners ship bash 3.2, which has no `globstar` -- enabling it
          # aborts the step under `set -e`. Nothing here globs with `**`, so
          # `nullglob` alone is what these single-level patterns actually need.
          shopt -s nullglob
          copied=0
          for f in \
            "${bundle_root}"/dmg/*.dmg \
            "${bundle_root}"/macos/*.app.tar.gz \
            "${bundle_root}"/macos/*.app.tar.gz.sig \
            "${bundle_root}"/msi/*.msi \
            "${bundle_root}"/msi/*.msi.sig \
            "${bundle_root}"/nsis/*.exe \
            "${bundle_root}"/nsis/*.exe.sig \
            "${bundle_root}"/appimage/*.AppImage \
            "${bundle_root}"/appimage/*.AppImage.sig \
            "${bundle_root}"/deb/*.deb \
            "${bundle_root}"/deb/*.deb.sig ; do
            [ -e "${f}" ] || continue
            cp -v "${f}" "${STAGE_DIR}/"
            copied=$((copied + 1))
          done
          if [ "${copied}" -eq 0 ]; then
            echo "::error::No installers were produced for ${{ matrix.platform }} under ${bundle_root}."
            exit 1
          fi
          # The macOS updater archive (.app.tar.gz) and its .sig are named after
          # the product only -- no arch -- so the aarch64 and x86_64 builds emit
          # the same filename and would clobber each other when both platforms'
          # artifacts are merged for publishing. Prefix them with the target so
          # they stay distinct and so latest.json can tell the two apart.
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            for g in "${STAGE_DIR}"/*.app.tar.gz "${STAGE_DIR}"/*.app.tar.gz.sig; do
              [ -e "${g}" ] || continue
              mv "${g}" "${STAGE_DIR}/${{ matrix.target }}-$(basename "${g}")"
            done
          fi
          # The .app itself is a directory; tar it so it survives artifact upload
          # and can have its structure verified by the release smoke test.
          for app in "${bundle_root}"/macos/*.app; do
            [ -e "${app}" ] || continue
            base=$(basename "${app}")
            tar -czf "${STAGE_DIR}/${base%.app}-${{ matrix.target }}.app.tar" -C "$(dirname "${app}")" "${base}"
          done

          # Signatures are intentionally small; every actual bundle or updater
          # archive must clear a floor that catches truncated bundler output.
          minimum_size=$((1024 * 1024))
          for artifact in "${STAGE_DIR}"/*; do
            [ -f "${artifact}" ] || continue
            case "${artifact}" in
              *.sig) continue ;;
            esac
            size=$(wc -c < "${artifact}" | tr -d ' ')
            if [ "${size}" -lt "${minimum_size}" ]; then
              echo "::error::${artifact} is only ${size} bytes; release artifacts must be at least 1 MiB."
              exit 1
            fi
          done

          echo "Staged $(ls -1 "${STAGE_DIR}" | wc -l | tr -d ' ') files:"
          ls -la "${STAGE_DIR}"

      # Native-OS smoke test. This runs on the platform that produced the
      # artifacts because the checks it performs (the .app structure, codesign,
      # spctl) only exist there. It fails if a file is missing, empty, or has
      # the wrong extension for its platform.
      - name: Smoke-test artifacts
        shell: bash
        env:
          MACOS_SIGNED: ${{ steps.signing.outputs.macos_signed }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          EXPECTED_VERSION: ${{ needs.verify-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Apple's ticket service (api.apple-cloudkit.com) dropped the
          # connection mid-request three times on macos-15-intel on 2026-10-14
          # (#461): once here, twice in the smoke test, each after the ticket
          # had been issued and the image stapled. stapler exits 68 for that
          # as well as for a missing ticket, so each call gets a few attempts
          # with a pause between. A real rejection fails all of them.
          stapler_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler "$@"; then return 0; fi
              echo "stapler $1 failed (attempt ${attempt} of 5); retrying in 20s..."
              sleep 20
            done
            echo "::error::stapler $* failed on every attempt."
            return 1
          }
          cd "${STAGE_DIR}"

          assert_nonempty() {
            if [ ! -s "$1" ]; then
              echo "::error::Artifact $1 is missing or empty."
              exit 1
            fi
            echo "  ok: $1 ($(wc -c < "$1" | tr -d ' ') bytes)"
          }

          case "${{ matrix.platform }}" in
            macos-*)
              found=0
              for dmg in *.dmg; do [ -e "$dmg" ] || continue; assert_nonempty "$dmg"; found=1; done
              [ "$found" -eq 1 ] || { echo "::error::No .dmg produced."; exit 1; }
              # Verify the .app structure from the staged tar.
              apptar=$(ls -1 *.app.tar 2>/dev/null | head -n1 || true)
              [ -n "${apptar}" ] || { echo "::error::No staged .app tar produced."; exit 1; }
              if [ -n "${apptar}" ]; then
                work="${RUNNER_TEMP}/release-app-smoke-${TARGET}"
                rm -rf "${work}"
                mkdir -p "${work}"
                tar -xf "${apptar}" -C "${work}"
                app=$(find "${work}" -maxdepth 1 -name '*.app' | head -n1)
                [ -n "${app}" ] || { echo "::error::Staged .app tar had no .app inside."; exit 1; }
                [ -d "${app}/Contents/MacOS" ] || { echo "::error::${app} is missing Contents/MacOS."; exit 1; }
                plist="${app}/Contents/Info.plist"
                [ -f "${plist}" ] || { echo "::error::${app} is missing Contents/Info.plist."; exit 1; }

                bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")
                bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")
                executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")
                [ "${bundle_version}" = "${EXPECTED_VERSION}" ] || {
                  echo "::error::${app} reports version ${bundle_version}, expected ${EXPECTED_VERSION}."
                  exit 1
                }
                [ "${bundle_id}" = "ai.opencoven.chat" ] || {
                  echo "::error::${app} reports bundle identifier ${bundle_id}, expected ai.opencoven.chat."
                  exit 1
                }

                binary="${app}/Contents/MacOS/${executable}"
                case "${TARGET}" in
                  aarch64-apple-darwin) expected_arch=arm64 ;;
                  x86_64-apple-darwin) expected_arch=x86_64 ;;
                  *) echo "::error::Unexpected macOS target ${TARGET}."; exit 1 ;;
                esac
                archs=$(lipo -archs "${binary}")
                if ! tr ' ' '\n' <<<"${archs}" | grep -Fxq "${expected_arch}"; then
                  echo "::error::${binary} has architectures '${archs}', expected ${expected_arch} for ${TARGET}."
                  exit 1
                fi
                echo "  ok: .app ${bundle_id} ${bundle_version}, architecture ${expected_arch}"

                # The skip below is for allow_unsigned rehearsals only. On the
                # production path the signature is checked whatever the
                # signing step reported, so an unsigned .app can never be
                # staged for publication.
                if [ "${MACOS_SIGNED}" = "true" ] || [ "${ALLOW_UNSIGNED:-false}" != "true" ]; then
                  echo "  verifying code signature..."
                  codesign --verify --deep --strict --verbose=2 "${app}"
                  spctl --assess --type execute --verbose=2 "${app}" || {
                    echo "::error::spctl assessment failed for ${app}."; exit 1; }
                  # The image is what people download, so its own ticket is
                  # checked too, not only the app's (#407).
                  for dmg in *.dmg; do
                    stapler_retry validate "${dmg}" || {
                      echo "::error::${dmg} has no stapled notarization ticket, or Apple's ticket service could not be reached (#461)."; exit 1; }
                    spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}" || {
                      echo "::error::spctl assessment failed for ${dmg}."; exit 1; }
                  done
                else
                  echo "  (unsigned rehearsal build: skipping codesign/spctl)"
                fi
                rm -rf "${work}"
              fi
              ;;
            windows-*)
              found=0
              for inst in *.msi *.exe; do [ -e "$inst" ] || continue; assert_nonempty "$inst"; found=1; done
              [ "$found" -eq 1 ] || { echo "::error::No .msi or .exe produced."; exit 1; }
              ;;
            linux-*)
              for ext in AppImage deb; do
                found=0
                for f in *."$ext"; do [ -e "$f" ] || continue; assert_nonempty "$f"; found=1; done
                [ "$found" -eq 1 ] || { echo "::error::No .$ext produced."; exit 1; }
              done
              for deb in *.deb; do
                [ -e "${deb}" ] || continue
                package_version=$(dpkg-deb --field "${deb}" Version)
                [ "${package_version}" = "${EXPECTED_VERSION}" ] || {
                  echo "::error::${deb} reports version ${package_version}, expected ${EXPECTED_VERSION}."
                  exit 1
                }
                # The previous awk form could never pass: inside an awk regex
                # literal the unescaped `/` in `[^/[:space:]]` terminates the
                # literal early, so awk aborted on a syntax error and the `!`
                # turned that into "no payload" for every .deb ever built.
                # Nothing reached this assertion until staging was fixed, so it
                # went unnoticed. grep needs no such escaping. Requiring a
                # character after `usr/bin/` keeps the bare directory entry from
                # satisfying it, and the product name may contain a space, so
                # only the first path component is matched on. The `./` prefix
                # is optional: dpkg-deb on the ubuntu-22.04 runner lists
                # `usr/bin/opencoven-chat` with no leading `./`, and assuming
                # the dotted form is what made the previous two versions of
                # this check reject a perfectly good package. The leading
                # `^-...x` requires a regular file with the owner execute bit,
                # so the assertion proves what its message claims: a
                # non-executable file or a symlink under usr/bin no longer
                # satisfies it.
                deb_contents=$(dpkg-deb --contents "${deb}")
                if ! printf '%s\n' "${deb_contents}" |
                  grep -qE '^-[rwxsStT-]{2}x.*[[:space:]](\./)?usr/bin/[^[:space:]]'; then
                  echo "::error::${deb} contains no executable payload under /usr/bin."
                  printf '%s\n' "${deb_contents}"
                  exit 1
                fi
                echo "  ok: ${deb} version and /usr/bin payload"
              done
              ;;
          esac
          echo "Smoke test passed for ${{ matrix.platform }}."

      # The bash smoke test above only proves the installers exist. What
      # Windows shows people -- the version under Apps & features and the
      # product name in the installer's properties -- is read back here, and
      # the Authenticode state is held to what the signing step decided: a
      # signed run requires a valid signature on every installer, an unsigned
      # run states NotSigned in the log rather than implying anything else.
      - name: Verify Windows installer metadata and signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.verify-tag.outputs.version }}
          WINDOWS_SIGNED: ${{ steps.signing.outputs.windows_signed }}
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # A signed release says who signed it: the certificate's common name,
          # which is what the installer shows as its publisher.
          if ($env:WINDOWS_SIGNED -eq 'true' -and -not $env:WINDOWS_PUBLISHER) {
            throw 'The Windows installers are signed, but WINDOWS_PUBLISHER is not set. Set it in release-signing to the publisher name the certificate carries.'
          }
          $installers = @(Get-ChildItem -Path "$env:STAGE_DIR/*" -File -Include *.msi,*.exe)
          if ($installers.Count -ne 2) {
            throw "Expected one .msi and one .exe in $env:STAGE_DIR, found $($installers.Count): $($installers.Name -join ', ')"
          }

          # The Property table is what msiexec and Apps & features read.
          function Get-MsiProperty([string] $path, [string] $property) {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($path, 0))
            $query = "SELECT Value FROM Property WHERE Property = '$property'"
            $view = $database.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $database, $query)
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $record) { throw "$path has no $property property." }
            $value = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
            $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
            return $value
          }

          foreach ($installer in $installers) {
            if ($installer.Extension -eq '.msi') {
              $name = Get-MsiProperty $installer.FullName 'ProductName'
              $version = Get-MsiProperty $installer.FullName 'ProductVersion'
            } else {
              # Tauri's NSIS template writes ProductName and ProductVersion
              # into the installer's version resource.
              $name = $installer.VersionInfo.ProductName
              $version = $installer.VersionInfo.ProductVersion
            }
            if ($name -ne 'OpenCoven Chat') {
              throw "$($installer.Name) names product '$name', expected 'OpenCoven Chat'."
            }
            if ($version -ne $env:EXPECTED_VERSION) {
              throw "$($installer.Name) reports version '$version', expected $env:EXPECTED_VERSION."
            }
            Write-Host "  ok: $($installer.Name) is $name $version"

            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($env:WINDOWS_SIGNED -eq 'true') {
              if ($signature.Status -ne 'Valid') {
                throw "$($installer.Name) has invalid Authenticode status: $($signature.Status)"
              }
              $publisher = $signature.SignerCertificate.GetNameInfo('SimpleName', $false)
              if ($publisher -ne $env:WINDOWS_PUBLISHER) {
                throw "$($installer.Name) is signed by '$publisher', expected '$env:WINDOWS_PUBLISHER'."
              }
              Write-Host "  ok: $($installer.Name) is signed by $($signature.SignerCertificate.Subject)"
            } else {
              if ($signature.Status -ne 'NotSigned') {
                throw "$($installer.Name) has Authenticode status $($signature.Status), but this run built unsigned."
              }
              Write-Host "::warning::$($installer.Name) is NOT signed (Authenticode status NotSigned); SmartScreen will warn before it runs."
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ env.STAGE_DIR }}/**
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assemble the checksums and the updater manifest, re-verify every artifact
  # against its checksum, and publish the GitHub release.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-signing
    permissions:
      # The only place in the workflow that writes: creating the release and
      # uploading its assets.
      contents: write
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: staging
          merge-multiple: true

      - name: Flatten and inventory artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # The .app tar was only needed for the smoke test; it is not a release
          # asset, so it is excluded here.
          while IFS= read -r -d '' artifact; do
            # GitHub serves an uploaded asset with each space replaced by a
            # dot. Rename to that here, before SHA256SUMS and latest.json are
            # written, so both name the files people download (assetName in
            # scripts/release-smoke.mjs).
            name=$(basename "${artifact}")
            name="${name// /.}"
            destination="release/${name}"
            if [ -e "${destination}" ]; then
              echo "::error::Duplicate release asset name: ${name}"
              exit 1
            fi
            cp -v "${artifact}" "${destination}"
          done < <(find staging -type f ! -name '*.app.tar' -print0)
          if [ -z "$(ls -A release)" ]; then
            echo "::error::No artifacts were downloaded from the build jobs."
            exit 1
          fi
          echo "Release assets:"
          ls -la release

      # Write the updater feed (latest.json) only when the build jobs reported
      # the updater on. Every signed artifact must be present: a feed missing a
      # platform would leave that platform's installs behind without a word.
      # Older tagged trees configure no updater, so this never runs against
      # them, and the script it calls exists in every tree that does.
      - name: Generate latest.json updater manifest
        shell: bash
        env:
          REPO: ${{ github.repository }}
          UPDATER: ${{ needs.build.outputs.updater }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sigs=( release/*.sig )
          if [ "${UPDATER}" != "on" ]; then
            if [ "${#sigs[@]}" -ne 0 ]; then
              echo "::error::Updater signatures are present, but the build jobs reported the updater off."
              exit 1
            fi
            echo "::notice::The updater is off for this run; no latest.json is written (docs/releasing.md § 4)."
            exit 0
          fi
          node scripts/updater-manifest.mjs --dir release --version "${VERSION}" \
            --tag "${TAG}" --repo "${REPO}" --out release/latest.json

      # Generate this after latest.json so every asset that can be published is
      # covered by the checksum manifest, then verify those exact bytes in place.
      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          : > SHA256SUMS
          shopt -s nullglob
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            shasum -a 256 "$f" >> SHA256SUMS
          done
          if [ ! -s SHA256SUMS ]; then
            echo "::error::SHA256SUMS is empty; nothing to publish."
            exit 1
          fi
          echo "SHA256SUMS:"
          cat SHA256SUMS
          echo "Verifying checksums..."
          shasum -a 256 -c SHA256SUMS

      # Check the assembled set as a whole before anything is published: every
      # installer exactly once, SHA256SUMS covering every asset, version and
      # identity agreeing with the tagged tree, and the updater and signing
      # state stated in the summary rather than implied.
      - name: Smoke-test the assembled release
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          WINDOWS_SIGNED: ${{ needs.build.outputs.windows_signed }}
          UPDATER: ${{ needs.build.outputs.updater }}
        run: |
          set -euo pipefail
          args=(--dir release --version "${VERSION}" --tag "${TAG}")
          if [ "${ALLOW_UNSIGNED:-false}" = "true" ]; then
            args+=(--allow-unsigned)
          fi
          # Only a tree that configures the updater can report it on, and the
          # smoke script in such a tree knows the flag; older trees never get it.
          if [ "${UPDATER}" = "on" ]; then
            args+=(--updater on)
          fi
          if [ "${WINDOWS_SIGNED}" = "true" ]; then
            args+=(--windows-signing signed)
          else
            args+=(--windows-signing unsigned)
          fi
          # Capture the status so a failing report still reaches the summary.
          status=0
          node scripts/release-smoke.mjs "${args[@]}" > release-smoke.json || status=$?
          cat release-smoke.json
          {
            echo "### Release smoke test"
            echo
            echo '```json'
            cat release-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      # Publish with the gh CLI (pre-installed on the runner) so no additional
      # third-party action needs pinning. --verify-tag makes gh refuse a tag
      # that does not exist on the remote; the signature gate already ran in
      # verify-tag.
      - name: Publish GitHub release
        if: needs.verify-tag.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a tag push. verify-tag already refuses an allow_unsigned
          # run that is not a dry run; this repeats the refusal where the
          # release is actually created.
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          WINDOWS_SIGNED: ${{ needs.build.outputs.windows_signed }}
        run: |
          set -euo pipefail

          if [ "${ALLOW_UNSIGNED:-false}" = "true" ]; then
            echo "::error::Refusing to publish an allow_unsigned build. Its artifacts are rehearsal output and must not be handed to users."
            exit 1
          fi

          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for ${TAG}; refuse to replace published assets. Cut a new tag or explicitly remove the existing release first."
            exit 1
          fi

          args=(
            "${TAG}"
            --repo "${{ github.repository }}"
            --title "OpenCoven Chat ${VERSION}"
            --verify-tag
            --draft
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          if [ -f release/latest.json ]; then
            updater_note='Installed copies with auto-update find this version through the `updater` feed once this release is published.'
          else
            updater_note='This release has no `latest.json`; auto-update is not enabled.'
          fi
          # The Windows installers' signing state is a fact about the download,
          # so the generated body states it even before the human-written notes
          # are applied (docs/releasing.md § 1, step 10).
          if [ "${WINDOWS_SIGNED}" = "true" ]; then
            windows_note='The Windows installers are Authenticode-signed.'
          else
            windows_note='**Windows:** the `.msi` and `.exe` installers are not code-signed yet, so Windows SmartScreen shows "Windows protected your PC" the first time one runs. Check the download against `SHA256SUMS` first, then choose **More info** and **Run anyway**.'
          fi
          notes="Automated release of OpenCoven Chat ${VERSION}.

          Verify downloads against \`SHA256SUMS\`:

              shasum -a 256 -c SHA256SUMS

          ${windows_note}

          ${updater_note}"

          args+=(--notes "${notes}")
          gh release create "${args[@]}" release/*
          gh release edit "${TAG}" --repo "${{ github.repository }}" --draft=false

      # Installed apps read one fixed URL,
      #   https://github.com/<repo>/releases/download/updater/latest.json
      # because every Chat release is a pre-release and GitHub's
      # releases/latest skips those (decided on #356, 2026-10-18). That feed
      # is the only thing that changes after a release: the per-version assets
      # above stay immutable. It moves only after the version release is
      # published and its own latest.json passed the smoke test, never on a
      # dry run or an allow_unsigned rehearsal. Rollback is docs/releasing.md
      # § 6.1: remove or supersede the feed, never point it at an older
      # version.
      - name: Point the auto-update feed at this release
        if: needs.verify-tag.outputs.dry_run != 'true' && needs.build.outputs.updater == 'on'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${ALLOW_UNSIGNED:-false}" = "true" ]; then
            echo "::error::Refusing to move the auto-update feed from an allow_unsigned run."
            exit 1
          fi
          if [ ! -s release/latest.json ]; then
            echo "::error::The updater is on but release/latest.json is missing; the feed is unchanged."
            exit 1
          fi
          if ! gh release view updater --repo "${REPO}" >/dev/null 2>&1; then
            gh release create updater --repo "${REPO}" --target "${SHA}" \
              --title "Auto-update feed" --prerelease --latest=false \
              --notes "Installed copies of OpenCoven Chat read latest.json from this release to find updates. The release workflow replaces it after each published release. Do not delete this release or its asset: installed apps would stop finding updates. See docs/releasing.md § 4 and § 6.1."
          fi
          gh release upload updater release/latest.json --repo "${REPO}" --clobber
          # Read back what installed apps will fetch, by the URL they use. The
          # replaced asset can take a moment to be served, so compare a few
          # times before calling it a failure.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://github.com/${REPO}/releases/download/updater/latest.json" \
                 -o served-latest.json && cmp -s served-latest.json release/latest.json; then
              echo "The auto-update feed now offers ${VERSION}."
              exit 0
            fi
            echo "The served feed does not match yet (attempt ${attempt} of 6); checking again in 10s..."
            sleep 10
          done
          echo "::error::The feed served at releases/download/updater/latest.json differs from this release's latest.json."
          exit 1

      - name: Summarize dry run
        if: needs.verify-tag.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Dry run for \`${TAG}\`"
            echo
            echo "Tag verification, tagged-tree tests, all platform builds, smoke tests, and checksum verification passed."
            echo
            echo "No GitHub Release was created."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
