[package]
name = "opencoven-chat"
version = "0.1.0"
description = "OpenCoven Chat desktop scaffold"
edition = "2021"
rust-version = "1.95.0"

[lib]
name = "opencoven_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "=1.0.145"
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
base64 = "=0.22.1"
keyring-core = "=1.0.0"
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.2", features = [] }
tokio = { version = "=1.50.0", features = ["time"] }
uuid = { version = "=1.26.0", features = ["v4"] }
zeroize = "=1.9.0"

[dev-dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }
